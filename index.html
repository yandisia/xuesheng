.popup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:#fffdf5;border:4px solid #f3d19b;border-radius:40px;box-shadow:0 20px 40px rgba(0,0,0,.25);padding:20px;max-width:560px;width:90%;max-height:75vh;overflow-y:auto;z-index:1000;opacity:0;pointer-events:none;transition:.2s}

{name:"Unit 3 What's the weather like?",words:[{en:"weather",ipa:"/ˈweðə/",zh:"天气"},{en:"sunny",ipa:"/ˈsʌni/",zh:"阳光充足的"},{en:"cloud",ipa:"/klaʊd/",zh:"云"},{en:"cloudy",ipa:"/ˈklaʊdi/",zh:"多云的"},{en:"wind",ipa:"/wɪnd/",zh:"风"},{en:"windy",ipa:"/ˈwɪndi/",zh:"风大的"},{en:"rain",ipa:"/reɪn/",zh:"雨"},{en:"rainy",ipa:"/ˈreɪni/",zh:"下雨的"},{en:"snow",ipa:"/snəʊ/",zh:"雪"},{en:"snowy",ipa:"/ˈsnəʊi/",zh:"下雪的"},{en:"cold",ipa:"/kəʊld/",zh:"冷的"},{en:"warm",ipa:"/wɔːm/",zh:"温暖的"},{en:"hot",ipa:"/hɒt/",zh:"炎热的"},{en:"cool",ipa:"/kuːl/",zh:"凉爽的"},{en:"report",ipa:"/rɪˈpɔːt/",zh:"报道"},{en:"TV",ipa:"/tiː viː/",zh:"电视"},{en:"coat",ipa:"/kəʊt/",zh:"外套"},{en:"umbrella",ipa:"/ʌmˈbrelə/",zh:"雨伞"},{en:"diary",ipa:"/ˈdaɪəri/",zh:"日记"}],phrases:[{en:"weather report",ipa:"/ˈweðə rɪˈpɔːt/",zh:"天气预报"},{en:"watch the report",ipa:"/wɒtʃ ðə rɪˈpɔːt/",zh:"看报道"},{en:"go out to play",ipa:"/ɡəʊ aʊt tu pleɪ/",zh:"外出游玩"},{en:"go home",ipa:"/ɡəʊ həʊm/",zh:"回家"},{en:"turn on the TV",ipa:"/tɜːn ɒn ðə tiː viː/",zh:"打开电视"},{en:"in the sun",ipa:"/ɪn ðə sʌn/",zh:"在太阳下"},{en:"play in the snow",ipa:"/pleɪ ɪn ðə snəʊ/",zh:"在雪中玩"},{en:"What's the weather like?",ipa:"/wɒts ðə ˈweðə laɪk/",zh:"天气怎么样？"}],sentences:[{en:"The sun comes up, up, up.",ipa:"/ðə sʌn kʌmz ʌp ʌp ʌp/",zh:"太阳升起来，升起来，升起来。",point:"come up = 升起。"},{en:"It's sunny, sunny, sunny.",ipa:"/ɪts ˈsʌni ˈsʌni ˈsʌni/",zh:"天气晴朗，晴朗，晴朗。",point:"It's + 天气形容词。"},{en:"It's cloudy, cloudy, cloudy.",ipa:"/ɪts ˈklaʊdi ˈklaʊdi ˈklaʊdi/",zh:"多云，多云，多云。",point:"cloud + y = cloudy。"},{en:"The wind blows around, around, around.",ipa:"/ðə wɪnd bləʊz əˈraʊnd əˈraʊnd əˈraʊnd/",zh:"风到处吹，吹，吹。",point:"blow around = 到处吹。"},{en:"It's windy, windy, windy.",ipa:"/ɪts ˈwɪndi ˈwɪndi ˈwɪndi/",zh:"刮风，刮风，刮风。",point:"wind + y = windy。"},{en:"It's rainy, rainy, rainy.",ipa:"/ɪts ˈreɪni ˈreɪni ˈreɪni/",zh:"下雨，下雨，下雨。",point:"rain + y = rainy。"},{en:"It's snowy, snowy, snowy.",ipa:"/ɪts ˈsnəʊi ˈsnəʊi ˈsnəʊi/",zh:"下雪，下雪，下雪。",point:"snow + y = snowy。"},{en:"In any weather, we have fun.",ipa:"/ɪn ˈeni ˈweðə wiː hæv fʌn/",zh:"在任何天气里，我们都玩得开心。",point:"have fun = 玩得开心。"},{en:"Hot, cold, cool or warm. Enjoy them all!",ipa:"/hɒt kəʊld kuːl ɔː wɔːm ɪnˈdʒɔɪ ðəm ɔːl/",zh:"热、冷、凉或暖。享受它们吧！",point:"enjoy = 享受。"},{en:"What's the weather like?",ipa:"/wɒts ðə ˈweðə laɪk/",zh:"天气怎么样？",point:"询问天气的固定句型。"},{en:"It's sunny and warm. We can go out to play.",ipa:"/ɪts ˈsʌni ænd wɔːm wiː kæn ɡəʊ aʊt tu pleɪ/",zh:"天气晴朗且温暖。我们可以出去玩。",point:"It's + 天气形容词 + and + 天气形容词。"},{en:"It's windy and cloudy. Let's go home!",ipa:"/ɪts ˈwɪndi ænd ˈklaʊdi lets ɡəʊ həʊm/",zh:"刮风又多云。我们回家吧！",point:"Let's + 动词原形，提出建议。"},{en:"Oh! It's rainy now.",ipa:"/əʊ ɪts ˈreɪni naʊ/",zh:"哦！现在下雨了。",point:"now 表示现在。"},{en:"Look! I've got a good idea.",ipa:"/lʊk aɪv ɡɒt ə ɡʊd aɪˈdɪə/",zh:"看！我有个好主意。",point:"I've got = I have got，表示我有。"},{en:"Our umbrellas are great!",ipa:"/ˈaʊər ʌmˈbreləz ɑː ɡreɪt/",zh:"我们的雨伞很棒！",point:"umbrella 的复数是 umbrellas。"},{en:"What's the weather like today?",ipa:"/wɒts ðə ˈweðə laɪk təˈdeɪ/",zh:"今天天气怎么样？",point:"today 表示今天。"},{en:"Is it cold or hot?",ipa:"/ɪz ɪt kəʊld ɔː hɒt/",zh:"天气是冷的还是热的？",point:"选择疑问句：Is it + A + or + B?"},{en:"Do I need my coat or not?",ipa:"/duː aɪ niːd maɪ kəʊt ɔː nɒt/",zh:"我需要外套吗？",point:"need + 名词，表示需要某物。"},{en:"Come on! Let's turn on the TV.",ipa:"/kʌm ɒn lets tɜːn ɒn ðə tiː viː/",zh:"来吧！我们打开电视。",point:"turn on = 打开。"},{en:"Let's watch the report today!",ipa:"/lets wɒtʃ ðə rɪˈpɔːt təˈdeɪ/",zh:"我们今天看报道吧！",point:"watch the report = 看报道。"},{en:"It's snowy and cold.",ipa:"/ɪts ˈsnəʊi ænd kəʊld/",zh:"下雪而且很冷。",point:"snowy and cold = 下雪且冷。"},{en:"But it's hot in Sanya. It never snows!",ipa:"/bʌt ɪts hɒt ɪn ˈsænjɑː ɪt ˈnevə snəʊz/",zh:"但三亚很热。从不下雪！",point:"never 表示从不。"},{en:"The snow comes from Harbin.",ipa:"/ðə snəʊ kʌmz frɒm ˈhɑːbɪn/",zh:"雪来自哈尔滨。",point:"come from = 来自。"},{en:"It's cold. We're happy!",ipa:"/ɪts kəʊld wɪə ˈhæpi/",zh:"很冷。我们很开心！",point:"We're = We are。"}]},
{name:"Unit 4 Wonderful seasons",words:[{en:"season",ipa:"/ˈsiːzn/",zh:"季节"},{en:"spring",ipa:"/sprɪŋ/",zh:"春天"},{en:"summer",ipa:"/ˈsʌmə/",zh:"夏天"},{en:"autumn",ipa:"/ˈɔːtəm/",zh:"秋天"},{en:"winter",ipa:"/ˈwɪntə/",zh:"冬天"},{en:"favourite",ipa:"/ˈfeɪvərɪt/",zh:"最喜欢的"},{en:"birthday",ipa:"/ˈbɜːθdeɪ/",zh:"生日"},{en:"beach",ipa:"/biːtʃ/",zh:"海滩"},{en:"sea",ipa:"/siː/",zh:"海"},{en:"fly",ipa:"/flaɪ/",zh:"放飞"},{en:"kite",ipa:"/kaɪt/",zh:"风筝"},{en:"picnic",ipa:"/ˈpɪknɪk/",zh:"野餐"},{en:"equator",ipa:"/ɪˈkweɪtə/",zh:"赤道"},{en:"round",ipa:"/raʊnd/",zh:"循环地"},{en:"quite",ipa:"/kwaɪt/",zh:"非常"}],phrases:[{en:"fly kites",ipa:"/flaɪ kaɪts/",zh:"放风筝"},{en:"play in the snow",ipa:"/pleɪ ɪn ðə snəʊ/",zh:"在雪中玩"},{en:"in spring",ipa:"/ɪn sprɪŋ/",zh:"在春天"},{en:"in summer",ipa:"/ɪn ˈsʌmə/",zh:"在夏天"},{en:"in autumn",ipa:"/ɪn ˈɔːtəm/",zh:"在秋天"},{en:"in winter",ipa:"/ɪn ˈwɪntə/",zh:"在冬天"},{en:"go to the beach",ipa:"/ɡəʊ tu ðə biːtʃ/",zh:"去海滩"},{en:"make a snowman",ipa:"/meɪk ə ˈsnəʊmæn/",zh:"堆雪人"},{en:"all year round",ipa:"/ɔːl jɪə raʊnd/",zh:"全年"},{en:"go swimming",ipa:"/ɡəʊ ˈswɪmɪŋ/",zh:"去游泳"},{en:"my favourite season",ipa:"/maɪ ˈfeɪvərɪt ˈsiːzn/",zh:"我最喜欢的季节"}],sentences:[{en:"Spring, summer, autumn and winter. Four seasons in a year.",ipa:"/sprɪŋ ˈsʌmə ˈɔːtəm ænd ˈwɪntə fɔː ˈsiːznz ɪn ə jɪə/",zh:"春天、夏天、秋天和冬天。一年有四个季节。",point:"four seasons = 四个季节。"},{en:"Here comes spring. Flowers are all around.",ipa:"/hɪə kʌmz sprɪŋ ˈflaʊəz ɑː ɔːl əˈraʊnd/",zh:"春天来了。到处都是花。",point:"Here comes... = ……来了。"},{en:"Here comes summer. It's so hot in the sun.",ipa:"/hɪə kʌmz ˈsʌmə ɪts səʊ hɒt ɪn ðə sʌn/",zh:"夏天来了。太阳下很热。",point:"so + 形容词，表示如此……。"},{en:"Here comes autumn. The trees have so many colours.",ipa:"/hɪə kʌmz ˈɔːtəm ðə triːz hæv səʊ ˈmeni ˈkʌləz/",zh:"秋天来了。树木有如此多的颜色。",point:"so many + 复数名词。"},{en:"Here comes winter. It's so much fun with ice and snow.",ipa:"/hɪə kʌmz ˈwɪntə ɪts səʊ mʌtʃ fʌn wɪð aɪs ænd snəʊ/",zh:"冬天来了。有冰和雪，非常有趣。",point:"so much fun = 非常有趣。"},{en:"What's your favourite season, friends?",ipa:"/wɒts jɔː ˈfeɪvərɪt ˈsiːzn frendz/",zh:"朋友们，你们最喜欢的季节是什么？",point:"询问最喜欢的季节。"},{en:"I like winter best. I can play in the snow.",ipa:"/aɪ laɪk ˈwɪntə best aɪ kæn pleɪ ɪn ðə snəʊ/",zh:"我最喜欢冬天。我可以在雪中玩。",point:"like...best = 最喜欢……。"},{en:"I like spring and autumn. They are beautiful.",ipa:"/aɪ laɪk sprɪŋ ænd ˈɔːtəm ðeɪ ɑː ˈbjuːtəfl/",zh:"我喜欢春天和秋天。它们很美。",point:"They are + 形容词。"},{en:"I like summer best. I can eat ice cream.",ipa:"/aɪ laɪk ˈsʌmə best aɪ kæn iːt aɪs kriːm/",zh:"我最喜欢夏天。我可以吃冰激凌。",point:"eat ice cream = 吃冰激凌。"},{en:"What about you, Lingling?",ipa:"/wɒt əˈbaʊt juː ˌlɪŋˈlɪŋ/",zh:"你呢，玲玲？",point:"What about you? 询问对方。"},{en:"Because my birthday is in summer!",ipa:"/bɪˈkɒz maɪ ˈbɜːθdeɪ ɪz ɪn ˈsʌmə/",zh:"因为我的生日在夏天！",point:"because 引导原因状语从句。"},{en:"Spring is here! The birds are back.",ipa:"/sprɪŋ ɪz hɪə ðə bɜːdz ɑː bæk/",zh:"春天来了！鸟儿回来了。",point:"be back = 回来。"},{en:"It's summer. The apple tree is like a sun umbrella.",ipa:"/ɪts ˈsʌmə ði ˈæpl triː ɪz laɪk ə sʌn ʌmˈbrelə/",zh:"夏天到了。苹果树像一把太阳伞。",point:"be like = 像……一样。"},{en:"I like reading under it.",ipa:"/aɪ laɪk ˈriːdɪŋ ˈʌndə ɪt/",zh:"我喜欢在树下读书。",point:"like doing sth. 喜欢做某事。"},{en:"It's autumn. I like autumn best!",ipa:"/ɪts ˈɔːtəm aɪ laɪk ˈɔːtəm best/",zh:"秋天到了。我最喜欢秋天！",point:"like...best = 最喜欢。"},{en:"There are many red apples on the tree!",ipa:"/ðeə ɑː ˈmeni red ˈæplz ɒn ðə triː/",zh:"树上有很多红苹果！",point:"There are + 复数名词。"},{en:"Can I share the apples with my friends?",ipa:"/kæn aɪ ʃeə ði ˈæplz wɪð maɪ frendz/",zh:"我能和朋友们分享苹果吗？",point:"share...with... = 和……分享……。"},{en:"It's winter. My apple tree has warm, new clothes!",ipa:"/ɪts ˈwɪntə maɪ ˈæpl triː hæz wɔːm njuː kləʊðz/",zh:"冬天到了。我的苹果树穿上了温暖的新衣服！",point:"has = 有。"},{en:"A snowstorm comes. Oh, no! My apple tree!",ipa:"/ə ˈsnəʊstɔːm kʌmz əʊ nəʊ maɪ ˈæpl triː/",zh:"暴风雪来了。哦，不！我的苹果树！",point:"snowstorm = 暴风雪。"},{en:"Don't worry. Let's wait for spring.",ipa:"/dəʊnt ˈwʌri lets weɪt fɔː sprɪŋ/",zh:"别担心。我们等春天吧。",point:"wait for = 等待。"},{en:"It's spring again. My apple tree grows again.",ipa:"/ɪts sprɪŋ əˈɡen maɪ ˈæpl triː ɡrəʊz əˈɡen/",zh:"又是春天了。我的苹果树又长出来了。",point:"again = 再次。"},{en:"On the equator, there is no winter.",ipa:"/ɒn ði ɪˈkweɪtə ðeər ɪz nəʊ ˈwɪntə/",zh:"在赤道上，没有冬天。",point:"no winter = 没有冬天。"},{en:"It's a hot, hot summer, all year round.",ipa:"/ɪts ə hɒt hɒt ˈsʌmə ɔːl jɪə raʊnd/",zh:"全年都是炎热的夏天。",point:"all year round = 全年。"},{en:"Join us and play!",ipa:"/dʒɔɪn ʌs ænd pleɪ/",zh:"加入我们一起玩！",point:"join = 加入。"},{en:"It's winter in Harbin now. What season is it in Sydney?",ipa:"/ɪts ˈwɪntə ɪn ˈhɑːbɪn naʊ wɒt ˈsiːzn ɪz ɪt ɪn ˈsɪdni/",zh:"哈尔滨现在是冬天。悉尼是什么季节？",point:"What season is it in...? 询问某地是什么季节。"},{en:"My favourite season is summer.",ipa:"/maɪ ˈfeɪvərɪt ˈsiːzn ɪz ˈsʌmə/",zh:"我最喜欢的季节是夏天。",point:"My favourite season is... 我最喜欢的季节是……。"},{en:"In summer, it's hot. I can swim in the sea with my parents.",ipa:"/ɪn ˈsʌmə ɪts hɒt aɪ kæn swɪm ɪn ðə siː wɪð maɪ ˈpeərənts/",zh:"夏天很热。我可以和父母在海里游泳。",point:"with my parents = 和我的父母一起。"}]},

point:"on a plane = 在飞机上。"},{en:"What a long way! Here we are! Hello, Qatar!",ipa:"/wɒt ə lɒŋ weɪ hɪə wiː ɑː həˈləʊ ˈkætɑː/",zh:"好远的路！我们到了！你好，卡塔尔！",point:"What a long way! = 好远的路！"},{en:"We go to our new home by truck.",ipa:"/wiː ɡəʊ tu ˈaʊə njuː həʊm baɪ trʌk/",zh:"我们乘卡车去我们的新家。",point:"by truck = 乘卡车。"},{en:"It comes from China by plane!",ipa:"/ɪt kʌmz frɒm ˈtʃaɪnə baɪ pleɪn/",zh:"它乘飞机从中国来！",point:"come from = 来自。"},{en:"We are happy!",ipa:"/wiː ɑː ˈhæpi/",zh:"我们很开心！",point:"happy = 开心的。"},{en:"I go by bike. Ring, ring, ring.",ipa:"/aɪ ɡəʊ baɪ baɪk rɪŋ rɪŋ rɪŋ/",zh:"我骑自行车去。铃，铃，铃。",point:"by bike = 骑自行车。"},{en:"She goes by bus. Beep, beep, beep.",ipa:"/ʃiː ɡəʊz baɪ bʌs biːp biːp biːp/",zh:"她乘公共汽车去。嘀，嘀，嘀。",point:"by bus = 乘公共汽车。"},{en:"He goes by subway. Whoosh, whoosh, whoosh.",ipa:"/hiː ɡəʊz baɪ ˈsʌbweɪ wuːʃ wuːʃ wuːʃ/",zh:"他乘地铁去。嗖，嗖，嗖。",point:"by subway = 乘地铁。"},{en:"They go by tram. Chug, chug, chug.",ipa:"/ðeɪ ɡəʊ baɪ træm tʃʌɡ tʃʌɡ tʃʌɡ/",zh:"他们乘有轨电车去。突突突。",point:"by tram = 乘有轨电车。"},{en:"How do you go to school, Luoluo?",ipa:"/haʊ duː juː ɡəʊ tu skuːl ˈlwɒlwɒ/",zh:"落落，你怎么去学校？",point:"How do you go to school? 询问出行方式。"},{en:"I go by car.",ipa:"/aɪ ɡəʊ baɪ kɑː/",zh:"我乘小汽车去。",point:"by car = 乘小汽车。"},{en:"My family travel in four ways.",ipa:"/maɪ ˈfæməli ˈtrævl ɪn fɔː weɪz/",zh:"我的家庭以四种方式出行。",point:"in four ways = 以四种方式。"},{en:"My dad and mum go to work by car.",ipa:"/maɪ dæd ænd mʌm ɡəʊ tu wɜːk baɪ kɑː/",zh:"我爸爸妈妈乘小汽车去上班。",point:"go to work = 去上班。"},{en:"My sister goes to school in a 'green' way. She walks there.",ipa:"/maɪ ˈsɪstə ɡəʊz tu skuːl ɪn ə ɡriːn weɪ ʃiː wɔːks ðeə/",zh:"我妹妹以“绿色”方式去学校。她走路去那里。",point:"walk there = 走路去那里。"}]},

ight = 右转。"},{en:"Here's the sports centre.",ipa:"/hɪəz ðə spɔːts ˈsentə/",zh:"体育中心到了。",point:"Here's = Here is。"},{en:"My cat Susu goes out every morning!",ipa:"/maɪ kæt ˈsuːsuː ɡəʊz aʊt ˈevri ˈmɔːnɪŋ/",zh:"我的猫苏苏每天早上都出去！",point:"every morning = 每天早上。"},{en:"Where does she go?",ipa:"/weə dʌz ʃiː ɡəʊ/",zh:"她去哪里？",point:"Where does + 主语 + 动词原形? 询问去哪里。"},{en:"I don't know!",ipa:"/aɪ dəʊnt nəʊ/",zh:"我不知道！",point:"I don't know = 我不知道。"},{en:"Let's find out tomorrow.",ipa:"/lets faɪnd aʊt təˈmɒrəʊ/",zh:"我们明天查清楚吧。",point:"find out = 查清楚。"},{en:"Susu goes straight on to the museum. She turns left there.",ipa:"/ˈsuːsuː ɡəʊz streɪt ɒn tu ðə mjuˈziːəm ʃiː tɜːnz left ðeə/",zh:"苏苏直走去博物馆。她在那里左转。",point:"go straight on = 直走。turn left = 左转。"},{en:"At the hospital, she turns right.",ipa:"/æt ðə ˈhɒspɪtl ʃiː tɜːnz raɪt/",zh:"在医院，她右转。",point:"turn right = 右转。"},{en:"Then Susu stops. Let's go there!",ipa:"/ðen ˈsuːsuː stɒps lets ɡəʊ ðeə/",zh:"然后苏苏停下来。我们去那里！",point:"stop = 停下。"},{en:"Susu, here you are!",ipa:"/ˈsuːsuː hɪə juː ɑː/",zh:"苏苏，你在这里！",point:"Here you are = 你在这里。"},{en:"Your cat visits me every day. She's my good friend!",ipa:"/jɔː kæt ˈvɪzɪts miː ˈevri deɪ ʃiːz maɪ ɡʊd frend/",zh:"你的猫每天来看我。她是我的好朋友！",point:"visit = 拜访。"},{en:"Can you tell me the way to the sports centre from the hospital, please?",ipa:"/kæn juː tel miː ðə weɪ tu ðə spɔːts ˈsentə frɒm ðə ˈhɒspɪtl pliːz/",zh:"请问你能告诉我去体育中心的路吗？",point:"Can you tell me the way to...? 询问路线。"},{en:"Sure. Go straight and turn right.",ipa:"/ʃʊə ɡəʊ streɪt ænd tɜːn raɪt/",zh:"当然。直走然后右转。",point:"Sure = 当然。"},{en:"Yanyan can't see. She goes to school with her mum's help every day.",ipa:"/ˈjænjæn kɑːnt siː ʃiː ɡəʊz tu skuːl wɪð hɜː mʌmz help ˈevri deɪ/",zh:"燕燕看不见。她每天在妈妈的帮助下上学。",point:"with one's help = 在某人的帮助下。"},{en:"Mum, let me go to school on my own today.",ipa:"/mʌm let miː ɡəʊ tu skuːl ɒn maɪ əʊn təˈdeɪ/",zh:"妈妈，让我今天自己去上学。",point:"on my own = 独自。"},{en:"Are you sure?",ipa:"/ɑː juː ʃʊə/",zh:"你确定吗？",point:"Are you sure? = 你确定吗？"},{en:"Yes. I can do it.",ipa:"/jes aɪ kæn duː ɪt/",zh:"是的。我能做到。",point:"I can do it = 我能做到。"},{en:"Great! Cross the road. Turn left. The school is on your right.",ipa:"/ɡreɪt krɒs ðə rəʊd tɜːn left ðə skuːl ɪz ɒn jɔː raɪt/",zh:"太棒了！过马路。左转。学校在你的右边。",point:"cross the road = 过马路。on your right = 在你的右边。"},{en:"Be careful, my girl!",ipa:"/biː ˈkeəfl maɪ ɡɜːl/",zh:"小心，我的孩子！",point:"be careful = 小心。"},{en:"I'm at school now, Mum!",ipa:"/aɪm æt skuːl naʊ mʌm/",zh:"我现在在学校了，妈妈！",point:"at school = 在学校。"},{en:"Well done, Yanyan!",ipa:"/wel dʌn ˈjænjæn/",zh:"做得好，燕燕！",point:"well done = 做得好。"},{en:"First, she goes straight on. She walks 50 steps.",ipa:"/fɜːst ʃiː ɡəʊz streɪt ɒn ʃiː wɔːks ˈfɪfti steps/",zh:"首先，她直走。她走50步。",point:"first = 首先。walk 50 steps = 走50步。"},{en:"Then she crosses the road and turns left. The school is on her right.",ipa:"/ðen ʃiː ˈkrɒsɪz ðə rəʊd ænd tɜːnz left ðə skuːl ɪz ɒn hɜː raɪt/",zh:"然后她过马路并左转。学校在她的右边。",point:"then = 然后。cross the road = 过马路。"},{en:"How do you go to school from your home?",ipa:"/haʊ duː juː ɡəʊ tu skuːl frɒm jɔː həʊm/",zh:"你从家怎么去学校？",point:"How do you go to school? 询问出行方式。"},{en:"This is London, with so many things to see.",ipa:"/ðɪs ɪz ˈlʌndən wɪð səʊ ˈmeni θɪŋz tu siː/",zh:"这是伦敦，有那么多东西可看。",point:"with = 有。"},{en:"But how do we get around the city?",ipa:"/bʌt haʊ duː wiː ɡet əˈraʊnd ðə ˈsɪti/",zh:"但我们怎么在城市里到处走呢？",point:"get around = 到处走。"},{en:"Don't worry. It's easy!",ipa:"/dəʊnt ˈwʌri ɪts ˈiːzi/",zh:"别担心。很容易！",point:"Don't worry = 别担心。"},{en:"Walk to places near to here, and buses run from here to there.",ipa:"/wɔːk tu ˈpleɪsɪz nɪə tu hɪə ænd ˈbʌsɪz rʌn frɒm hɪə tu ðeə/",zh:"步行去附近的地方，公共汽车从这里到那里。",point:"near to here = 离这里近。"},{en:"There is a train. It goes underground.",ipa:"/ðeər ɪz ə treɪn ɪt ɡəʊz ˈʌndəɡraʊnd/",zh:"有一列火车。它在地下行驶。",point:"go underground = 在地下行驶。"},{en:"One, two, three. Let's go around.",ipa:"/wʌn tuː θriː lets ɡəʊ əˈraʊnd/",zh:"一、二、三。我们到处走走吧。",point:"Let's go around = 我们到处走走。"},{en:"From my home, go straight on and turn left. Then you can find a sports centre...",ipa:"/frɒm maɪ həʊm ɡəʊ streɪt ɒn ænd tɜːn left ðen juː kæn faɪnd ə spɔːts ˈsentə/",zh:"从我家，直走然后左转。然后你能找到一个体育中心……",point:"描述路线。"},{en:"I want a big park. I can play in the park.",ipa:"/aɪ wɒnt ə bɪɡ pɑːk aɪ kæn pleɪ ɪn ðə pɑːk/",zh:"我想要一个大公园。我可以在公园里玩。",point:"I want + 名词，表示我想要……。"},{en:"This is my dream town. It has got many interesting places.",ipa:"/ðɪs ɪz maɪ driːm taʊn ɪt hæz ɡɒt ˈmeni ˈɪntrəstɪŋ ˈpleɪsɪz/",zh:"这是我的梦想城镇。它有很多有趣的地方。",point:"has got = 有。"},{en:"This is a book. It's the library.",ipa:"/ðɪs ɪz ə bʊk ɪts ðə ˈlaɪbrəri/",zh:"这是一本书。它是图书馆。",point:"This is... 介绍事物。"},{en:"Guess! You can buy food here, but you can't eat here.",ipa:"/ɡes juː kæn baɪ fuːd hɪə bʌt juː kɑːnt iːt hɪə/",zh:"猜！你可以在这里买食物，但不能在这里吃。",point:"can't = 不能。"},{en:"Now I can name places.",ipa:"/naʊ aɪ kæn neɪm ˈpleɪsɪz/",zh:"现在我能说出地方名称。",point:"name places = 说出地方名称。"},{en:"Use 'Go straight on.' and 'Turn left / right.' to show the way to places.",ipa:"/juːz ɡəʊ streɪt ɒn ænd tɜːn left raɪt tu ʃəʊ ðə weɪ tu ˈpleɪsɪz/",zh:"用“直走”和“左转/右转”来指路。",point:"show the way = 指路。"},{en:"Symbols on a map help you to find important places.",ipa:"/ˈsɪmblz ɒn ə mæp help juː tu faɪnd ɪmˈpɔːtənt ˈpleɪsɪz/",zh:"地图上的符号帮助你找到重要的地方。",point:"help sb. to do sth. = 帮助某人做某事。"}]}

:"我是一名农民。",point:"农民 = farmer。"},{en:"I'm a cook.",ipa:"/aɪm ə kʊk/",zh:"我是一名厨师。",point:"cook 既是动词也是名词。"},{en:"I'm a police officer.",ipa:"/aɪm ə pəˈliːs ˈɒfɪsə/",zh:"我是一名警官。",point:"police officer = 警官。"},{en:"What does Lingling's father do?",ipa:"/wɒt dʌz ˌlɪŋˈlɪŋz ˈfɑːðə duː/",zh:"玲玲的爸爸是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"Is he a farmer?",ipa:"/ɪz hiː ə ˈfɑːmə/",zh:"他是农民吗？",point:"Is he a...? 询问职业。"},{en:"No, he isn't. But he often works in the fields.",ipa:"/nəʊ hiː ˈɪznt bʌt hiː ˈɒfn wɜːks ɪn ðə fiːldz/",zh:"不，他不是。但他经常在田地里工作。",point:"often = 经常。in the fields = 在田地里。"},{en:"Is he a painter?",ipa:"/ɪz hiː ə ˈpeɪntə/",zh:"他是画家吗？",point:"painter = 画家。"},{en:"No, he isn't. But he uses his brush a lot.",ipa:"/nəʊ hiː ˈɪznt bʌt hiː ˈjuːzɪz hɪz brʌʃ ə lɒt/",zh:"不，他不是。但他经常使用他的刷子。",point:"uses 是 use 的第三人称单数形式。"},{en:"I know! He's a scientist!",ipa:"/aɪ nəʊ hiːz ə ˈsaɪəntɪst/",zh:"我知道！他是一名科学家！",point:"scientist = 科学家。"},{en:"That's right!",ipa:"/ðæts raɪt/",zh:"没错！",point:"That's right = 没错。"},{en:"This is my father. He often works in the fields.",ipa:"/ðɪs ɪz maɪ ˈfɑːðə hiː ˈɒfn wɜːks ɪn ðə fiːldz/",zh:"这是我的爸爸。他经常在田地里工作。",point:"This is... 介绍人物。"},{en:"What does your aunt do?",ipa:"/wɒt dʌz jɔː ɑːnt duː/",zh:"你的阿姨是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"She's a cook.",ipa:"/ʃiːz ə kʊk/",zh:"她是一名厨师。",point:"She's = She is。"},{en:"Yes, I come out at night. But many people are 'night owls', too.",ipa:"/jes aɪ kʌm aʊt æt naɪt bʌt ˈmeni ˈpiːpl ɑː naɪt aʊlz tuː/",zh:"是的，我晚上出来。但很多人也是“夜猫子”。",point:"come out = 出来。night owls 指夜猫子。"},{en:"Bus drivers and taxi drivers work at night. They take people home.",ipa:"/bʌs ˈdraɪvəz ænd ˈtæksi ˈdraɪvəz wɜːk æt naɪt ðeɪ teɪk ˈpiːpl həʊm/",zh:"公共汽车司机和出租车司机晚上工作。他们送人们回家。",point:"work at night = 晚上工作。take people home = 送人们回家。"},{en:"Police officers and firemen work at night, too. They keep the city safe.",ipa:"/pəˈliːs ˈɒfɪsəz ænd ˈfaɪəmən wɜːk æt naɪt tuː ðeɪ kiːp ðə ˈsɪti seɪf/",zh:"警察和消防员晚上也工作。他们保护城市安全。",point:"keep the city safe = 保护城市安全。"},{en:"Doctors and nurses are busy at night. They help people.",ipa:"/ˈdɒktəz ænd ˈnɜːsɪz ɑː ˈbɪzi æt naɪt ðeɪ help ˈpiːpl/",zh:"医生和护士晚上很忙。他们帮助人们。",point:"be busy = 忙碌。"},{en:"So many people work at night. They light up the night for others.",ipa:"/səʊ ˈmeni ˈpiːpl wɜːk æt naɪt ðeɪ laɪt ʌp ðə naɪt fɔː ˈʌðəz/",zh:"很多人在晚上工作。他们为他人照亮夜晚。",point:"light up = 照亮。"},{en:"I work at night, too. Time to go!",ipa:"/aɪ wɜːk æt naɪt tuː taɪm tu ɡəʊ/",zh:"我也在晚上工作。该走了！",point:"Time to go! = 该走了！"},{en:"Uncle Jake likes to bake.",ipa:"/ˈʌŋkl dʒeɪk laɪks tu beɪk/",zh:"杰克叔叔喜欢烘焙。",point:"like to do sth. = 喜欢做某事。"},{en:"He can make the best cake.",ipa:"/hiː kæn meɪk ðə best keɪk/",zh:"他能做出最好的蛋糕。",point:"the best = 最好的。"},{en:"He works hard, day after day.",ipa:"/hiː wɜːks hɑːd deɪ ˈɑːftə deɪ/",zh:"他日复一日地努力工作。",point:"day after day = 日复一日。"},{en:"He is like a bee, very busy.",ipa:"/hiː ɪz laɪk ə biː ˈveri ˈbɪzi/",zh:"他像蜜蜂一样，非常忙碌。",point:"like a bee = 像蜜蜂一样。"},{en:"I love my job. It feels great.",ipa:"/aɪ lʌv maɪ dʒɒb ɪt fiːlz ɡreɪt/",zh:"我热爱我的工作。感觉很好。",point:"feel great = 感觉很好。"},{en:"I can make the world a sweet place.",ipa:"/aɪ kæn meɪk ðə wɜːld ə swiːt pleɪs/",zh:"我可以让世界变得更甜蜜。",point:"make + 名词 + 形容词 = 使……变得……。"},{en:"Zhang Guimei works at a high school.",ipa:"/dʒɑːŋ ɡweɪ meɪ wɜːks æt ə haɪ skuːl/",zh:"张桂梅在一所高中工作。",point:"work at = 在……工作。"},{en:"The school is for girls from poor families.",ipa:"/ðə skuːl ɪz fɔː ɡɜːlz frɒm pʊə ˈfæməliz/",zh:"这所学校是为贫困家庭的女孩办的。",point:"from poor families = 来自贫困家庭。"},{en:"She works very hard and changes their lives.",ipa:"/ʃiː wɜːks ˈveri hɑːd ænd ˈtʃeɪndʒɪz ðeə lɪvz/",zh:"她工作非常努力，改变了她们的生活。",point:"change one's life = 改变某人的生活。"},{en:"Ge Jun brings letters to people on mountains.",ipa:"/ɡɜː dʒuːn brɪŋz ˈletəz tu ˈpiːpl ɒn ˈmaʊntənz/",zh:"葛军把信带给山上的人们。",point:"bring sth. to sb. = 把某物带给某人。"},{en:"It's very cold. But he never stops.",ipa:"/ɪts ˈveri kəʊld bʌt hiː ˈnevə stɒps/",zh:"天气很冷。但他从不停止。",point:"never = 从不。"},{en:"Yang Qiming drives the last bus at night.",ipa:"/jɑːŋ tʃiː mɪŋ draɪvz ðə lɑːst bʌs æt naɪt/",zh:"杨启明晚上开末班车。",point:"drive = 驾驶。"},{en:"Many people take his bus. He takes them home every night.",ipa:"/ˈmeni ˈpiːpl teɪk hɪz bʌs hiː teɪks ðəm həʊm ˈevri naɪt/",zh:"很多人乘坐他的车。他每晚送他们回家。",point:"take them home = 送他们回家。"},{en:"I want to be a teacher and work at a school.",ipa:"/aɪ wɒnt tu biː ə ˈtiːtʃə ænd wɜːk æt ə skuːl/",zh:"我想成为一名老师并在学校工作。",point:"want to be = 想成为。"},{en:"I want to teach students Chinese.",ipa:"/aɪ wɒnt tu tiːtʃ ˈstjuːdnts ˌtʃaɪˈniːz/",zh:"我想教学生中文。",point:"teach sb. sth. = 教某人某物。"},{en:"I want to be a fireman and work in a fire station.",ipa:"/aɪ wɒnt tu biː ə ˈfaɪəmən ænd wɜːk ɪn ə ˈfaɪə ˈsteɪʃn/",zh:"我想成为一名消防员并在消防站工作。",point:"fire station = 消防站。"},{en:"It's cool and I want to help people.",ipa:"/ɪts kuːl ænd aɪ wɒnt tu help ˈpiːpl/",zh:"那很酷，我想帮助人们。",point:"help people = 帮助人们。"},{en:"What is your dream job?",ipa:"/wɒt ɪz jɔː driːm dʒɒb/",zh:"你的梦想职业是什么？",point:"dream job = 梦想职业。"},{en:"Where do you work?",ipa:"/weə duː juː wɜːk/",zh:"你在哪里工作？",point:"Where do you work? 询问工作地点。"},{en:"Who do you work with?",ipa:"/huː duː juː wɜːk wɪð/",zh:"你和谁一起工作？",point:"Who do you work with? 询问工作伙伴。"},{en:"What do you do at work?",ipa:"/wɒt duː juː duː æt wɜːk/",zh:"你在工作中做什么？",point:"What do you do at work? 询问工作内容。"},{en:"I want to be...",ipa:"/aɪ wɒnt tu biː/",zh:"我想成为……",point:"I want to be... 表达梦想。"},{en:"How does bread go from the farm to the table?",ipa:"/haʊ dʌz bred ɡəʊ frɒm ðə fɑːm tu ðə ˈteɪbl/",zh:"面包是怎么从农场到餐桌的？",point:"from...to... = 从……到……。"}]},
{name:"Unit 2 How do you feel today?",words:[{en:"laugh",ipa:"/lɑːf/",zh:"笑"},{en:"sad",ipa:"/sæd/",zh:"伤心的"},{en:"scared",ipa:"/skeəd/",zh:"害怕的"},{en:"angry",ipa:"/ˈæŋɡri/",zh:"生气的"},{en:"excited",ipa:"/ɪkˈsaɪtɪd/",zh:"兴奋的"},{en:"opera",ipa:"/ˈɒprə/",zh:"歌剧"},{en:"next",ipa:"/nekst/",zh:"紧接着的"},{en:"cough",ipa:"/kɒf/",zh:"咳嗽"},{en:"better",ipa:"/ˈbetə/",zh:"好转的"},{en:"gift",ipa:"/ɡɪft/",zh:"礼物"},{en:"model",ipa:"/ˈmɒdl/",zh:"模型"},{en:"shout",ipa:"/ʃaʊt/",zh:"喊叫"},{en:"should",ipa:"/ʃʊd/",zh:"应该"},{en:"feeling",ipa:"/ˈfiːlɪŋ/",zh:"感觉"},{en:"huge",ipa:"/hjuːdʒ/",zh:"巨大的"},{en:"worried",ipa:"/ˈwʌrid/",zh:"担心的"},{en:"street",ipa:"/striːt/",zh:"街道"},{en:"hit",ipa:"/hɪt/",zh:"撞击"}],phrases:[{en:"feel happy",ipa:"/fiːl ˈhæpi/",zh:"感到开心"},{en:"feel sad",ipa:"/fiːl sæd/",zh:"感到伤心"},{en:"feel scared",ipa:"/fiːl skeəd/",zh:"感到害怕"},{en:"feel angry",ipa:"/fiːl ˈæŋɡri/",zh:"感到生气"},{en:"feel excited",ipa:"/fiːl ɪkˈsaɪtɪd/",zh:"感到兴奋"},{en:"Beijing opera",ipa:"/ˌbeɪˈdʒɪŋ ˈɒprə/",zh:"京剧"},{en:"get well soon",ipa:"/ɡet wel suːn/",zh:"早日康复"},{en:"be sorry about",ipa:"/biː ˈsɒri əˈbaʊt/",zh:"对……感到抱歉"},{en:"shout at",ipa:"/ʃaʊt æt/",zh:"对……喊叫"},{en:"count to three",ipa:"/kaʊnt tu θriː/",zh:"数到三"}],sentences:[{en:"I feel happy. I laugh and dance around.",ipa:"/aɪ fiːl ˈhæpi aɪ lɑːf ænd dɑːns əˈraʊnd/",zh:"我感到开心。我笑着到处跳舞。",point:"feel + 形容词，表示感觉。"},{en:"I feel sad. I cry and talk to a friend.",ipa:"/aɪ fiːl sæd aɪ kraɪ ænd tɔːk tu ə frend/",zh:"我感到伤心。我哭着和朋友交谈。",point:"talk to a friend = 和朋友交谈。"},{en:"I feel scared. I share it with my family.",ipa:"/aɪ fiːl skeəd aɪ ʃeə ɪt wɪð maɪ ˈfæməli/",zh:"我感到害怕。我和家人分享。",point:"share...with... = 和……分享……。"},{en:"I feel angry. I stop and count to three.",ipa:"/aɪ fiːl ˈæŋɡri aɪ stɒp ænd kaʊnt tu θriː/",zh:"我感到生气。我停下来数到三。",point:"count to three = 数到三。"},{en:"I feel excited. I jump and say, 'Hooray!'",ipa:"/aɪ fiːl ɪkˈsaɪtɪd aɪ dʒʌmp ænd seɪ huˈreɪ/",zh:"我感到兴奋。我跳起来说“好耶！”",point:"jump and say = 跳起来说。"},{en:"It's my first Beijing opera show with Lingling.",ipa:"/ɪts maɪ fɜːst ˌbeɪˈdʒɪŋ ˈɒprə ʃəʊ wɪð ˌlɪŋˈlɪŋ/",zh:"这是我和玲玲的第一场京剧演出。",point:"first = 第一。"},{en:"I'm so excited.",ipa:"/aɪm səʊ ɪkˈsaɪtɪd/",zh:"我很兴奋。",point:"so + 形容词 = 如此……。"},{en:"Amy is ill today.",ipa:"/ˈeɪmi ɪz ɪl təˈdeɪ/",zh:"埃米今天生病了。",point:"ill = 生病的。"},{en:"Is she coughing?",ipa:"/ɪz ʃiː ˈkɒfɪŋ/",zh:"她在咳嗽吗？",point:"现在进行时：be + 动词-ing。"},{en:"Yes, she is.",ipa:"/jes ʃiː ɪz/",zh:"是的，她在咳嗽。",point:"肯定回答。"},{en:"She can't talk.",ipa:"/ʃiː kɑːnt tɔːk/",zh:"她不能说话。",point:"can't = 不能。"},{en:"She can't take part in the show today. She's sad.",ipa:"/ʃiː kɑːnt teɪk pɑːt ɪn ðə ʃəʊ təˈdeɪ ʃiːz sæd/",zh:"她今天不能参加演出了。她很伤心。",point:"take part in = 参加。"},{en:"I'm sorry to hear that.",ipa:"/aɪm ˈsɒri tu hɪə ðæt/",zh:"听到这个我很难过。",point:"I'm sorry to hear that = 听到这个我很难过。"},{en:"Dear Amy, Get well soon. Don't be sad. We can do it next time.",ipa:"/dɪə ˈeɪmi ɡet wel suːn dəʊnt biː sæd wiː kæn duː ɪt nekst taɪm/",zh:"亲爱的埃米，早日康复。别难过。我们下次再做。",point:"Get well soon = 早日康复。"},{en:"Dear Lingling, Thank you. I'm feeling better now.",ipa:"/dɪə ˌlɪŋˈlɪŋ θæŋk juː aɪm ˈfiːlɪŋ ˈbetə naʊ/",zh:"亲爱的玲玲，谢谢你。我现在感觉好多了。",point:"feeling better = 感觉好多了。"},{en:"Time for the show. I'm happy!",ipa:"/taɪm fɔː ðə ʃəʊ aɪm ˈhæpi/",zh:"该演出了。我很开心！",point:"Time for... = 该……了。"},{en:"Hi, Amy. Are you still coughing?",ipa:"/haɪ ˈeɪmi ɑː juː stɪl ˈkɒfɪŋ/",zh:"嗨，埃米。你还在咳嗽吗？",point:"Are you still...? 询问还在……吗？"},{en:"No, I'm not. I feel great now.",ipa:"/nəʊ aɪm nɒt aɪ fiːl ɡreɪt naʊ/",zh:"不，我没有。我现在感觉很好。",point:"No, I'm not = 不，我没有。"},{en:"Look! They are doing very well.",ipa:"/lʊk ðeɪ ɑː ˈduːɪŋ ˈveri wel/",zh:"看！他们做得非常好。",point:"现在进行时。"},{en:"Yes! I'm happy for them.",ipa:"/jes aɪm ˈhæpi fɔː ðəm/",zh:"是的！我为他们感到高兴。",point:"be happy for sb. = 为某人感到高兴。"},{en:"Happy birthday, Jay!",ipa:"/ˈhæpi ˈbɜːθdeɪ dʒeɪ/",zh:"生日快乐，杰伊！",point:"生日祝福语。"},{en:"This is for you.",ipa:"/ðɪs ɪz fɔː juː/",zh:"这是给你的。",point:"This is for you = 这是给你的。"},{en:"Thank you! It's the new model ship!",ipa:"/θæŋk juː ɪts ðə njuː ˈmɒdl ʃɪp/",zh:"谢谢你！这是新的模型船！",point:"model ship = 模型船。"},{en:"Jay is very happy.",ipa:"/dʒeɪ ɪz ˈveri ˈhæpi/",zh:"杰伊非常开心。",point:"very + 形容词。"},{en:"Time for bed, Jay.",ipa:"/taɪm fɔː bed dʒeɪ/",zh:"该睡觉了，杰伊。",point:"Time for bed = 该睡觉了。"},{en:"I'm making the ship.",ipa:"/aɪm ˈmeɪkɪŋ ðə ʃɪp/",zh:"我正在做船。",point:"现在进行时。"},{en:"You can make it tomorrow.",ipa:"/juː kæn meɪk ɪt təˈmɒrəʊ/",zh:"你可以明天再做。",point:"tomorrow = 明天。"},{en:"Jay is angry. He is shouting at Ray.",ipa:"/dʒeɪ ɪz ˈæŋɡri hiː ɪz ˈʃaʊtɪŋ æt reɪ/",zh:"杰伊生气了。他对着雷喊叫。",point:"shout at = 对……喊叫。"},{en:"Jay runs back to his room. He is sad.",ipa:"/dʒeɪ rʌnz bæk tu hɪz ruːm hiː ɪz sæd/",zh:"杰伊跑回他的房间。他很伤心。",point:"run back = 跑回。"},{en:"Jay, I'm so sorry about your ship.",ipa:"/dʒeɪ aɪm səʊ ˈsɒri əˈbaʊt jɔː ʃɪp/",zh:"杰伊，我对你的船感到很抱歉。",point:"be sorry about = 对……感到抱歉。"},{en:"Ray, I'm sorry. I shouldn't shout at you.",ipa:"/reɪ aɪm ˈsɒri aɪ ˈʃʊdnt ʃaʊt æt juː/",zh:"雷，对不起。我不应该对你喊叫。",point:"shouldn't = 不应该。"},{en:"Let's make it again together!",ipa:"/lets meɪk ɪt əˈɡen təˈɡeðə/",zh:"我们一起再做一次吧！",point:"again = 再次。together = 一起。"},{en:"Jay and Ray are happy now.",ipa:"/dʒeɪ ænd reɪ ɑː ˈhæpi naʊ/",zh:"杰伊和雷现在很开心。",point:"now = 现在。"},{en:"These cute little faces have feelings to show.",ipa:"/ðiːz kjuːt ˈlɪtl ˈfeɪsɪz hæv ˈfiːlɪŋz tu ʃəʊ/",zh:"这些可爱的小脸有情感要表达。",point:"have feelings to show = 有情感要表达。"},{en:"You feel angry, like the colour of a huge fire.",ipa:"/juː fiːl ˈæŋɡri laɪk ðə ˈkʌlə əv ə hjuːdʒ ˈfaɪə/",zh:"你感到生气，像熊熊大火的颜色。",point:"like = 像。"},{en:"You feel happy, like the colour of the sun.",ipa:"/juː fiːl ˈhæpi laɪk ðə ˈkʌlə əv ðə sʌn/",zh:"你感到开心，像太阳的颜色。",point:"like = 像。"},{en:"You feel sad, like the colour of a cloudy sky.",ipa:"/juː fiːl sæd laɪk ðə ˈkʌlə əv ə ˈklaʊdi skaɪ/",zh:"你感到伤心，像多云天空的颜色。",point:"like = 像。"},{en:"You feel worried, like the colour of night.",ipa:"/juː fiːl ˈwʌrid laɪk ðə ˈkʌlə əv naɪt/",zh:"你感到担心，像夜晚的颜色。",point:"like = 像。"},{en:"Sichuan opera is very famous in China.",ipa:"/ˈsɪtʃwɑːn ˈɒprə ɪz ˈveri ˈfeɪməs ɪn ˈtʃaɪnə/",zh:"川剧在中国非常有名。",point:"be famous = 有名。"},{en:"He can change his masks to show different feelings.",ipa:"/hiː kæn tʃeɪndʒ hɪz mɑːsks tu ʃəʊ ˈdɪfrənt ˈfiːlɪŋz/",zh:"他可以改变他的面具来展示不同的情感。",point:"change = 改变。"},{en:"My mask is black and white. It's smiling. I'm happy.",ipa:"/maɪ mɑːsk ɪz blæk ænd waɪt ɪts ˈsmaɪlɪŋ aɪm ˈhæpi/",zh:"我的面具是黑白的。它在微笑。我很开心。",point:"smiling = 微笑的。"},{en:"My mask is blue. It's crying. I'm sad.",ipa:"/maɪ mɑːsk ɪz bluː ɪts ˈkraɪɪŋ aɪm sæd/",zh:"我的面具是蓝色的。它在哭。我很伤心。",point:"crying = 哭的。"},{en:"My mask is red and yellow. Look! I'm angry.",ipa:"/maɪ mɑːsk ɪz red ænd ˈjeləʊ lʊk aɪm ˈæŋɡri/",zh:"我的面具是红色和黄色的。看！我很生气。",point:"angry = 生气的。"},{en:"My mask is orange and has a big open mouth. I'm very excited.",ipa:"/maɪ mɑːsk ɪz ˈɒrɪndʒ ænd hæz ə bɪɡ ˈəʊpən maʊθ aɪm ˈveri ɪkˈsaɪtɪd/",zh:"我的面具是橙色的，有一个张开的大嘴。我很兴奋。",point:"excited = 兴奋的。"},{en:"How do you feel today?",ipa:"/haʊ duː juː fiːl təˈdeɪ/",zh:"你今天感觉怎么样？",point:"询问感受。"},{en:"Why?",ipa:"/waɪ/",zh:"为什么？",point:"询问原因。"},{en:"What makes you sad?",ipa:"/wɒt meɪks juː sæd/",zh:"什么让你伤心？",point:"What makes you...? 询问什么让你……。"},{en:"What makes you happy?",ipa:"/wɒt meɪks juː ˈhæpi/",zh:"什么让你开心？",point:"What makes you...? 询问什么让你……。"},{en:"How does she feel?",ipa:"/haʊ dʌz ʃiː fiːl/",zh:"她感觉怎么样？",point:"How does she feel? 询问她的感受。"},{en:"I feel...",ipa:"/aɪ fiːl/",zh:"我感到……",point:"表达感受。"}]},
{name:"Unit 3 Everyone's got talent!",words:[{en:"talent",ipa:"/ˈtælənt/",zh:"天赋"},{en:"act",ipa:"/ækt/",zh:"表演"},{en:"magic",ipa:"/ˈmædʒɪk/",zh:"魔术"},{en:"shine",ipa:"/ʃaɪn/",zh:"出众"},{en:"puzzle",ipa:"/ˈpʌzl/",zh:"拼图"},{en:"dancer",ipa:"/ˈdɑːnsə/",zh:"舞蹈演员"},{en:"win",ipa:"/wɪn/",zh:"获胜"},{en:"just",ipa:"/dʒʌst/",zh:"只是"},{en:"boy",ipa:"/bɔɪ/",zh:"男孩"},{en:"slowly",ipa:"/ˈsləʊli/",zh:"缓慢地"}],phrases:[{en:"play the piano",ipa:"/pleɪ ðə piˈænəʊ/",zh:"弹钢琴"},{en:"do magic",ipa:"/duː ˈmædʒɪk/",zh:"变魔术"},{en:"take photos",ipa:"/teɪk ˈfəʊtəʊz/",zh:"拍照"},{en:"do puzzles",ipa:"/duː ˈpʌzlz/",zh:"拼拼图"},{en:"be good at",ipa:"/biː ɡʊd æt/",zh:"擅长"},{en:"work hard",ipa:"/wɜːk hɑːd/",zh:"努力工作"},{en:"come true",ipa:"/kʌm truː/",zh:"实现"},{en:"day and night",ipa:"/deɪ ænd naɪt/",zh:"日日夜夜"}],sentences:[{en:"You can play the piano. I can act.",ipa:"/juː kæn pleɪ ðə piˈænəʊ aɪ kæn ækt/",zh:"你会弹钢琴。我会表演。",point:"play the piano = 弹钢琴。"},{en:"He can do magic with a hat.",ipa:"/hiː kæn duː ˈmædʒɪk wɪð ə hæt/",zh:"他可以用帽子变魔术。",point:"do magic = 变魔术。"},{en:"Yes, we can! Talents make us shine!",ipa:"/jes wiː kæn ˈtælənts meɪk ʌs ʃaɪn/",zh:"是的，我们可以！才艺让我们闪耀！",point:"make us shine = 让我们闪耀。"},{en:"You can take photos. I can cook.",ipa:"/juː kæn teɪk ˈfəʊtəʊz aɪ kæn kʊk/",zh:"你会拍照。我会做饭。",point:"take photos = 拍照。"},{en:"She can do puzzles with one look.",ipa:"/ʃiː kæn duː ˈpʌzlz wɪð wʌn lʊk/",zh:"她看一眼就能拼出拼图。",point:"do puzzles = 拼拼图。"},{en:"What are you looking at?",ipa:"/wɒt ɑː juː ˈlʊkɪŋ æt/",zh:"你在看什么？",point:"What are you looking at? 询问正在看什么。"},{en:"I'm looking at their clothes.",ipa:"/aɪm ˈlʊkɪŋ æt ðeə kləʊðz/",zh:"我在看他们的衣服。",point:"现在进行时。"},{en:"Are you worried?",ipa:"/ɑː juː ˈwʌrid/",zh:"你担心吗？",point:"Are you worried? 询问是否担心。"},{en:"Don't worry about your clothes. Just go and dance.",ipa:"/dəʊnt ˈwʌri əˈbaʊt jɔː kləʊðz dʒʌst ɡəʊ ænd dɑːns/",zh:"别担心你的衣服。去跳舞吧。",point:"Don't worry about... = 别担心……。"},{en:"She's dancing well.",ipa:"/ʃiːz ˈdɑːnsɪŋ wel/",zh:"她跳得很好。",point:"现在进行时 + well。"},{en:"The best dancer is... Lingling!",ipa:"/ðə best ˈdɑːnsə ɪz ˌlɪŋˈlɪŋ/",zh:"最好的舞者是……玲玲！",point:"the best = 最好的。"},{en:"Lingling is wearing beautiful clothes.",ipa:"/ˌlɪŋˈlɪŋ ɪz ˈweərɪŋ ˈbjuːtəfl kləʊðz/",zh:"玲玲穿着漂亮的衣服。",point:"现在进行时。"},{en:"Lingling doesn't worry about her clothes.",ipa:"/ˌlɪŋˈlɪŋ ˈdʌznt ˈwʌri əˈbaʊt hɜː kləʊðz/",zh:"玲玲不担心她的衣服。",point:"doesn't worry = 不担心。"},{en:"Lingling wins the show.",ipa:"/ˌlɪŋˈlɪŋ wɪnz ðə ʃəʊ/",zh:"玲玲赢得了演出。",point:"wins = 获胜。"},{en:"Daming, Sam and Amy are happy for Lingling.",ipa:"/ˈdɑːmɪŋ sæm ænd ˈeɪmi ɑː ˈhæpi fɔː ˌlɪŋˈlɪŋ/",zh:"大明、萨姆和埃米为玲玲感到高兴。",point:"be happy for = 为……感到高兴。"},{en:"What are you doing, Amy?",ipa:"/wɒt ɑː juː ˈduːɪŋ ˈeɪmi/",zh:"你在做什么，埃米？",point:"What are you doing? 询问正在做什么。"},{en:"I'm learning to dance.",ipa:"/aɪm ˈlɜːnɪŋ tu dɑːns/",zh:"我在学跳舞。",point:"learn to do sth. = 学做某事。"},{en:"But I can't dance well. Can you teach me?",ipa:"/bʌt aɪ kɑːnt dɑːns wel kæn juː tiːtʃ miː/",zh:"但我跳不好。你能教我吗？",point:"Can you teach me? 请求教导。"},{en:"What is Lingling doing?",ipa:"/wɒt ɪz ˌlɪŋˈlɪŋ ˈduːɪŋ/",zh:"玲玲在做什么？",point:"What is + 主语 + doing? 询问正在做什么。"},{en:"She is teaching Amy to dance.",ipa:"/ʃiː ɪz ˈtiːtʃɪŋ ˈeɪmi tu dɑːns/",zh:"她在教埃米跳舞。",point:"teach sb. to do sth. = 教某人做某事。"},{en:"Look! They're doing well.",ipa:"/lʊk ðeə ˈduːɪŋ wel/",zh:"看！她们做得很好。",point:"They're = They are。"},{en:"Yes. They're doing very well.",ipa:"/jes ðeə ˈduːɪŋ ˈveri wel/",zh:"是的。她们做得非常好。",point:"very well = 非常好。"},{en:"What is Little Chicken good at?",ipa:"/wɒt ɪz ˈlɪtl ˈtʃɪkɪn ɡʊd æt/",zh:"小鸡擅长什么？",point:"be good at = 擅长。"},{en:"She's flying so well! Oh, Bird, please teach me to fly.",ipa:"/ʃiːz ˈflaɪɪŋ səʊ wel əʊ bɜːd pliːz tiːtʃ miː tu flaɪ/",zh:"她飞得真好！哦，小鸟，请教我飞。",point:"teach sb. to do sth. = 教某人做某事。"},{en:"Oh, no. I'm not good at flying.",ipa:"/əʊ nəʊ aɪm nɒt ɡʊd æt ˈflaɪɪŋ/",zh:"哦，不。我不擅长飞。",point:"be not good at = 不擅长。"},{en:"He's running so well! Oh, Dog, please teach me to run.",ipa:"/hiːz ˈrʌnɪŋ səʊ wel əʊ dɒɡ pliːz tiːtʃ miː tu rʌn/",zh:"他跑得真好！哦，狗  擅长做某事。"},{en:"What's his talent?",ipa:"/wɒts hɪz ˈtælənt/",zh:"他的才艺是什么？",point:"询问才艺。"},{en:"What's she worried about?",ipa:"/wɒts ʃiː ˈwʌrid əˈbaʊt/",zh:"她在担心什么？",point:"be worried about = 担心。"},{en:"What's your dad good at?",ipa:"/wɒts jɔː dæd ɡʊd æt/",zh:"你爸爸擅长什么？",point:"be good at = 擅长。"},{en:"Name talents.",ipa:"/neɪm ˈtælənts/",zh:"说出才艺。",point:"name = 说出。"},{en:"There are different kinds of talent.",ipa:"/ðeə ɑː ˈdɪfrənt kaɪndz əv ˈtælənt/",zh:"有不同种类的才艺。",point:"different kinds of = 不同种类的。"},{en:"Some people are good at sports. They've got body talent.",ipa:"/sʌm ˈpiːpl ɑː ɡʊd æt spɔːts ðeɪv ɡɒt ˈbɒdi ˈtælənt/",zh:"有些人擅长运动。他们有身体才艺。",point:"be good at = 擅长。"},{en:"Some have got picture talent. They're good at painting.",ipa:"/sʌm hæv ɡɒt ˈpɪktʃə ˈtælənt ðeə ɡʊd æt ˈpeɪntɪŋ/",zh:"有些人有绘画才艺。他们擅长画画。",point:"be good at = 擅长。"},{en:"Some people are good at maths. This is number talent.",ipa:"/sʌm ˈpiːpl ɑː ɡʊd æt mæθs ðɪs ɪz ˈnʌmbə ˈtælənt/",zh:"有些人擅长数学。这是数字才艺。",point:"be good at = 擅长。"},{en:"Can you play the piano? You've got musical talent.",ipa:"/kæn juː pleɪ ðə piˈænəʊ juːv ɡɒt ˈmjuːzɪkl ˈtælənt/",zh:"你会弹钢琴吗？你有音乐才艺。",point:"play the piano = 弹钢琴。"},{en:"I'm good at speaking English. I've got word talent.",ipa:"/aɪm ɡʊd æt ˈspiːkɪŋ ˈɪŋɡlɪʃ aɪv ɡɒt wɜːd ˈtælənt/",zh:"我擅长说英语。我有文字才艺。",point:"be good at doing sth. = 擅长做某事。"}]},

to seeds.",ipa:"/aɪv ɡɒt təˈmɑːtəʊ siːdz/",zh:"我有西红柿种子。",point:"I've got = I have got。"},{en:"I've got bean seeds.",ipa:"/aɪv ɡɒt biːn siːdz/",zh:"我有豆子种子。",point:"bean seeds = 豆子种子。"},{en:"I've got cucumber seeds.",ipa:"/aɪv ɡɒt ˈkjuːkʌmbə siːdz/",zh:"我有黄瓜种子。",point:"cucumber = 黄瓜。"},{en:"I've got sunflower seeds.",ipa:"/aɪv ɡɒt ˈsʌnflaʊə siːdz/",zh:"我有向日葵种子。",point:"sunflower = 向日葵。"},{en:"Are your seeds growing?",ipa:"/ɑː jɔː siːdz ˈɡrəʊɪŋ/",zh:"你的种子在生长吗？",point:"现在进行时的一般疑问句。"},{en:"Yes, they are. Look!",ipa:"/jes ðeɪ ɑː lʊk/",zh:"是的，它们在生长。看！",point:"肯定回答。"},{en:"Why aren't my seeds growing?",ipa:"/waɪ ɑːnt maɪ siːdz ˈɡrəʊɪŋ/",zh:"为什么我的种子不生长？",point:"否定疑问句。"},{en:"Oh, Sam. These seeds can't grow!",ipa:"/əʊ sæm ðiːz siːdz kɑːnt ɡrəʊ/",zh:"哦，萨姆。这些种子不能生长！",point:"can't = 不能。"},{en:"Let me plant a new one.",ipa:"/let miː plɑːnt ə njuː wʌn/",zh:"让我种一颗新的。",point:"Let me = 让我。"},{en:"Is he watering the plants?",ipa:"/ɪz hiː ˈwɔːtərɪŋ ðə plɑːnts/",zh:"他在给植物浇水吗？",point:"现在进行时的一般疑问句。"},{en:"What are they doing in Picture 1?",ipa:"/wɒt ɑː ðeɪ ˈduːɪŋ ɪn ˈpɪktʃə wʌn/",zh:"他们在图片1中做什么？",point:"看图片回答问题。"},{en:"They're planting seeds.",ipa:"/ðeə ˈplɑːntɪŋ siːdz/",zh:"他们在播种。",point:"plant seeds = 播种。"},{en:"What are Grandpa's dreams?",ipa:"/wɒt ɑː ˈɡrænpɑːz driːmz/",zh:"爷爷的梦想是什么？",point:"dreams = 梦想。"},{en:"I'm Huahua. This is my grandpa. He's a scientist.",ipa:"/aɪm ˌhwɑːˈhwɑː ðɪs ɪz maɪ ˈɡrænpɑː hiːz ə ˈsaɪəntɪst/",zh:"我是花花。这是我的爷爷。他是一名科学家。",point:"He's = He is。"},{en:"I like staying with Grandpa. He's reading and I'm sleeping.",ipa:"/aɪ laɪk ˈsteɪɪŋ wɪð ˈɡrænpɑː hiːz ˈriːdɪŋ ænd aɪm ˈsliːpɪŋ/",zh:"我喜欢和爷爷待在一起。他在读书，我在睡觉。",point:"现在进行时。"},{en:"Grandpa often works in the fields. I like playing with the rice plants there.",ipa:"/ˈɡrænpɑː ˈɒfn wɜːks ɪn ðə fiːldz aɪ laɪk ˈpleɪɪŋ wɪð ðə raɪs plɑːnts ðeə/",zh:"爷爷经常在田地里工作。我喜欢在那里和稻子玩。",point:"in the fields = 在田地里。"},{en:"Grandpa works hard. Sometimes I work, too!",ipa:"/ˈɡrænpɑː wɜːks hɑːd ˈsʌmtaɪmz aɪ wɜːk tuː/",zh:"爷爷工作努力。有时我也工作！",point:"sometimes = 有时。"},{en:"Grandpa has two dreams.",ipa:"/ˈɡrænpɑː hæz tuː driːmz/",zh:"爷爷有两个梦想。",point:"has = 有。"},{en:"He wants to grow tall rice plants. He can sit under them.",ipa:"/hiː wɒnts tu ɡrəʊ tɔːl raɪs plɑːnts hiː kæn sɪt ˈʌndə ðəm/",zh:"他想种出高高的稻子。他可以坐在它们下面。",point:"want to do sth. = 想做某事。"},{en:"He also wants to feed the world with his rice.",ipa:"/hiː ˈɔːlsəʊ wɒnts tu fiːd ðə wɜːld wɪð hɪz raɪs/",zh:"他还想用他的稻子养活世界。",point:"feed the world = 养活世界。"},{en:"I miss Grandpa. I think his dreams will come true!",ipa:"/aɪ mɪs ˈɡrænpɑː aɪ θɪŋk hɪz driːmz wɪl kʌm truː/",zh:"我想念爷爷。我认为他的梦想会实现！",point:"come true = 实现。"},{en:"Huahua's grandpa doesn't work in the fields.",ipa:"/ˌhwɑːˈhwɑːz ˈɡrænpɑː ˈdʌznt wɜːk ɪn ðə fiːldz/",zh:"花花的爷爷不在田地里工作。",point:"doesn't work = 不在工作。"},{en:"Huahua sometimes works with Grandpa.",ipa:"/ˌhwɑːˈhwɑː ˈsʌmtaɪmz wɜːks wɪð ˈɡrænpɑː/",zh:"花花有时和爷爷一起工作。",point:"sometimes = 有时。"},{en:"Huahua's grandpa works hard for his dreams.",ipa:"/ˌhwɑːˈhwɑːz ˈɡrænpɑː wɜːks hɑːd fɔː hɪz driːmz/",zh:"花花的爷爷为他的梦想努力工作。",point:"work hard for = 为……努力工作。"},{en:"Yummy, yummy food, comes from plants.",ipa:"/ˈjʌmi ˈjʌmi fuːd kʌmz frɒm plɑːnts/",zh:"美味的食物来自植物。",point:"come from = 来自。"},{en:"What do you want?",ipa:"/wɒt duː juː wɒnt/",zh:"你想要什么？",point:"询问想要什么。"},{en:"He wants carrots. She wants corn.",ipa:"/hiː wɒnts ˈkærəts ʃiː wɒnts kɔːn/",zh:"他想要胡萝卜。她想要玉米。",point:"wants 是第三人称单数形式。"},{en:"I want tomatoes, and green, green beans.",ipa:"/aɪ wɒnt təˈmɑːtəʊz ænd ɡriːn ɡriːn biːnz/",zh:"我想要西红柿和绿绿的豆子。",point:"and 连接并列成分。"},{en:"Plants, plants, we love you so.",ipa:"/plɑːnts plɑːnts wiː lʌv juː səʊ/",zh:"植物，植物，我们如此爱你。",point:"so = 如此。"},{en:"Thank you for helping us grow!",ipa:"/θæŋk juː fɔː ˈhelpɪŋ ʌs ɡrəʊ/",zh:"谢谢你帮助我们成长！",point:"Thank you for doing sth. = 谢谢你做某事。"},{en:"We use plants to make paper.",ipa:"/wiː juːz plɑːnts tu meɪk ˈpeɪpə/",zh:"我们用植物来造纸。",point:"use...to do... = 用……做……。"},{en:"We also use plants to make chairs.",ipa:"/wiː ˈɔːlsəʊ juːz plɑːnts tu meɪk tʃeəz/",z activity is the school fair. There is... There are...",ipa:"/maɪ ˈfeɪvərɪt skuːl ækˈtɪvəti ɪz ðə skuːl feə ðeər ɪz ðeər ɑː/",zh:"我最喜欢的学校活动是学校义卖会。有……有……",point:"描述学校活动。"},{en:"Say it. I hope to go to Rome.",ipa:"/seɪ ɪt aɪ həʊp tu ɡəʊ tu rəʊm/",zh:"说出来。我希望去罗马。",point:"hope to do sth. = 希望做某事。"},{en:"It's close to home.",ipa:"/ɪts kləʊs tu həʊm/",zh:"它离家很近。",point:"close to = 离……近。"},{en:"Who is this man?",ipa:"/huː ɪz ðɪs mæn/",zh:"这个人是谁？",point:"who = 谁。"},{en:"Is there a school picnic?",ipa:"/ɪz ðeər ə skuːl ˈpɪknɪk/",zh:"有学校野餐吗？",point:"Is there a...? 询问有……吗？"},{en:"Name school activities.",ipa:"/neɪm skuːl ækˈtɪvətiz/",zh:"说出学校活动。",point:"name = 说出。"},{en:"Say what I can learn from school activities.",ipa:"/seɪ wɒt aɪ kæn lɜːn frɒm skuːl ækˈtɪvətiz/",zh:"说出我能从学校活动中学到什么。",point:"learn from = 从……学习。"},{en:"I'm Lili. I'm from the Zhuang ethnic group in Guangxi.",ipa:"/aɪm ˈliːliː aɪm frɒm ðə dʒwɑːŋ ˈeθnɪk ɡruːp ɪn ɡwɑːŋˈʃiː/",zh:"我是丽丽。我来自广西壮族。",point:"the Zhuang ethnic group = 壮族。"},{en:"Every spring, there is a special activity at my school.",ipa:"/ˈevri sprɪŋ ðeər ɪz ə ˈspeʃl ækˈtɪvəti æt maɪ skuːl/",zh:"每年春天，我们学校都有一个特别的活动。",point:"every spring = 每年春天。"},{en:"We eat five-colour rice. We sing songs. We also do the Bamboo Pole Dance.",ipa:"/wiː iːt faɪv ˈkʌlə raɪs wiː sɪŋ sɒŋz wiː ˈɔːlsəʊ duː ðə bæmˈbuː pəʊl dɑːns/",zh:"我们吃五色糯米饭。我们唱歌。我们还跳竹竿舞。",point:"five-colour rice = 五色糯米饭。Bamboo Pole Dance = 竹竿舞。"},{en:"We learn a lot about the Zhuang culture from these activities.",ipa:"/wiː lɜːn ə lɒt əˈbaʊt ðə dʒwɑːŋ ˈkʌltʃə frɒm ðiːz ækˈtɪvətiz/",zh:"我们从这些活动中学到很多关于壮族文化的东西。",point:"learn a lot about = 学到很多关于……。"},{en:"It's a day to have fun with my friends!",ipa:"/ɪts ə deɪ tu hæv fʌn wɪð maɪ frendz/",zh:"这是和朋友们一起玩的日子！",point:"have fun with = 和……一起玩。"},{en:"What special activities do you have at your school? What do you do?",ipa:"/wɒt ˈspeʃl ækˈtɪvətiz duː juː hæv æt jɔː skuːl wɒt duː juː duː/",zh:"你们学校有什么特别活动？你们做什么？",point:"询问学校活动。"}]},
{name:"Unit 6 Cool clothes",words:[{en:"T-shirt",ipa:"/ˈtiː ʃɜːt/",zh:"T恤衫"},{en:"skirt",ipa:"/skɜːt/",zh:"裙子"},{en:"shorts",ipa:"/ʃɔːts/",zh:"短裤"},{en:"shirt",ipa:"/ʃɜːt/",zh:"衬衫"},{en:"trousers",ipa:"/ˈtraʊzəz/",zh:"裤子"},{en:"scarf",ipa:"/skɑːf/",zh:"围巾"},{en:"sweater",ipa:"/ˈswetə/",zh:"毛衣"},{en:"dress",ipa:"/dres/",zh:"连衣裙"},{en:"party",ipa:"/ˈpɑːti/",zh:"聚会"},{en:"dressmaker",ipa:"/ˈdresmeɪkə/",zh:"裁缝"},{en:"wrong",ipa:"/rɒŋ/",zh:"错误的"},{en:"clever",ipa:"/ˈklevə/",zh:"聪明的"},{en:"whale",ipa:"/weɪl/",zh:"鲸"},{en:"Mr",ipa:"/ˈmɪstə/",zh:"先生"},{en:"uniform",ipa:"/ˈjuːnɪfɔːm/",zh:"制服"},{en:"robe",ipa:"/rəʊb/",zh:"长袍"}],phrases:[{en:"school uniform",ipa:"/skuːl ˈjuːnɪfɔːm/",zh:"校服"},{en:"police uniform",ipa:"/pəˈliːs ˈjuːnɪfɔːm/",zh:"警服"},{en:"try on",ipa:"/traɪ ɒn/",zh:"试穿"},{en:"put on",ipa:"/pʊt ɒn/",zh:"穿上"},{en:"take off",ipa:"/teɪk ɒf/",zh:"脱下"},{en:"fashion show",ipa:"/ˈfæʃn ʃəʊ/",zh:"时装秀"},{en:"be made of",ipa:"/biː meɪd əv/",zh:"由……制成"},{en:"come from",ipa:"/kʌm frɒm/",zh:"来自"}],sentences:[{en:"Sun, wind, rain or snow. Look outside and pick your clothes.",ipa:"/sʌn wɪnd reɪn ɔː snəʊ lʊk ˌaʊtˈsaɪd ænd pɪk jɔː kləʊðz/",zh:"太阳、风、雨或雪。看看外面，挑选你的衣服。",point:"pick your clothes = 挑选衣服。"},{en:"It's hot, hot, hot! T-shirt, skirt or shorts.",ipa:"/ɪts hɒt hɒt hɒt ˈtiː ʃɜːt skɜːt ɔː ʃɔːts/",zh:"热，热，热！T恤、裙子或短裤。",point:"炎热的天气穿什么。"},{en:"It's cool, cool, cool! Hat, shirt and trousers.",ipa:"/ɪts kuːl kuːl kuːl hæt ʃɜːt ænd ˈtraʊzəz/",zh:"凉爽，凉爽，凉爽！帽子、衬衫和长裤。",point:"凉爽的天气穿什么。"},{en:"It's cold, cold, cold! Scarf, sweater and coat.",ipa:"/ɪts kəʊld kəʊld kəʊld skɑːf ˈswetə ænd kəʊt/",zh:"冷，冷，冷！围巾、毛衣和外套。",point:"寒冷的天气穿什么。"},{en:"Get ready, get ready, it's time to go.",ipa:"/ɡet ˈredi ɡet ˈredi ɪts taɪm tu ɡəʊ/",zh:"准备好，准备好，该走了。",point:"get ready = 准备好。"},{en:"What do you want to wear to the party?",ipa:"/wɒt duː juː wɒnt tu weə tu ðə ˈpɑːti/",zh:"你想穿什么去参加聚会？",point:"wear to the party = 穿去聚会。"},{en:"My favourite blue dress!",ipa:"/maɪ ˈfeɪvərɪt bluː dres/",zh:"我最喜欢的蓝色连衣裙！",point:"favourite = 最喜欢的。"},{en:"What are you doing, Lingling?",ipa:"/wɒt ɑː juː ˈduːɪŋ ˌlɪŋˈlɪŋ/",zh:"你在做什么，玲玲？",point:"现在进行时。"},{en:"I'm looking for my blue dress.",ipa:"/aɪm ˈlʊkɪŋ fɔː maɪ bluː dres/",zh:"我在找我的蓝色连衣裙。",point:"look for = 寻找。"},{en:"Oh, it's small for me now.",ipa:"/əʊ ɪts smɔːl fɔː miː naʊ/",zh:"哦，它现在对我来说太小了。",point:"small for me = 对我来说太小。"},{en:"Mum, are you cutting up my dress?",ipa:"/mʌm ɑː juː ˈkʌtɪŋ ʌp maɪ dres/",zh:"妈妈，你在剪我的裙子吗？",point:"现在进行时。"},{en:"Don't worry. I have an idea.",ipa:"/dəʊnt ˈwʌri aɪ hæv ən aɪˈdɪə/",zh:"别担心。我有个主意。",point:"have an idea = 有个主意。"},{en:"Lingling, you're not wearing your favourite dress.",ipa:"/ˌlɪŋˈlɪŋ jɔː nɒt ˈweərɪŋ jɔː ˈfeɪvərɪt dres/",zh:"玲玲，你没有穿你最喜欢的裙子。",point:"现在进行时的否定形式。"},{en:"Yes, I am. I'm wearing it!",ipa:"/jes aɪ æm aɪm ˈweərɪŋ ɪt/",zh:"不，我穿着呢。我正穿着它！",point:"Yes, I am = 不，我穿着。"},{en:"Lingling's favourite dress is too small.",ipa:"/ˌlɪŋˈlɪŋz ˈfeɪvərɪt dres ɪz tuː smɔːl/",zh:"玲玲最喜欢的裙子太小了。",point:"too small = 太小。"},{en:"Lingling is happy at the party.",ipa:"/ˌlɪŋˈlɪŋ ɪz ˈhæpi æt ðə ˈpɑːti/",zh:"玲玲在聚会上很开心。",point:"at the party = 在聚会上。"},{en:"Is Amy wearing a shirt and a skirt?",ipa:"/ɪz ˈeɪmi ˈweərɪŋ ə ʃɜːt ænd ə skɜːt/",zh:"埃米穿着衬衫和裙子吗？",point:"现在进行时的一般疑问句。"},{en:"What's Daming wearing?",ipa:"/wɒts ˈdɑːmɪŋ ˈweərɪŋ/",zh:"大明穿着什么？",point:"What's + 主语 + wearing? 询问穿着。"},{en:"He's wearing a T-shirt and shorts.",ipa:"/hiːz ˈweərɪŋ ə ˈtiː ʃɜːt ænd ʃɔːts/",zh:"他穿着T恤和短裤。",point:"He's = He is。"},{en:"Is Daming laughing?",ipa:"/ɪz ˈdɑːmɪŋ ˈlɑːfɪŋ/",zh:"大明在笑吗？",point:"现在进行时的一般疑问句。"},{en:"What does Tom do?",ipa:"/wɒt dʌz tɒm duː/",zh:"汤姆是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"Tom makes clothes for animals. He's busy every day!",ipa:"/tɒm meɪks kləʊðz fɔː ˈænɪmlz hiːz ˈbɪzi ˈevri deɪ/",zh:"汤姆为动物们做衣服。他每天都很忙！",point:"make clothes for = 为……做衣服。"},{en:"We need clothes for a party!",ipa:"/wiː niːd kləʊðz fɔːr ə ˈpɑːti/",zh:"我们需要参加聚会的衣服！",point:"need = 需要。"},{en:"Lovely dresses and hats!",ipa:"/ˈlʌvli ˈdresɪz ænd hæts/",zh:"可爱的裙子和帽子！",point:"lovely = 可爱的。"},{en:"My family want colourful shirts!",ipa:"/maɪ ˈfæməli wɒnt ˈkʌləfl ʃɜːts/",zh:"我的家人想要彩色衬衫！",point:"colourful = 彩色的。"},{en:"I have eight brothers and sisters. We all look the same!",ipa:"/aɪ hæv eɪt ˈbrʌðəz ænd ˈsɪstəz wiː ɔːl lʊk ðə seɪm/",zh:"我有八个兄弟姐妹。我们看起来都一样！",point:"look the same = 看起来一样。"},{en:"Dad gets our names wrong. Can you help?",ipa:"/dæd ɡets ˈaʊə neɪmz rɒŋ kæn juː help/",zh:"爸爸总是叫错我们的名字。你能帮忙吗？",point:"get...wrong = 弄错……。"},{en:"Now we're wearing T-shirts with our names. Clever idea!",ipa:"/naʊ wɪə ˈweərɪŋ ˈtiː ʃɜːts wɪð ˈaʊə neɪmz ˈklevə aɪˈdɪə/",zh:"现在我们穿着印有我们名字的T恤。聪明的主意！",point:"with our names = 带着我们的名字。"},{en:"A birthday gift for Ms Whale? Let me think.",ipa:"/ə ˈbɜːθdeɪ ɡɪft fɔː mɪz weɪl let miː θɪŋk/",zh:"给鲸鱼女士的生日礼物？让我想想。",point:"Let me think = 让我想想。"},{en:"Here comes Mr Bird. He wants something special.",ipa:"/hɪə kʌmz ˈmɪstə bɜːd hiː wɒnts ˈsʌmθɪŋ ˈspeʃl/",zh:"鸟先生来了。他想要一些特别的东西。",point:"something special = 特别的东西。"},{en:"My elephant is wearing a cap, a T-shirt and shorts.",ipa:"/maɪ ˈelɪfənt ɪz ˈweərɪŋ ə kæp ə ˈtiː ʃɜːt ænd ʃɔːts/",zh:"我的大象戴着帽子，穿着T恤和短裤。",point:"现在进行时。"},{en:"We wear uniforms for work. We wear uniforms for school.",ipa:"/wiː weə ˈjuːnɪfɔːmz fɔː wɜːk wiː weə ˈjuːnɪfɔːmz fɔː skuːl/",zh:"我们工作时穿制服。我们上学时穿校服。",point:"wear uniforms = 穿制服。"},{en:"Come along and have a look. What do you think of our clothes?",ipa:"/kʌm əˈlɒŋ ænd hæv ə lʊk wɒt duː juː θɪŋk əv ˈaʊə kləʊðz/",zh:"过来看看。你觉得我们的衣服怎么样？",point:"What do you think of...? 询问看法。"},{en:"A blue shirt, for police officers.",ipa:"/ə bluː ʃɜːt fɔː pəˈliːs ˈɒfɪsəz/",zh:"蓝色衬衫，给警察穿。",point:"for police officers = 给警察穿。"},{en:"A white robe, for nurses and doctors.",ipa:"/ə waɪt rəʊb fɔː ˈnɜːsɪz ænd ˈdɒktəz/",zh:"白色长袍，给护士和医生穿。",point:"for nurses and doctors = 给护士和医生穿。"},{en:"An orange uniform for firemen, keeps them safe and cool.",ipa:"/ən ˈɒrɪndʒ ˈjuːnɪfɔːm fɔː ˈfaɪəmən kiːps ðəm seɪf ænd kuːl/",zh:"橙色制服给消防员，让他们安全又凉爽。",point:"keep + 宾语 + 形容词 = 使……保持……。"},{en:"Our school uniforms are cute. We all wear them at school.",ipa:"/ˈaʊə skuːl ˈjuːnɪfɔːmz ɑː kjuːt wiː ɔːl weə ðəm æt skuːl/",zh:"我们的校服很可爱。我们在学校都穿它们。",point:"at school = 在学校。"},{en:"What are you wearing?",ipa:"/wɒt ɑː juː ˈweərɪŋ/",zh:"你穿着什么？",point:"What are you wearing? 询问穿着。"},{en:"I'm wearing a hat, a T-shirt and a skirt!",ipa:"/aɪm ˈweərɪŋ ə hæt ə ˈtiː ʃɜːt ænd ə skɜːt/",zh:"我戴着帽子，穿着T恤和裙子！",point:"现在进行时。"},{en:"What's he wearing?",ipa:"/wɒts hiː ˈweərɪŋ/",zh:"他穿着什么？",point:"What's + 主语 + wearing? 询问穿着。"},{en:"What's your best friend wearing today?",ipa:"/wɒts jɔː best frend ˈweərɪŋ təˈdeɪ/",zh:"你最好的朋友今天穿着什么？",point:"现在进行时。"},{en:"What does Lingling want to wear to the party?",ipa:"/wɒt dʌz ˌlɪŋˈlɪŋ wɒnt tu weə tu ðə ˈpɑːti/",zh:"玲玲想穿什么去参加聚会？",point:"want to wear = 想穿。"},{en:"Are you wearing a T-shirt?",ipa:"/ɑː juː ˈweərɪŋ ə ˈtiː ʃɜːt/",zh:"你穿着T恤吗？",point:"现在进行时的一般疑问句。"},{en:"Is he wearing a scarf?",ipa:"/ɪz hiː ˈweərɪŋ ə skɑːf/",zh:"他戴着围巾吗？",point:"现在进行时的一般疑问句。"},{en:"What's the colour of her skirt?",ipa:"/wɒts ðə ˈkʌlə əv hɜː skɜːt/",zh:"她的裙子是什么颜色？",point:"询问颜色。"},{en:"Who's the gift for?",ipa:"/huːz ðə ɡɪft fɔː/",zh:"礼物是给谁的？",point:"who = 谁。"},{en:"Are you wearing shorts?",ipa:"/ɑː juː ˈweərɪŋ ʃɔːts/",zh:"你穿着短裤吗？",point:"现在进行时的一般疑问句。"},{en:"What's she wearing?",ipa:"/wɒts ʃiː ˈweərɪŋ/",zh:"她穿着什么？",point:"现在进行时。"},{en:"Is she wearing a hat?",ipa:"/ɪz ʃiː ˈweərɪŋ ə hæt/",zh:"她戴着帽子吗？",point:"现在进行时的一般疑问句。"},{en:"Are you wearing socks?",ipa:"/ɑː juː ˈweərɪŋ sɒks/",zh:"你穿着袜子吗？",point:"现在进行时的一般疑问句。"},{en:"Ask a question. Are you wearing...?",ipa:"/ɑːsk ə ˈkwestʃən ɑː juː ˈweərɪŋ/",zh:"问一个问题。你穿着……吗？",point:"提问。"},{en:"Who is he?",ipa:"/huː ɪz hiː/",zh:"他是谁？",point:"who = 谁。"},{en:"Silk comes from silkworms. People make scarves, dresses and shirts with it.",ipa:"/sɪlk kʌmz frɒm ˈsɪlkwɜːmz ˈpiːpl meɪk skɑːvz ˈdresɪz ænd ʃɜːts wɪð ɪt/",zh:"丝绸来自蚕。人们用它做围巾、连衣裙和衬衫。",point:"come from = 来自。make...with... = 用……制作……。"},{en:"What's the material? Where does it come from?",ipa:"/wɒts ðə məˈtɪəriəl weə dʌz ɪt kʌm frɒm/",zh:"这是什么材料？它来自哪里？",point:"material = 材料。"},{en:"Silk, cotton, wool.",ipa:"/sɪlk ˈkɒtn wʊl/",zh:"丝绸、棉花、羊毛。",point:"各种材料。"},{en:"Where do the materials come from?",ipa:"/weə duː ðə məˈtɪəriəlz kʌm frɒm/",zh:"这些材料来自哪里？",point:"come from = 来自。"},{en:"Name clothes.",ipa:"/neɪm kləʊðz/",zh:"说出服装名称。",point:"name = 说出。"},{en:"Talk about different clothes around the world.",ipa:"/tɔːk əˈbaʊt ˈdɪfrənt kləʊðz əˈraʊnd ðə wɜːld/",zh:"谈论世界各地不同的服装。",point:"around the world = 世界各地。"}]}

We try new things. We sometimes fall. It hurts, I know. But every day, we learn and grow.",ipa:"/wiː traɪ njuː θɪŋz wiː ˈsʌmtaɪmz fɔːl ɪt hɜːts aɪ nəʊ bʌt ˈevri deɪ wiː lɜːn ænd ɡrəʊ/",zh:"我们尝试新事物。我们有时会摔倒。我知道那很疼。但每天，我们都在学习和成长。",point:"try new things = 尝试新事物。"},{en:"We all have to face difficulties and learn to...",ipa:"/wiː ɔːl hæv tu feɪs ˈdɪfɪkəltiz ænd lɜːn tu/",zh:"我们都必须面对困难并学会……",point:"face difficulties = 面对困难。"},{en:"Changes are important. They help us grow up.",ipa:"/ˈtʃeɪndʒɪz ɑː ɪmˈpɔːtənt ðeɪ help ʌs ɡrəʊ ʌp/",zh:"改变很重要。它们帮助我们成长。",point:"help sb. do sth. = 帮助某人做某事。"}]},

{name:"Unit 3 We love reading",words:[{en:"adventure",ipa:"/ədˈventʃə/",zh:"历险"},{en:"history",ipa:"/ˈhɪstri/",zh:"历史"},{en:"mystery",ipa:"/ˈmɪstri/",zh:"悬疑故事"},{en:"science fiction",ipa:"/ˌsaɪəns ˈfɪkʃn/",zh:"科幻小说"},{en:"fantasy",ipa:"/ˈfæntəsi/",zh:"幻想作品"},{en:"journey",ipa:"/ˈdʒɜːni/",zh:"旅行"},{en:"west",ipa:"/west/",zh:"西"},{en:"thousand",ipa:"/ˈθaʊznd/",zh:"一千"},{en:"nation",ipa:"/ˈneɪʃn/",zh:"民族"},{en:"horseback",ipa:"/ˈhɔːsbæk/",zh:"马背"},{en:"horse",ipa:"/hɔːs/",zh:"马"},{en:"librarian",ipa:"/laɪˈbreəriən/",zh:"图书管理员"},{en:"secret",ipa:"/ˈsiːkrət/",zh:"秘密的"},{en:"title",ipa:"/ˈtaɪtl/",zh:"书名"},{en:"cousin",ipa:"/ˈkʌzn/",zh:"堂/表兄弟姐妹"},{en:"friendly",ipa:"/ˈfrendli/",zh:"友好的"},{en:"nature",ipa:"/ˈneɪtʃə/",zh:"大自然"},{en:"building",ipa:"/ˈbɪldɪŋ/",zh:"建筑物"},{en:"air",ipa:"/eə/",zh:"空中"},{en:"British",ipa:"/ˈbrɪtɪʃ/",zh:"英国的"},{en:"cave",ipa:"/keɪv/",zh:"洞穴"},{en:"solve",ipa:"/sɒlv/",zh:"解决"}],phrases:[{en:"science fiction",ipa:"/ˈsaɪəns ˈfɪkʃn/",zh:"科幻小说"},{en:"book report",ipa:"/bʊk rɪˈpɔːt/",zh:"读书报告"},{en:"the past",ipa:"/ðə pɑːst/",zh:"过去"},{en:"on horseback",ipa:"/ɒn ˈhɔːsbæk/",zh:"骑马"},{en:"bring back to life",ipa:"/brɪŋ bæk tu laɪf/",zh:"使恢复生机"},{en:"get well",ipa:"/ɡet wel/",zh:"康复"},{en:"care about",ipa:"/keə əˈbaʊt/",zh:"关心"},{en:"be interested in",ipa:"/biː ˈɪntrəstɪd ɪn/",zh:"对……感兴趣"},{en:"talk about",ipa:"/tɔːk əˈbaʊt/",zh:"谈论"},{en:"read on and on",ipa:"/riːd ɒn ænd ɒn/",zh:"一直读下去"}],sentences:[{en:"It's library day again! I'm excited!",ipa:"/ɪts ˈlaɪbrəri deɪ əˈɡen aɪm ɪkˈsaɪtɪd/",zh:"又是图书馆日了！我很兴奋！",point:"library day = 图书馆日。"},{en:"It comes every week, rain or sun.",ipa:"/ɪt kʌmz ˈevri wiːk reɪn ɔː sʌn/",zh:"它每周都来，风雨无阻。",point:"rain or sun = 风雨无阻。"},{en:"Did you also have library day in the past, Mum? Yes, we did.",ipa:"/dɪd juː ˈɔːlsəʊ hæv ˈlaɪbrəri deɪ ɪn ðə pɑːst mʌm jes wiː dɪd/",zh:"妈妈，你过去也有图书馆日吗？是的，我们有。",point:"一般过去时的一般疑问句。"},{en:"Were there many books? No, there weren't.",ipa:"/wɜː ðeə ˈmeni bʊks nəʊ ðeə wɜːnt/",zh:"有很多书吗？不，没有。",point:"Were {name:"Unit 4 Back in time",words:[{en:"lamp",ipa:"/læmp/",zh:"灯"},{en:"pot",ipa:"/pɒt/",zh:"陶制容器"},{en:"pillow",ipa:"/ˈpɪləʊ/",zh:"枕头"},{en:"mirror",ipa:"/ˈmɪrə/",zh:"镜子"},{en:"icebox",ipa:"/ˈaɪsbɒks/",zh:"冰箱"},{en:"ancient",ipa:"/ˈeɪnʃənt/",zh:"古代的"},{en:"ago",ipa:"/əˈɡəʊ/",zh:"以前"},{en:"central",ipa:"/ˈsentrəl/",zh:"中部的"},{en:"silk",ipa:"/sɪlk/",zh:"丝绸"},{en:"February",ipa:"/ˈfebruəri/",zh:"二月"},{en:"expensive",ipa:"/ɪkˈspensɪv/",zh:"昂贵的"},{en:"March",ipa:"/mɑːtʃ/",zh:"三月"},{en:"river",ipa:"/ˈrɪvə/",zh:"江，河"},{en:"quickly",ipa:"/ˈkwɪkli/",zh:"快速地"},{en:"pull",ipa:"/pʊl/",zh:"拉"},{en:"hole",ipa:"/həʊl/",zh:"洞"},{en:"cheese",ipa:"/tʃiːz/",zh:"奶酪"},{en:"daughter",ipa:"/ˈdɔːtə/",zh:"女儿"},{en:"choice",ipa:"/tʃɔɪs/",zh:"选择"},{en:"save",ipa:"/seɪv/",zh:"拯救"},{en:"protect",ipa:"/prəˈtekt/",zh:"保护"},{en:"voice",ipa:"/vɔɪs/",zh:"嗓音"},{en:"painting",ipa:"/ˈpeɪntɪŋ/",zh:"绘画"}],phrases:[{en:"the Tang Dynasty",ipa:"/ðə tæŋ ˈdaɪnəsti/",zh:"唐朝"},{en:"the Silk Road",ipa:"/ðə sɪlk rəʊd/",zh:"丝绸之路"},{en:"National Museum of China",ipa:"/ˈnæʃnəl mjuˈziːəm əv ˈtʃaɪnə/",zh:"中国国家博物馆"},{en:"over 1,000 years ago",ipa:"/ˈəʊvə wʌn ˈθaʊznd jɪəz əˈɡəʊ/",zh:"一千多年前"},{en:"a pair of",ipa:"/ə peə əv/",zh:"一双"},{en:"put...in...",ipa:"/pʊt ɪn/",zh:"把……放进……"},{en:"pull down",ipa:"/pʊl daʊn/",zh:"推倒"},{en:"stop the fire",ipa:"/stɒp ðə ˈfaɪə/",zh:"阻止火灾"},{en:"protect history",ipa:"/prəˈtekt ˈhɪstri/",zh:"保护历史"},{en:"learn about the past",ipa:"/lɜːn əˈbaʊt ðə pɑːst/",zh:"了解过去"}],sentences:[{en:"I went to the National Museum of China yesterday.",ipa:"/aɪ went tu ðə ˈnæʃnəl mjuˈziːəm əv ˈtʃaɪnə ˈjestədeɪ/",zh:"我昨天去了中国国家博物馆。",point:"went 是 go 的过去式。"},{en:"I saw an ancient dumpling from Xinjiang!",ipa:"/aɪ sɔː ən ˈeɪnʃənt ˈdʌmplɪŋ frɒm ˈʃɪndʒjɑːŋ/",zh:"我看到了一个来自新疆的古代饺子！",point:"saw 是 see 的过去式。"},{en:"It looks just like dumplings today.",ipa:"/ɪt lʊks dʒʌst laɪk ˈdʌmplɪŋz təˈdeɪ/",zh:"它看起来和今天的饺子一模一样。",point:"look just like = 看起来完全像。"},{en:"People ate dumplings over 1,000 years ago!",ipa:"/ˈpiːpl eɪt ˈdʌmplɪŋ t naʊ ˈaʊə skuːl ɪz naɪs ænd bɪɡ/",zh:"现在情况大不相同了。我们的学校又好又大。",point:"very different = 大不相同。"},{en:"In the past, people lived in small houses.",ipa:"/ɪn ðə pɑːst ˈpiːpl lɪvd ɪn smɔːl ˈhaʊzɪz/",zh:"过去，人们住在小房子里。",point:"lived 是 live 的过去式。"},{en:"But now many people live in big houses.",ipa:"/bʌt naʊ ˈmeni ˈpiːpl lɪv ɪn bɪɡ ˈhaʊzɪz/",zh:"但现在许多人住在大房子里。",point:"live in = 住在。"},{en:"A time capsule is a special box. People put letters, pictures, or toys in it.",ipa:"/ə taɪm ˈkæpsjuːl ɪz ə ˈspeʃl bɒks ˈpiːpl pʊt ˈletəz ˈpɪktʃəz ɔː tɔɪz ɪn ɪt/",zh:"时间胶囊是一个特殊的盒子。人们把信、照片或玩具放进去。",point:"time capsule = 时间胶囊。"},{en:"In 2010, people in China made a special time capsule. It is a computer chip.",ipa:"/ɪn tuː ˈθaʊznd ənd ten ˈpiːpl ɪn ˈtʃaɪnə meɪd ə ˈspeʃl taɪm ˈkæpsjuːl ɪt ɪz ə kəmˈpjuːtə tʃɪp/",zh:"2010年，中国人制作了一个特殊的时间胶囊。它是一个电脑芯片。",point:"a computer chip = 一个电脑芯片。"}]}

var cgIdx=0,cuIdx=0,ct="word",cl=[],ci=0;
var voicesReady=false,englishVoice=null;
function $(id){return document.getElementById(id)}
function loadVoices(){if(!window.speechSynthesis)return;var v=window.speechSynthesis.getVoices();if(v.length>0){voicesReady=true;englishVoice=v.find(function(x){return x.lang==="en-US"})||v.find(function(x){return x.lang==="en-GB"})||v.find(function(x){return x.lang.startsWith("en")})}}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,500);setTimeout(loadVoices,1500)}
function updGrades(){$("gs").innerHTML=GRADES.map(function(g,i){return'<option value="'+i+'">'+g.name+'</option>'}).join("")}
function updUnits(){$("us").innerHTML=GRADES[cgIdx].units.map(function(u,i){return'<option value="'+i+'">'+u.name+'</option>'}).join("")}
function ref(){var u=GRADES[cgIdx].units[cuIdx];cl=u[FIELD_MAP[ct]]||[];ci=0;ui()}
function ui(){
  $("card").classList.remove("masked");
  if(!cl.length){$("bw").textContent="—";$("ipa").textContent="";$("mn").textContent="本类暂无内容";$("pg").textContent="0 / 0";$("pv").disabled=true;$("nx").disabled=true;$("pbox").classList.remove("show");return}
  var it=cl[ci];$("bw").textContent=it.en;$("bw").className="big"+(ct==="sentence"?" sm":"");$("ipa").textContent=it.ipa||"";$("mn").textContent=it.zh;$("pg").textContent=(ci+1)+" / "+cl.length;
  if(ct==="sentence"&&it.point){$("pcontent").textContent=it.point;$("pbox").classList.add("show")}else{$("pbox").classList.remove("show")}
  $("inp").value="";$("fb").textContent="试着拼写听到的内容吧~";$("fb").className="fb";$("pv").disabled=ci===0;$("nx").disabled=ci===cl.length-1;drawDots()
}
function drawDots(){var d=$("dots");d.innerHTML="";cl.forEach(function(_,i){var dot=document.createElement("div");dot.className="dot"+(i===ci?" on":"");dot.onclick=function(){if(i!==ci){ci=i;ui()}};d.appendChild(dot)})}
function speak(auto){
  if(!cl.length)return;
  
  if(!window.speechSynthesis){
    if(!auto) alert("当前环境不支持语音朗读。\n请点击右上角，选择“用其他应用打开”。");
    return;
  }
  
  // 尝试加载语音，但不强制拦截
  if(!voicesReady) loadVoices();
  
  window.speechSynthesis.cancel();
  window.speechSynthesis.resume();
  
  var u=new SpeechSynthesisUtterance(cl[ci].en);
  u.lang="en-US";
  u.rate=ct==="sentence"?0.75:0.85;
  u.pitch=1;
  u.volume=1;
  if(englishVoice) u.voice=englishVoice;
  
  // 如果朗读出错，在底部温和提示，不再弹窗
  u.onerror = function(e){
    $("fb").textContent = "⚠️ 语音未加载，请多试几次，或使用 Edge 的“大声朗读”功能";
    $("fb").className = "fb no";
  };
  
  window.speechSynthesis.speak(u);
}
function check(){
  if(!cl.length)return;
  $("card").classList.remove("masked");
  var a=$("inp").value.trim().toLowerCase().replace(/\s+/g," ");
  var b=cl[ci].en.toLowerCase().replace(/\s+/g," ");
  if(!a){$("fb").textContent="✏️ 先输入内容吧～";$("fb").className="fb no";return}
  if(a===b){$("fb").textContent="🎉 完全正确！好棒！";$("fb").className="fb ok"}
  else{$("fb").textContent='❌ 再试试？正确拼写是 "'+cl[ci].en+'"';$("fb").className="fb no"}
}
function clr(){$("inp").value="";$("fb").textContent="试着拼写听到的内容吧~";$("fb").className="fb";$("inp").focus()}
function goPrev(){if(ci>0){ci--;ui();setTimeout(function(){speak(true)},300)}}
function goNext(){if(ci<cl.length-1){ci++;ui();setTimeout(function(){speak(true)},300)}}
var overlay=$("overlay"),popup=$("popup"),plist=$("plist"),ptitle=$("ptitle");
function openPopup(type){var u=GRADES[cgIdx].units[cuIdx];var items=u[FIELD_MAP[type]]||[];var tn=type==="word"?"单词":type==="phrase"?"词组":"句子";ptitle.textContent="选择"+tn+"（"+items.length+"个）";plist.innerHTML="";items.forEach(function(item,i){var div=document.createElement("div");div.className="popup-item"+(i===ci&&ct===type?" cur":"");var right=item.zh;if(type==="sentence"&&item.point)right="💡 "+item.zh;div.innerHTML='<span class="pi-en">'+item.en+'</span><span class="pi-zh">'+right+'</span>';div.onclick=function(){ct=type;document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.getAttribute("data-type")===type)});var u2=GRADES[cgIdx].units[cuIdx];cl=u2[FIELD_MAP[type]]||[];ci=i;ui();closePopup();setTimeout(function(){speak(true)},200)};plist.appendChild(div)});overlay.classList.add("show");popup.classList.add("show")}
function closePopup(){overlay.classList.remove("show");popup.classList.remove("show")}
overlay.onclick=closePopup;$("pclose").onclick=closePopup;
$("gs").onchange=function(){cgIdx=parseInt(this.value);cuIdx=0;updUnits();ref()};
$("us").onchange=function(){cuIdx=parseInt(this.value);ref()};
document.querySelectorAll(".tab").forEach(function(tab){tab.onclick=function(){var type=tab.getAttribute("data-type");ct=type;document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});tab.classList.add("active");var u=GRADES[cgIdx].units[cuIdx];cl=u[FIELD_MAP[type]]||[];ci=0;ui();openPopup(type)}});
$("lb").onclick=function(){speak(false)};$("spk").onclick=function(){speak(false)};$("card").onclick=function(){speak(false)};$("cb").onclick=clr;$("ckb").onclick=check;
$("inp").onkeypress=function(e){if(e.key==="Enter"){e.preventDefault();check()}};
document.onkeydown=function(e){
  var inInput = document.activeElement === $("inp");
  if(inInput && (e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key==="ArrowUp"||e.key==="ArrowDown")) return;
  if(e.key==="ArrowLeft"){
    e.preventDefault();
    if(ci>0){ci--;ui();setTimeout(function(){speak(true)},300);}
  } else if(e.key==="ArrowRight"){
    e.preventDefault();
    if(ci<cl.length-1){ci++;ui();setTimeout(function(){speak(true)},300);}
  } else if(e.key==="ArrowUp"||e.key==="ArrowDown"){
    e.preventDefault();
    var tabs = document.querySelectorAll(".tab");
    var currentIndex = Array.from(tabs).findIndex(function(t){return t.classList.contains("active")});
    var nextIndex;
    if(e.key==="ArrowUp"){
      nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
    } else {
      nextIndex = (currentIndex + 1) % tabs.length;
    }
    var nextTab = tabs[nextIndex];
    var nextType = nextTab.getAttribute("data-type");
    ct = nextType;
    tabs.forEach(function(t){t.classList.remove("active")});
    nextTab.classList.add("active");
    var u = GRADES[cgIdx].units[cuIdx];
    cl = u[FIELD_MAP[nextType]] || [];
    ci = 0;
    ui();
    setTimeout(function(){speak(true)},300);
  }
};
$("inp").addEventListener("focus",function(){$("card").classList.add("masked")});
$("inp").addEventListener("input",function(){$("card").classList.add("masked")});
$("pv").onclick=goPrev;$("nx").onclick=goNext;
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()}}
updGrades();updUnits();ref();
</script>
</body>
</html>
