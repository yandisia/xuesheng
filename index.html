.popup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:#fffdf5;border:4px solid #f3d19b;border-radius:40px;box-shadow:0 20px 40px rgba(0,0,0,.25);padding:20px;max-width:560px;width:90%;max-height:75vh;overflow-y:auto;z-index:1000;opacity:0;pointer-events:none;transition:.2s}

Dad, may I play outside?",ipa:"/dæd meɪ aɪ pleɪ ˌaʊtˈsaɪd/",zh:"爸爸，我可以出去玩吗？",point:"May I...? 委婉地请求许可。"},{en:"OK. That's easy.",ipa:"/əʊˈkeɪ ðæts ˈiːzi/",zh:"好的。那很简单。",point:"That's easy = 那很简单。"},{en:"Bobby, can you help me clean the floor?",ipa:"/ˈbɒbi kæn juː help miː kliːn ðə flɔː/",zh:"博比，你能帮我擦地板吗？",point:"help sb. do sth. 帮助某人做某事。"},{en:"Go, Bobby! Good job!",ipa:"/ɡəʊ ˈbɒbi ɡʊd dʒɒb/",zh:"去吧，博比！干得好！",point:"Good job! = 干得好！"},{en:"Bobby, stop! Look! It's so dirty now!",ipa:"/ˈbɒbi stɒp lʊk ɪts səʊ ˈdɜːti naʊ/",zh:"博比，停下！看！现在好脏啊！",point:"so + 形容词，表示如此……。"},{en:"Sam, are you still busy?",ipa:"/sæm ɑː juː stɪl ˈbɪzi/",zh:"萨姆，你还在忙吗？",point:"still 表示仍然。"},{en:"Yes, Dad. I need to clean the floor, the desk and the wall.",ipa:"/jes dæd aɪ niːd tu kliːn ðə flɔː ðə desk ænd ðə wɔːl/",zh:"是的，爸爸。我需要擦地板、书桌和墙。",point:"need to + 动词原形，表示需要做某事。"},{en:"My room is clean now, Dad.",ipa:"/maɪ ruːm ɪz kliːn naʊ dæd/",zh:"我的房间现在干净了，爸爸。",point:"is clean 表示状态。"},{en:"Good job! But we still have a lot of chores to do.",ipa:"/ɡʊd dʒɒb bʌt wiː stɪl hæv ə lɒt əv tʃɔːz tu duː/",zh:"干得好！但我们还有很多家务要做。",point:"a lot of + 名词，表示许多。"},{en:"OK! May I sweep the floor first?",ipa:"/əʊˈkeɪ maɪ aɪ swiːp ðə flɔː fɜːst/",zh:"好的！我可以先扫地吗？",point:"May I...? 请求许可。"},{en:"Sure! The floor is clean now.",ipa:"/ʃʊə ðə flɔː ɪz kliːn naʊ/",zh:"当然！地板现在干净了。",point:"Sure = 当然。"},{en:"Can you also take out the rubbish?",ipa:"/kæn juː ˈɔːlsəʊ teɪk aʊt ðə ˈrʌbɪʃ/",zh:"你也能倒垃圾吗？",point:"also 表示也。"},{en:"I'm Yao Qinwen. This is my family.",ipa:"/aɪm jaʊ tʃɪn wən ðɪs ɪz maɪ ˈfæməli/",zh:"我是姚沁雯。这是我的家庭。",point:"This is... 介绍人物。"},{en:"My dad is ill. My grandma is old. My mum is busy. I must help!",ipa:"/maɪ dæd ɪz ɪl maɪ ˈɡrænmɑː ɪz əʊld maɪ mʌm ɪz ˈbɪzi aɪ mʌst help/",zh:"我爸爸生病了。我奶奶年纪大了。我妈妈很忙。我必须帮忙！",point:"must + 动词原形，表示必须做某事。"},{en:"I take care of Dad. Can I make the bed for you, Dad?",ipa:"/aɪ teɪk keə əv dæd kæn aɪ meɪk ðə bed fɔː juː dæd/",zh:"我照顾爸爸。爸爸，我能为你整理床铺吗？",point:"take care of = 照顾。"},{en:"Wenwen, can you help clean the room?",ipa:"/ˈwenwen kæn juː help kliːn ðə ruːm/",zh:"雯雯，你能帮忙打扫房间吗？",point:"help clean = 帮忙打扫。"},{en:"Sometimes Mum feels tired. I take care of her, too.",ipa:"/ˈsʌmtaɪmz mʌm fiːlz ˈtaɪəd aɪ teɪk keə əv hɜː tuː/",zh:"有时妈妈感到累。我也照顾她。",point:"sometimes 表示有时。"},{en:"May I help you wash the dishes, Mum?",ipa:"/meɪ aɪ help juː wɒʃ ðə ˈdɪʃɪz mʌm/",zh:"妈妈，我可以帮你洗碗吗？",point:"May I help you...? 礼貌地提供帮助。"},{en:"Wenwen is so helpful. She is the sunshine of our family.",ipa:"/ˈwenwen ɪz səʊ ˈhelpfl ʃiː ɪz ðə ˈsʌnʃaɪn əv ˈaʊə ˈfæməli/",zh:"雯雯非常乐于助人。她是我们家的阳光。",point:"helpful = 乐于助人的。"},{en:"I'm happy to warm up my family.",ipa:"/aɪm ˈhæpi tu wɔːm ʌp maɪ ˈfæməli/",zh:"我很高兴能温暖我的家庭。",point:"warm up = 使温暖。"},{en:"Dad and Mum work hard on the farm.",ipa:"/dæd ænd mʌm wɜːk hɑːd ɒn ðə fɑːm/",zh:"爸爸妈妈在农场努力工作。",point:"work hard = 努力工作。"},{en:"Together we help around the house.",ipa:"/təˈɡeðə wiː help əˈraʊnd ðə haʊs/",zh:"我们一起帮忙做家务。",point:"help around the house = 帮忙做家务。"},{en:"Water the vegetables. Sweep the yard. Feed the chickens. And wash up.",ipa:"/ˈwɔːtə ðə ˈvedʒtəblz swiːp ðə jɑːd fiːd ðə ˈtʃɪkɪnz ænd wɒʃ ʌp/",zh:"给蔬菜浇水。扫院子。喂鸡。还有洗碗。",point:"祈使句用动词原形开头。"},{en:"You and me, let's work hard. We're good helpers to Mum and Dad.",ipa:"/juː ænd miː lets wɜːk hɑːd wɪə ɡʊd ˈhelpəz tu mʌm ænd dæd/",zh:"你和我，让我们努力工作。我们是爸爸妈妈的好帮手。",point:"helper 是 help + er 构成的名词。"},{en:"Can you help me on the farm?",ipa:"/kæn juː help miː ɒn ðə fɑːm/",zh:"你能在农场帮我吗？",point:"on the farm = 在农场。"},{en:"OK! I can feed the pigs.",ipa:"/əʊˈkeɪ aɪ kæn fiːd ðə pɪɡz/",zh:"好的！我会喂猪。",point:"feed the pigs = 喂猪。"},{en:"Pick a number.",ipa:"/pɪk ə ˈnʌmbə/",zh:"选一个数字。",point:"pick = 选择。"},{en:"OK. Can you help make the beds?",ipa:"/əʊˈkeɪ kæn juː help meɪk ðə bedz/",zh:"好的。你能帮忙整理床铺吗？",point:"help make = 帮忙整理。"}]},
{name:"Unit 3 What's the weather like?",words:[{en:"weather",ipa:"/ˈweðə/",zh:"天气"},{en:"sunny",ipa:"/ˈsʌni/",zh:"阳光充足的"},{en:"cloud",ipa:"/klaʊd/",zh:"云"},{en:"cloudy",ipa:"/ˈklaʊdi/",zh:"多云的"},{en:"wind",ipa:"/wɪnd/",zh:"风"},{en:"windy",ipa:"/ˈwɪndi/",zh:"风大的"},{en:"rain",ipa:"/reɪn/",zh:"雨"},{en:"rainy",ipa:"/ˈreɪni/",zh:"下雨的"},{en:"snow",ipa:"/snəʊ/",zh:"雪"},{en:"snowy",ipa:"/ˈsnəʊi/",zh:"下雪的"},{en:"cold",ipa:"/kəʊld/",zh:"冷的"},{en:"warm",ipa:"/wɔːm/",zh:"温暖的"},{en:"hot",ipa:"/hɒt/",zh:"炎热的"},{en:"cool",ipa:"/kuːl/",zh:"凉爽的"},{en:"report",ipa:"/rɪˈpɔːt/",zh:"报道"},{en:"TV",ipa:"/tiː viː/",zh:"电视"},{en:"turn on",ipa:"/tɜːn ɒn/",zh:"打开"},{en:"coat",ipa:"/kəʊt/",zh:"外套"},{en:"umbrella",ipa:"/ʌmˈbrelə/",zh:"雨伞"},{en:"diary",ipa:"/ˈdaɪəri/",zh:"日记"}],phrases:[{en:"weather report",ipa:"/ˈweðə rɪˈpɔːt/",zh:"天气预报"},{en:"watch the report",ipa:"/wɒtʃ ðə rɪˈpɔːt/",zh:"看报道"},{en:"go out to play",ipa:"/ɡəʊ aʊt tu pleɪ/",zh:"外出游玩"},{en:"go home",ipa:"/ɡəʊ həʊm/",zh:"回家"},{en:"turn on the TV",ipa:"/tɜːn ɒn ðə tiː viː/",zh:"打开电视"},{en:"in the sun",ipa:"/ɪn ðə sʌn/",zh:"在太阳下"},{en:"play in the snow",ipa:"/pleɪ ɪn ðə snəʊ/",zh:"在雪中玩"},{en:"What's the weather like?",ipa:"/wɒts ðə ˈweðə laɪk/",zh:"天气怎么样？"}],sentences:[{en:"The sun comes up, up, up.",ipa:"/ðə sʌn kʌmz ʌp ʌp ʌp/",zh:"太阳升起来，升起来，升起来。",point:"come up = 升起。"},{en:"It's sunny, sunny, sunny.",ipa:"/ɪts ˈsʌni ˈsʌni ˈsʌni/",zh:"天气晴朗，晴朗，晴朗。",point:"It's + 天气形容词。"},{en:"It's cloudy, cloudy, cloudy.",ipa:"/ɪts ˈklaʊdi ˈklaʊdi ˈklaʊdi/",zh:"多云，多云，多云。",point:"cloud + y = cloudy。"},{en:"The wind blows around, around, around.",ipa:"/ðə wɪnd bləʊz əˈraʊnd əˈraʊnd əˈraʊnd/",zh:"风到处吹，吹，吹。",point:"blow around = 到处吹。"},{en:"It's windy, windy, windy.",ipa:"/ɪts ˈwɪndi ˈwɪndi ˈwɪndi/",zh:"刮风，刮风，刮风。",point:"wind + y = windy。"},{en:"It's rainy, rainy, rainy.",ipa:"/ɪts ˈreɪni ˈreɪni ˈreɪni/",zh:"下雨，下雨，下雨。",point:"rain + y = rainy。"},{en:"It's snowy, snowy, snowy.",ipa:"/ɪts ˈsnəʊi ˈsnəʊi ˈsnəʊi/",zh:"下雪，下雪，下雪。",point:"snow + y = snowy。"},{en:"In any weather, we have fun.",ipa:"/ɪn ˈeni ˈweðə wiː hæv fʌn/",zh:"在任何天气里，我们都玩得开心。",point:"have fun = 玩得开心。"},{en:"Hot, cold, cool or warm. Enjoy them all!",ipa:"/hɒt kəʊld kuːl ɔː wɔːm ɪnˈdʒɔɪ ðəm ɔːl/",zh:"热、冷、凉或暖。享受它们吧！",point:"enjoy = 享受。"},{en:"What's the weather like?",ipa:"/wɒts ðə ˈweðə laɪk/",zh:"天气怎么样？",point:"询问天气的固定句型。"},{en:"It's sunny and warm. We can go out to play.",ipa:"/ɪts ˈsʌni ænd wɔːm wiː kæn ɡəʊ aʊt tu pleɪ/",zh:"天气晴朗且温暖。我们可以出去玩。",point:"It's + 天气形容词 + and + 天气形容词。"},{en:"Oh, it's cool!",ipa:"/əʊ ɪts kuːl/",zh:"哦，很凉爽！",point:"cool 表示凉爽的。"},{en:"It's windy and cloudy. Let's go home!",ipa:"/ɪts ˈwɪndi ænd ˈklaʊdi lets ɡəʊ həʊm/",zh:"刮风又多云。我们回家吧！",point:"Let's + 动词原形，提出建议。"},{en:"Oh! It's rainy now.",ipa:"/əʊ ɪts ˈreɪni naʊ/",zh:"哦！现在下雨了。",point:"now 表示现在。"},{en:"Let's run!",ipa:"/lets rʌn/",zh:"我们跑吧！",point:"Let's + 动词原形。"},{en:"Look! I've got a good idea.",ipa:"/lʊk aɪv ɡɒt ə ɡʊd aɪˈdɪə/",zh:"看！我有个好主意。",point:"I've got = I have got，表示我有。"},{en:"Our umbrellas are great!",ipa:"/ˈaʊər ʌmˈbreləz ɑː ɡreɪt/",zh:"我们的雨伞很棒！",point:"umbrella 的复数是 umbrellas。"},{en:"Look! Let's go and help!",ipa:"/lʊk lets ɡəʊ ænd help/",zh:"看！我们去帮忙吧！",point:"go and help = 去帮忙。"},{en:"What's the weather like today?",ipa:"/wɒts ðə ˈweðə laɪk təˈdeɪ/",zh:"今天天气怎么样？",point:"today 表示今天。"},{en:"Is it cold or hot?",ipa:"/ɪz ɪt kəʊld ɔː hɒt/",zh:"天气是冷的还是热的？",point:"选择疑问句：Is it + A + or + B?"},{en:"Do I need my coat or not?",ipa:"/duː aɪ niːd maɪ kəʊt ɔː nɒt/",zh:"我需要外套吗？",point:"need + 名词，表示需要某物。"},{en:"Is it rainy or sunny?",ipa:"/ɪz ɪt ˈreɪni ɔː ˈsʌni/",zh:"是下雨还是晴天？",point:"选择疑问句。"},{en:"Can we have some fun outside?",ipa:"/kæn wiː hæv sʌm fʌn ˌaʊtˈsaɪd/",zh:"我们能在外面玩吗？",point:"have fun = 玩得开心。"},{en:"Come on! Let's turn on the TV.",ipa:"/kʌm ɒn lets tɜːn ɒn ðə tiː viː/",zh:"来吧！我们打开电视。",point:"turn on = 打开。"},{en:"Let's watch the report today!",ipa:"/lets wɒtʃ ðə rɪˈpɔːt təˈdeɪ/",zh:"我们今天看报道吧！",point:"watch the report = 看报道。"},{en:"Liu Fei is a teacher at a children's home in Sanya.",ipa:"/ljuː feɪ ɪz ə ˈtiːtʃə æt ə ˈtʃɪldrənz həʊm ɪn ˈsænjɑː/",zh:"刘飞是三亚一所儿童之家的老师。",point:"children's home = 儿童之家。"},{en:"Lin Jia, what's the weather like there today?",ipa:"/lɪn dʒjɑː wɒts ðə ˈweðə laɪk ðeə təˈdeɪ/",zh:"林佳，今天那里的天气怎么样？",point:"there 表示那里。"},{en:"It's snowy and cold.",ipa:"/ɪts ˈsnəʊi ænd kəʊld/",zh:"下雪而且很冷。",point:"snowy and cold = 下雪且冷。"},{en:"Does it taste like ice cream?",ipa:"/dʌz ɪt teɪst laɪk aɪs kriːm/",zh:"它尝起来像冰激凌吗？",point:"taste like = 尝起来像。"},{en:"What is snow like?",ipa:"/wɒt ɪz snəʊ laɪk/",zh:"雪是什么样的？",point:"What is...like? 询问……是什么样的。"},{en:"The children here want to see real snow.",ipa:"/ðə ˈtʃɪldrən hɪə wɒnt tu siː rɪəl snəʊ/",zh:"这里的孩子们想看真正的雪。",point:"want to + 动词原形，表示想做某事。"},{en:"But it's hot in Sanya. It never snows!",ipa:"/bʌt ɪts hɒt ɪn ˈsænjɑː ɪt ˈnevə snəʊz/",zh:"但三亚很热。从不下雪！",point:"never 表示从不。"},{en:"Here is some snow for the children.",ipa:"/hɪər ɪz sʌm snəʊ fɔː ðə ˈtʃɪldrən/",zh:"这里有一些雪给孩子们。",point:"Here is... = 这里有……。"},{en:"I hope they like it!",ipa:"/aɪ həʊp ðeɪ laɪk ɪt/",zh:"我希望他们喜欢！",point:"hope + 句子，表示希望。"},{en:"Liu Fei takes the snow to the children's home.",ipa:"/ljuː feɪ teɪks ðə snəʊ tu ðə ˈtʃɪldrənz həʊm/",zh:"刘飞把雪带到儿童之家。",point:"take...to... = 把……带到……。"},{en:"Look! Real snow!",ipa:"/lʊk rɪəl snəʊ/",zh:"看！真正的雪！",point:"real = 真正的。"},{en:"Hooray!",ipa:"/huˈreɪ/",zh:"好耶！",point:"表示欢呼。"},{en:"Thank you! We love our snowy day!",ipa:"/θæŋk juː wiː lʌv ˈaʊə ˈsnəʊi deɪ/",zh:"谢谢你！我们喜欢我们的下雪天！",point:"love = 喜欢。"},{en:"The weather is very hot in Sanya.",ipa:"/ðə ˈweðə ɪz ˈveri hɒt ɪn ˈsænjɑː/",zh:"三亚的天气非常热。",point:"very + 形容词。"},{en:"But it's snowy today!",ipa:"/bʌt ɪts ˈsnəʊi təˈdeɪ/",zh:"但今天下雪了！",point:"but 表示转折。"},{en:"The snow comes from Harbin.",ipa:"/ðə snəʊ kʌmz frɒm ˈhɑːbɪn/",zh:"雪来自哈尔滨。",point:"come from = 来自。"},{en:"It's cold. We're happy!",ipa:"/ɪts kəʊld wɪə ˈhæpi/",zh:"很冷。我们很开心！",point:"We're = We are。"}]},
{name:"Unit 4 Wonderful seasons",words:[{en:"season",ipa:"/ˈsiːzn/",zh:"季节"},{en:"spring",ipa:"/sprɪŋ/",zh:"春天"},{en:"summer",ipa:"/ˈsʌmə/",zh:"夏天"},{en:"autumn",ipa:"/ˈɔːtəm/",zh:"秋天"},{en:"winter",ipa:"/ˈwɪntə/",zh:"冬天"},{en:"favourite",ipa:"/ˈfeɪvərɪt/",zh:"最喜欢的"},{en:"birthday",ipa:"/ˈbɜːθdeɪ/",zh:"生日"},{en:"beach",ipa:"/biːtʃ/",zh:"海滩"},{en:"sea",ipa:"/siː/",zh:"海"},{en:"fly",ipa:"/flaɪ/",zh:"放飞"},{en:"kite",ipa:"/kaɪt/",zh:"风筝"},{en:"picnic",ipa:"/ˈpɪknɪk/",zh:"野餐"},{en:"equator",ipa:"/ɪˈkweɪtə/",zh:"赤道"},{en:"round",ipa:"/raʊnd/",zh:"循环地"},{en:"all year round",ipa:"/ɔːl jɪə raʊnd/",zh:"全年"},{en:"quite",ipa:"/kwaɪt/",zh:"非常"}],phrases:[{en:"fly kites",ipa:"/flaɪ kaɪts/",zh:"放风筝"},{en:"play in the snow",ipa:"/pleɪ ɪn ðə snəʊ/",zh:"在雪中玩"},{en:"in spring",ipa:"/ɪn sprɪŋ/",zh:"在春天"},{en:"in summer",ipa:"/ɪn ˈsʌmə/",zh:"在夏天"},{en:"in autumn",ipa:"/ɪn ˈɔːtəm/",zh:"在秋天"},{en:"in winter",ipa:"/ɪn ˈwɪntə/",zh:"在冬天"},{en:"go to the beach",ipa:"/ɡəʊ tu ðə biːtʃ/",zh:"去海滩"},{en:"make a snowman",ipa:"/meɪk ə ˈsnəʊmæn/",zh:"堆雪人"},{en:"all year round",ipa:"/ɔːl jɪə raʊnd/",zh:"全年"},{en:"go swimming",ipa:"/ɡəʊ ˈswɪmɪŋ/",zh:"去游泳"},{en:"my favourite season",ipa:"/maɪ ˈfeɪvərɪt ˈsiːzn/",zh:"我最喜欢的季节"}],sentences:[{en:"Spring, summer, autumn and winter. Four seasons in a year.",ipa:"/sprɪŋ ˈsʌmə ˈɔːtəm ænd ˈwɪntə fɔː ˈsiːznz ɪn ə jɪə/",zh:"春天、夏天、秋天和冬天。一年有四个季节。",point:"four seasons = 四个季节。"},{en:"Here comes spring. Flowers are all around.",ipa:"/hɪə kʌmz sprɪŋ ˈflaʊəz ɑː ɔːl əˈraʊnd/",zh:"春天来了。到处都是花。",point:"Here comes... = ……来了。"},{en:"Here comes summer. It's so hot in the sun.",ipa:"/hɪə kʌmz ˈsʌmə ɪts səʊ hɒt ɪn ðə sʌn/",zh:"夏天来了。太阳下很热。",point:"so + 形容词，表示如此……。"},{en:"Here comes autumn. The trees have so many colours.",ipa:"/hɪə kʌmz ˈɔːtəm ðə triːz hæv səʊ ˈmeni ˈkʌləz/",zh:"秋天来了。树木有如此多的颜色。",point:"so many + 复数名词。"},{en:"Here comes winter. It's so much fun with ice and snow.",ipa:"/hɪə kʌmz ˈwɪntə ɪts səʊ mʌtʃ fʌn wɪð aɪs ænd snəʊ/",zh:"冬天来了。有冰和雪，非常有趣。",point:"so much fun = 非常有趣。"},{en:"What's your favourite season, friends?",ipa:"/wɒts jɔː ˈfeɪvərɪt ˈsiːzn frendz/",zh:"朋友们，你们最喜欢的季节是什么？",point:"询问最喜欢的季节。"},{en:"I like winter best. I can play in the snow.",ipa:"/aɪ laɪk ˈwɪntə best aɪ kæn pleɪ ɪn ðə snəʊ/",zh:"我最喜欢冬天。我可以在雪中玩。",point:"like...best = 最喜欢……。"},{en:"I don't like winter. It's cold.",ipa:"/aɪ dəʊnt laɪk ˈwɪntə ɪts kəʊld/",zh:"我不喜欢冬天。很冷。",point:"don't like = 不喜欢。"},{en:"I like spring and autumn. They are beautiful.",ipa:"/aɪ laɪk sprɪŋ ænd ˈɔːtəm ðeɪ ɑː ˈbjuːtəfl/",zh:"我喜欢春天和秋天。它们很美。",point:"They are + 形容词。"},{en:"I like summer best. I can eat ice cream.",ipa:"/aɪ laɪk ˈsʌmə best aɪ kæn iːt aɪs kriːm/",zh:"我最喜欢夏天。我可以吃冰激凌。",point:"eat ice cream = 吃冰激凌。"},{en:"What about you, Lingling?",ipa:"/wɒt əˈbaʊt juː ˌlɪŋˈlɪŋ/",zh:"你呢，玲玲？",point:"What about you? 询问对方。"},{en:"I like summer best, too.",ipa:"/aɪ laɪk ˈsʌmə best tuː/",zh:"我也最喜欢夏天。",point:"too 表示也。"},{en:"Why do you also like summer?",ipa:"/waɪ duː juː ˈɔːlsəʊ laɪk ˈsʌmə/",zh:"你为什么也喜欢夏天？",point:"Why do you like...? 询问原因。"},{en:"Because my birthday is in summer!",ipa:"/bɪˈkɒz maɪ ˈbɜːθdeɪ ɪz ɪn ˈsʌmə/",zh:"因为我的生日在夏天！",point:"because 引导原因状语从句。"},{en:"I'm Li Han. This is my apple tree.",ipa:"/aɪm liː hæn ðɪs ɪz maɪ ˈæpl triː/",zh:"我是李涵。这是我的苹果树。",point:"This is... 介绍事物。"},{en:"I'm ten now. The tree is ten, too.",ipa:"/aɪm ten naʊ ðə triː ɪz ten tuː/",zh:"我现在十岁了。这棵树也十岁了。",point:"too 表示也。"},{en:"Spring is here! The birds are back.",ipa:"/sprɪŋ ɪz hɪə ðə bɜːdz ɑː bæk/",zh:"春天来了！鸟儿回来了。",point:"be back = 回来。"},{en:"It's summer. The apple tree is like a sun umbrella.",ipa:"/ɪts ˈsʌmə ði ˈæpl triː ɪz laɪk ə sʌn ʌmˈbrelə/",zh:"夏天到了。苹果树像一把太阳伞。",point:"be like = 像……一样。"},{en:"I like reading under it.",ipa:"/aɪ laɪk ˈriːdɪŋ ˈʌndə ɪt/",zh:"我喜欢在树下读书。",point:"like doing sth. 喜欢做某事。"},{en:"It's autumn. I like autumn best!",ipa:"/ɪts ˈɔːtəm aɪ laɪk ˈɔːtəm best/",zh:"秋天到了。我最喜欢秋天！",point:"like...best = 最喜欢。"},{en:"There are many red apples on the tree!",ipa:"/ðeə ɑː ˈmeni red ˈæplz ɒn ðə triː/",zh:"树上有很多红苹果！",point:"There are + 复数名词。"},{en:"Can I share the apples with my friends?",ipa:"/kæn aɪ ʃeə ði ˈæplz wɪð maɪ frendz/",zh:"我能和朋友们分享苹果吗？",point:"share...with... = 和……分享……。"},{en:"It's winter. My apple tree has warm, new clothes!",ipa:"/ɪts ˈwɪntə maɪ ˈæpl triː hæz wɔːm njuː kləʊðz/",zh:"冬天到了。我的苹果树穿上了温暖的新衣服！",point:"has = 有。"},{en:"A snowstorm comes. Oh, no! My apple tree!",ipa:"/ə ˈsnəʊstɔːm kʌmz əʊ nəʊ maɪ ˈæpl triː/",zh:"暴风雪来了。哦，不！我的苹果树！",point:"snowstorm = 暴风雪。"},{en:"I don't like winter!",ipa:"/aɪ dəʊnt laɪk ˈwɪntə/",zh:"我不喜欢冬天！",point:"don't like = 不喜欢。"},{en:"Don't worry. Let's wait for spring.",ipa:"/dəʊnt ˈwʌri lets weɪt fɔː sprɪŋ/",zh:"别担心。我们等春天吧。",point:"wait for = 等待。"},{en:"It's spring again. My apple tree grows again.",ipa:"/ɪts sprɪŋ əˈɡen maɪ ˈæpl triː ɡrəʊz əˈɡen/",zh:"又是春天了。我的苹果树又长出来了。",point:"again = 再次。"},{en:"Hooray!",ipa:"/huˈreɪ/",zh:"好耶！",point:"表示欢呼。"},{en:"Up here it's summer. Go to the beach. Jump in the sea!",ipa:"/ʌp hɪə ɪts ˈsʌmə ɡəʊ tu ðə biːtʃ dʒʌmp ɪn ðə siː/",zh:"在这里是夏天。去海滩。跳进海里！",point:"Jump in the sea = 跳进海里。"},{en:"On the equator, there is no winter.",ipa:"/ɒn ði ɪˈkweɪtə ðeər ɪz nəʊ ˈwɪntə/",zh:"在赤道上，没有冬天。",point:"no winter = 没有冬天。"},{en:"It's a hot, hot summer, all year round.",ipa:"/ɪts ə hɒt hɒt ˈsʌmə ɔːl jɪə raʊnd/",zh:"全年都是炎热的夏天。",point:"all year round = 全年。"},{en:"Down here it's winter. The weather's quite cold.",ipa:"/daʊn hɪə ɪts ˈwɪntə ðə ˈweðəz kwaɪt kəʊld/",zh:"在这里是冬天。天气非常冷。",point:"quite = 非常。"},{en:"Join us and play!",ipa:"/dʒɔɪn ʌs ænd pleɪ/",zh:"加入我们一起玩！",point:"join = 加入。"},{en:"It's winter in Harbin now. What season is it in Sydney?",ipa:"/ɪts ˈwɪntə ɪn ˈhɑːbɪn naʊ wɒt ˈsiːzn ɪz ɪt ɪn ˈsɪdni/",zh:"哈尔滨现在是冬天。悉尼是什么季节？",point:"What season is it in...? 询问某地是什么季节。"},{en:"It's summer. How about in Singapore?",ipa:"/ɪts ˈsʌmə haʊ əˈbaʊt ɪn ˈsɪŋəpɔː/",zh:"是夏天。新加坡呢？",point:"How about...? 询问……怎么样？"},{en:"My favourite season is summer.",ipa:"/maɪ ˈfeɪvərɪt ˈsiːzn ɪz ˈsʌmə/",zh:"我最喜欢的季节是夏天。",point:"My favourite season is... 我最喜欢的季节是……。"},{en:"In summer, it's hot. I can swim in the sea with my parents.",ipa:"/ɪn ˈsʌmə ɪts hɒt aɪ kæn swɪm ɪn ðə siː wɪð maɪ ˈpeərənts/",zh:"夏天很热。我可以和父母在海里游泳。",point:"with my parents = 和我的父母一起。"},{en:"I like ice cream in summer. I like green.",ipa:"/aɪ laɪk aɪs kriːm ɪn ˈsʌmə aɪ laɪk ɡriːn/",zh:"夏天我喜欢冰激凌。我喜欢绿色。",point:"like + 名词。"}]},
{name:"Unit 5 Let's go!",words:[{en:"bus",ipa:"/bʌs/",zh:"公交车"},{en:"car",ipa:"/kɑː/",zh:"汽车"},{en:"train",ipa:"/treɪn/",zh:"火车"},{en:"ship",ipa:"/ʃɪp/",zh:"大船"},{en:"plane",ipa:"/pleɪn/",zh:"飞机"},{en:"bike",ipa:"/baɪk/",zh:"自行车"},{en:"subway",ipa:"/ˈsʌbweɪ/",zh:"地铁"},{en:"tram",ipa:"/træm/",zh:"有轨电车"},{en:"city",ipa:"/ˈsɪti/",zh:"城市"},{en:"town",ipa:"/taʊn/",zh:"镇"},{en:"place",ipa:"/pleɪs/",zh:"地方"},{en:"near",ipa:"/nɪə/",zh:"近的"},{en:"travel",ipa:"/ˈtrævl/",zh:"旅行"},{en:"way",ipa:"/weɪ/",zh:"方式"},{en:"sky",ipa:"/skaɪ/",zh:"天空"},{en:"picnic",ipa:"/ˈpɪknɪk/",zh:"野餐"},{en:"minute",ipa:"/ˈmɪnɪt/",zh:"分钟"},{en:"wear",ipa:"/weə/",zh:"穿"},{en:"live",ipa:"/lɪv/",zh:"住"},{en:"away",ipa:"/əˈweɪ/",zh:"离开"},{en:"truck",ipa:"/trʌk/",zh:"货车"},{en:"bamboo",ipa:"/ˌbæmˈbuː/",zh:"竹子"},{en:"ring",ipa:"/rɪŋ/",zh:"鸣响"},{en:"beep",ipa:"/biːp/",zh:"鸣响"},{en:"whoosh",ipa:"/wuːʃ/",zh:"飞快移动"},{en:"chug",ipa:"/tʃʌɡ/",zh:"突突地前进"},{en:"helmet",ipa:"/ˈhelmɪt/",zh:"头盔"},{en:"seat belt",ipa:"/siːt belt/",zh:"安全带"},{en:"safety",ipa:"/ˈseɪfti/",zh:"安全"}],phrases:[{en:"by bus",ipa:"/baɪ bʌs/",zh:"乘公共汽车"},{en:"by car",ipa:"/baɪ kɑː/",zh:"乘小汽车"},{en:"by train",ipa:"/baɪ treɪn/",zh:"乘火车"},{en:"by ship",ipa:"/baɪ ʃɪp/",zh:"乘船"},{en:"by plane",ipa:"/baɪ pleɪn/",zh:"乘飞机"},{en:"by bike",ipa:"/baɪ baɪk/",zh:"骑自行车"},{en:"by subway",ipa:"/baɪ ˈsʌbweɪ/",zh:"乘地铁"},{en:"on foot",ipa:"/ɒn fʊt/",zh:"步行"},{en:"go for a picnic",ipa:"/ɡəʊ fɔːr ə ˈpɪknɪk/",zh:"去野餐"},{en:"get there",ipa:"/ɡet ðeə/",zh:"到达那里"},{en:"in a green way",ipa:"/ɪn ə ɡriːn weɪ/",zh:"以绿色的方式"},{en:"wear a helmet",ipa:"/weə ə ˈhelmɪt/",zh:"戴头盔"},{en:"wear a seat belt",ipa:"/weə ə siːt belt/",zh:"系安全带"}],sentences:[{en:"We can go by bus, going up and down.",ipa:"/wiː kæn ɡəʊ baɪ bʌs ˈɡəʊɪŋ ʌp ænd daʊn/",zh:"我们可以乘公共汽车，上下行驶。",point:"by bus = 乘公共汽车。"},{en:"We can go by car, to get around.",ipa:"/wiː kæn ɡəʊ baɪ kɑː tu ɡet əˈraʊnd/",zh:"我们可以乘小汽车，到处走走。",point:"get around = 到处走动。"},{en:"We can go by train, from city to town.",ipa:"/wiː kæn ɡəʊ baɪ treɪn frɒm ˈsɪti tu taʊn/",zh:"我们可以乘火车，从城市到城镇。",point:"from...to... = 从……到……。"},{en:"We can go by ship, across the sea.",ipa:"/wiː kæn ɡəʊ baɪ ʃɪp əˈkrɒs ðə siː/",zh:"我们可以乘船，横渡大海。",point:"across the sea = 横渡大海。"},{en:"We can go by plane, high up in the sky.",ipa:"/wiː kæn ɡəʊ baɪ pleɪn haɪ ʌp ɪn ðə skaɪ/",zh:"我们可以乘飞机，高高地在天空中。",point:"high up in the sky = 在高高的天空中。"},{en:"We can go to different places, near and far.",ipa:"/wiː kæn ɡəʊ tu ˈdɪfrənt ˈpleɪsɪz nɪə ænd fɑː/",zh:"我们可以去不同的地方，近的和远的。",point:"near and far = 近的和远的。"},{en:"Let's go for a picnic in the park.",ipa:"/lets ɡəʊ fɔːr ə ˈpɪknɪk ɪn ðə pɑːk/",zh:"我们去公园野餐吧。",point:"Let's + 动词原形，提出建议。"},{en:"How do we get there?",ipa:"/haʊ duː wiː ɡet ðeə/",zh:"我们怎么到达那里？",point:"How do we get there? 询问出行方式。"},{en:"Let's go by car! It's fast!",ipa:"/lets ɡəʊ baɪ kɑː ɪts fɑːst/",zh:"我们开车去吧！很快！",point:"by car = 乘小汽车。"},{en:"No, let's go in a 'green' way!",ipa:"/nəʊ lets ɡəʊ ɪn ə ɡriːn weɪ/",zh:"不，我们以“绿色”方式出行吧！",point:"in a green way = 以绿色方式。"},{en:"Yes. Go and get ready. Let's meet in five minutes.",ipa:"/jes ɡəʊ ænd ɡet ˈredi lets miːt ɪn faɪv ˈmɪnɪts/",zh:"是的。去准备吧。我们五分钟后见。",point:"in five minutes = 五分钟后。"},{en:"We're green now! Let's go!",ipa:"/wɪə ɡriːn naʊ lets ɡəʊ/",zh:"我们现在是绿色的了！走吧！",point:"We're = We are。"},{en:"Ha ha! Not that kind of green!",ipa:"/hɑː hɑː nɒt ðæt kaɪnd əv ɡriːn/",zh:"哈哈！不是那种绿色！",point:"kind of = 种类。"},{en:"This kind of green!",ipa:"/ðɪs kaɪnd əv ɡriːn/",zh:"是这种绿色！",point:"This kind of = 这种。"},{en:"Daming's family want to have a picnic.",ipa:"/ˈdɑːmɪŋz ˈfæməli wɒnt tu hæv ə ˈpɪknɪk/",zh:"大明一家想去野餐。",point:"want to + 动词原形。"},{en:"Daming wants to go by bus.",ipa:"/ˈdɑːmɪŋ wɒnts tu ɡəʊ baɪ bʌs/",zh:"大明想乘公共汽车去。",point:"wants 是第三人称单数形式。"},{en:"Daming's family wear green clothes to go in a 'green' way.",ipa:"/ˈdɑːmɪŋz ˈfæməli weə ɡriːn kləʊðz tu ɡəʊ ɪn ə ɡriːn weɪ/",zh:"大明一家穿绿色衣服以“绿色”方式出行。",point:"wear green clothes = 穿绿色衣服。"},{en:"Let's go to the park!",ipa:"/lets ɡəʊ tu ðə pɑːk/",zh:"我们去公园吧！",point:"Let's + 动词原形。"},{en:"OK. How do we get there?",ipa:"/əʊˈkeɪ haʊ duː wiː ɡet ðeə/",zh:"好的。我们怎么到达那里？",point:"How do we get there? 询问出行方式。"},{en:"Let's go by bus.",ipa:"/lets ɡəʊ baɪ bʌs/",zh:"我们乘公共汽车去吧。",point:"by bus = 乘公共汽车。"},{en:"Hello. I'm Jingjing. This is my friend Sihai.",ipa:"/həˈləʊ aɪm ˈdʒɪŋdʒɪŋ ðɪs ɪz maɪ frend sɪˈhaɪ/",zh:"你好。我是京京。这是我的朋友四海。",point:"This is... 介绍他人。"},{en:"We live in Sichuan.",ipa:"/wiː lɪv ɪn ˈsɪtʃwɑːn/",zh:"我们住在四川。",point:"live in + 地点。"},{en:"Look! The truck is here.",ipa:"/lʊk ðə trʌk ɪz hɪə/",zh:"看！卡车来了。",point:"The truck is here = 卡车在这里。"},{en:"Let's go! Goodbye, everyone!",ipa:"/lets ɡəʊ ˌɡʊdˈbaɪ ˈevriwʌn/",zh:"走吧！大家再见！",point:"Goodbye = 再见。"},{en:"It's time to go to Qatar! But how do we get there? It's far away.",ipa:"/ɪts taɪm tu ɡəʊ tu ˈkætɑː bʌt haʊ duː wiː ɡet ðeə ɪts fɑːr əˈweɪ/",zh:"该去卡塔尔了！但我们怎么到那里？很远。",point:"far away = 很远。"},{en:"Now we are on a plane in the sky. Goodbye, China!",ipa:"/naʊ wiː ɑːr ɒn ə pleɪn ɪn ðə skaɪ ˌɡʊdˈbaɪ ˈtʃaɪnə/",zh:"现在我们在天空中的飞机上。再见，中国！",point:"on a plane = 在飞机上。"},{en:"What a long way! Here we are! Hello, Qatar!",ipa:"/wɒt ə lɒŋ weɪ hɪə wiː ɑː həˈləʊ ˈkætɑː/",zh:"好远的路！我们到了！你好，卡塔尔！",point:"What a long way! = 好远的路！"},{en:"We go to our new home by truck.",ipa:"/wiː ɡəʊ tu ˈaʊə njuː həʊm baɪ trʌk/",zh:"我们乘卡车去我们的新家。",point:"by truck = 乘卡车。"},{en:"It's our new home. It's big. We've got a lot of bamboo here.",ipa:"/ɪts ˈaʊə njuː həʊm ɪts bɪɡ wiːv ɡɒt ə lɒt əv ˌbæmˈbuː hɪə/",zh:"这是我们的新家。它很大。我们这里有很多竹子。",point:"We've got = We have got，表示我们有。"},{en:"It comes from China by plane!",ipa:"/ɪt kʌmz frɒm ˈtʃaɪnə baɪ pleɪn/",zh:"它乘飞机从中国来！",point:"come from = 来自。"},{en:"Many people come to see us. We've got a lot of new friends!",ipa:"/ˈmeni ˈpiːpl kʌm tu siː ʌs wiːv ɡɒt ə lɒt əv njuː frendz/",zh:"很多人来看我们。我们有很多新朋友！",point:"come to see us = 来看我们。"},{en:"We are happy!",ipa:"/wiː ɑː ˈhæpi/",zh:"我们很开心！",point:"happy = 开心的。"},{en:"Jingjing and Sihai travel a long way.",ipa:"/ˈdʒɪŋdʒɪŋ ænd sɪˈhaɪ ˈtrævl ə lɒŋ weɪ/",zh:"京京和四海旅行了很远。",point:"travel a long way = 旅行很远。"},{en:"They first go by truck.",ipa:"/ðeɪ fɜːst ɡəʊ baɪ trʌk/",zh:"他们先乘卡车去。",point:"first = 首先。"},{en:"Then they go by plane to Qatar.",ipa:"/ðen ðeɪ ɡəʊ baɪ pleɪn tu ˈkætɑː/",zh:"然后他们乘飞机去卡塔尔。",point:"then = 然后。"},{en:"They've got a lot of bamboo. It comes from China by plane!",ipa:"/ðeɪv ɡɒt ə lɒt əv ˌbæmˈbuː ɪt kʌmz frɒm ˈtʃaɪnə baɪ pleɪn/",zh:"他们有很多竹子。它乘飞机从中国来！",point:"a lot of = 许多。"},{en:"They've got a lot of new friends in Qatar. They are happy!",ipa:"/ðeɪv ɡɒt ə lɒt əv njuː frendz ɪn ˈkætɑː ðeɪ ɑː ˈhæpi/",zh:"他们在卡塔尔有很多新朋友。他们很开心！",point:"in Qatar = 在卡塔尔。"},{en:"Children, children, time for school! How do you go?",ipa:"/ˈtʃɪldrən ˈtʃɪldrən taɪm fɔː skuːl haʊ duː juː ɡəʊ/",zh:"孩子们，孩子们，该上学了！你们怎么去？",point:"time for school = 该上学了。"},{en:"I go by bike. Ring, ring, ring.",ipa:"/aɪ ɡəʊ baɪ baɪk rɪŋ rɪŋ rɪŋ/",zh:"我骑自行车去。铃，铃，铃。",point:"by bike = 骑自行车。"},{en:"She goes by bus. Beep, beep, beep.",ipa:"/ʃiː ɡəʊz baɪ bʌs biːp biːp biːp/",zh:"她乘公共汽车去。嘀，嘀，嘀。",point:"by bus = 乘公共汽车。"},{en:"He goes by subway. Whoosh, whoosh, whoosh.",ipa:"/hiː ɡəʊz baɪ ˈsʌbweɪ wuːʃ wuːʃ wuːʃ/",zh:"他乘地铁去。嗖，嗖，嗖。",point:"by subway = 乘地铁。"},{en:"They go by tram. Chug, chug, chug.",ipa:"/ðeɪ ɡəʊ baɪ træm tʃʌɡ tʃʌɡ tʃʌɡ/",zh:"他们乘有轨电车去。突突突。",point:"by tram = 乘有轨电车。"},{en:"How do you go to school, Luoluo?",ipa:"/haʊ duː juː ɡəʊ tu skuːl ˈlwɒlwɒ/",zh:"落落，你怎么去学校？",point:"How do you go to school? 询问出行方式。"},{en:"I go by car.",ipa:"/aɪ ɡəʊ baɪ kɑː/",zh:"我乘小汽车去。",point:"by car = 乘小汽车。"},{en:"Luoluo goes to school by car. How do you go to school?",ipa:"/ˈlwɒlwɒ ɡəʊz tu skuːl baɪ kɑː haʊ duː juː ɡəʊ tu skuːl/",zh:"落落乘小汽车去学校。你怎么去学校？",point:"第三人称单数 goes。"},{en:"My family travel in four ways.",ipa:"/maɪ ˈfæməli ˈtrævl ɪn fɔː weɪz/",zh:"我的家庭以四种方式出行。",point:"in four ways = 以四种方式。"},{en:"My dad and mum go to work by car.",ipa:"/maɪ dæd ænd mʌm ɡəʊ tu wɜːk baɪ kɑː/",zh:"我爸爸妈妈乘小汽车去上班。",point:"go to work = 去上班。"},{en:"My sister goes to school in a 'green' way. She walks there.",ipa:"/maɪ ˈsɪstə ɡəʊz tu skuːl ɪn ə ɡriːn weɪ ʃiː wɔːks ðeə/",zh:"我妹妹以“绿色”方式去学校。她走路去那里。",point:"walk there = 走路去那里。"}]},
{name:"Unit 6 Find your way",words:[{en:"left",ipa:"/left/",zh:"向左"},{en:"right",ipa:"/raɪt/",zh:"向右"},{en:"straight",ipa:"/streɪt/",zh:"笔直地"},{en:"library",ipa:"/ˈlaɪbrəri/",zh:"图书馆"},{en:"centre",ipa:"/ˈsentə/",zh:"中心"},{en:"cinema",ipa:"/ˈsɪnəmə/",zh:"电影院"},{en:"hospital",ipa:"/ˈhɒspɪtl/",zh:"医院"},{en:"supermarket",ipa:"/ˈsuːpəmɑːkɪt/",zh:"超市"},{en:"museum",ipa:"/mjuˈziːəm/",zh:"博物馆"},{en:"tomorrow",ipa:"/təˈmɒrəʊ/",zh:"明天"},{en:"woman",ipa:"/ˈwʊmən/",zh:"妇女"},{en:"wish",ipa:"/wɪʃ/",zh:"愿望"},{en:"step",ipa:"/step/",zh:"步"},{en:"own",ipa:"/əʊn/",zh:"自己的"},{en:"on one's own",ipa:"/ɒn wʌnz əʊn/",zh:"独立地"},{en:"cross",ipa:"/krɒs/",zh:"横穿"},{en:"careful",ipa:"/ˈkeəfl/",zh:"谨慎的"},{en:"be careful",ipa:"/biː ˈkeəfl/",zh:"当心"},{en:"underground",ipa:"/ˈʌndəɡraʊnd/",zh:"在地面下"},{en:"wheel",ipa:"/wiːl/",zh:"车轮"},{en:"excuse",ipa:"/ɪkˈskjuːz/",zh:"原谅"},{en:"excuse me",ipa:"/ɪkˈskjuːz miː/",zh:"劳驾"}],phrases:[{en:"go straight on",ipa:"/ɡəʊ streɪt ɒn/",zh:"直走"},{en:"turn left",ipa:"/tɜːn left/",zh:"向左转"},{en:"turn right",ipa:"/tɜːn raɪt/",zh:"向右转"},{en:"next to",ipa:"/nekst tu/",zh:"在……旁边"},{en:"cross the road",ipa:"/krɒs ðə rəʊd/",zh:"过马路"},{en:"be careful",ipa:"/biː ˈkeəfl/",zh:"当心"},{en:"on one's own",ipa:"/ɒn wʌnz əʊn/",zh:"独立地"},{en:"sports centre",ipa:"/spɔːts ˈsentə/",zh:"体育中心"},{en:"city centre",ipa:"/ˈsɪti ˈsentə/",zh:"城市中心"},{en:"excuse me",ipa:"/ɪkˈskjuːz miː/",zh:"劳驾"},{en:"at the crossing",ipa:"/æt ðə ˈkrɒsɪŋ/",zh:"在十字路口"},{en:"far from here",ipa:"/fɑː frɒm hɪə/",zh:"离这儿远"},{en:"by underground",ipa:"/baɪ ˈʌndəɡraʊnd/",zh:"乘地铁"},{en:"on foot",ipa:"/ɒn fʊt/",zh:"步行"}],sentences:[{en:"The wheels on the bus go round and round.",ipa:"/ðə wiːlz ɒn ðə bʌs ɡəʊ raʊnd ænd raʊnd/",zh:"公共汽车的轮子转呀转。",point:"go round and round = 转呀转。"},{en:"Turn left and go straight on. Ding! Ding! Ding!",ipa:"/tɜːn left ænd ɡəʊ streɪt ɒn dɪŋ dɪŋ dɪŋ/",zh:"左转，直走。叮！叮！叮！",point:"turn left = 左转。go straight on = 直走。"},{en:"Here's the library.",ipa:"/hɪəz ðə ˈlaɪbrəri/",zh:"图书馆到了。",point:"Here's = Here is。"},{en:"Turn right and go straight on. Ding! Ding! Ding!",ipa:"/tɜːn raɪt ænd ɡəʊ streɪt ɒn dɪŋ dɪŋ dɪŋ/",zh:"右转，直走。叮！叮！叮！",point:"turn right = 右转。"},{en:"Here's the sports centre.",ipa:"/hɪəz ðə spɔːts ˈsentə/",zh:"体育中心到了。",point:"Here's = Here is。"},{en:"My cat Susu goes out every morning!",ipa:"/maɪ kæt ˈsuːsuː ɡəʊz aʊt ˈevri ˈmɔːnɪŋ/",zh:"我的猫苏苏每天早上都出去！",point:"every morning = 每天早上。"},{en:"Where does she go?",ipa:"/weə dʌz ʃiː ɡəʊ/",zh:"她去哪里？",point:"Where does + 主语 + 动词原形? 询问去哪里。"},{en:"I don't know!",ipa:"/aɪ dəʊnt nəʊ/",zh:"我不知道！",point:"I don't know = 我不知道。"},{en:"Let's find out tomorrow.",ipa:"/lets faɪnd aʊt təˈmɒrəʊ/",zh:"我们明天查清楚吧。",point:"find out = 查清楚。"},{en:"Susu goes straight on to the museum. She turns left there.",ipa:"/ˈsuːsuː ɡəʊz streɪt ɒn tu ðə mjuˈziːəm ʃiː tɜːnz left ðeə/",zh:"苏苏直走去博物馆。她在那里左转。",point:"go straight on = 直走。turn left = 左转。"},{en:"At the hospital, she turns right.",ipa:"/æt ðə ˈhɒspɪtl ʃiː tɜːnz raɪt/",zh:"在医院，她右转。",point:"turn right = 右转。"},{en:"Then Susu stops. Let's go there!",ipa:"/ðen ˈsuːsuː stɒps lets ɡəʊ ðeə/",zh:"然后苏苏停下来。我们去那里！",point:"stop = 停下。"},{en:"Go straight on to the museum. Then turn left. Turn right at the hospital.",ipa:"/ɡəʊ streɪt ɒn tu ðə mjuˈziːəm ðen tɜːn left tɜːn raɪt æt ðə ˈhɒspɪtl/",zh:"直走去博物馆。然后左转。在医院右转。",point:"描述路线的顺序。"},{en:"Susu, here you are!",ipa:"/ˈsuːsuː hɪə juː ɑː/",zh:"苏苏，你在这里！",point:"Here you are = 你在这里。"},{en:"Your cat visits me every day. She's my good friend!",ipa:"/jɔː kæt ˈvɪzɪts miː ˈevri deɪ ʃiːz maɪ ɡʊd frend/",zh:"你的猫每天来看我。她是我的好朋友！",point:"visit = 拜访。"},{en:"Can you tell me the way to the sports centre from the hospital, please?",ipa:"/kæn juː tel miː ðə weɪ tu ðə spɔːts ˈsentə frɒm ðə ˈhɒspɪtl pliːz/",zh:"请问你能告诉我去体育中心的路吗？",point:"Can you tell me the way to...? 询问路线。"},{en:"Sure. Go straight and turn right.",ipa:"/ʃʊə ɡəʊ streɪt ænd tɜːn raɪt/",zh:"当然。直走然后右转。",point:"Sure = 当然。"},{en:"Yanyan can't see. She goes to school with her mum's help every day.",ipa:"/ˈjænjæn kɑːnt siː ʃiː ɡəʊz tu skuːl wɪð hɜː mʌmz help ˈevri deɪ/",zh:"燕燕看不见。她每天在妈妈的帮助下上学。",point:"with one's help = 在某人的帮助下。"},{en:"Mum, let me go to school on my own today.",ipa:"/mʌm let miː ɡəʊ tu skuːl ɒn maɪ əʊn təˈdeɪ/",zh:"妈妈，让我今天自己去上学。",point:"on my own = 独自。"},{en:"Are you sure?",ipa:"/ɑː juː ʃʊə/",zh:"你确定吗？",point:"Are you sure? = 你确定吗？"},{en:"Yes. I can do it.",ipa:"/jes aɪ kæn duː ɪt/",zh:"是的。我能做到。",point:"I can do it = 我能做到。"},{en:"Mum, I'm 11 now. I want to go to school on my own!",ipa:"/mʌm aɪm ɪˈlevn naʊ aɪ wɒnt tu ɡəʊ tu skuːl ɒn maɪ əʊn/",zh:"妈妈，我现在11岁了。我想自己去上学！",point:"want to + 动词原形。"},{en:"Great! Cross the road. Turn left. The school is on your right.",ipa:"/ɡreɪt krɒs ðə rəʊd tɜːn left ðə skuːl ɪz ɒn jɔː raɪt/",zh:"太棒了！过马路。左转。学校在你的右边。",point:"cross the road = 过马路。on your right = 在你的右边。"},{en:"One, two, three...",ipa:"/wʌn tuː θriː/",zh:"一、二、三……",point:"数数。"},{en:"Be careful, my girl!",ipa:"/biː ˈkeəfl maɪ ɡɜːl/",zh:"小心，我的孩子！",point:"be careful = 小心。"},{en:"Go straight on... 48, 49, 50! OK. Cross the road and turn left.",ipa:"/ɡəʊ streɪt ɒn fɔːti eɪt fɔːti naɪn fɪfti əʊˈkeɪ krɒs ðə rəʊd ænd tɜːn left/",zh:"直走……48、49、50！好的。过马路然后左转。",point:"描述路线的顺序。"},{en:"I'm at school now, Mum!",ipa:"/aɪm æt skuːl naʊ mʌm/",zh:"我现在在学校了，妈妈！",point:"at school = 在学校。"},{en:"Well done, Yanyan!",ipa:"/wel dʌn ˈjænjæn/",zh:"做得好，燕燕！",point:"well done = 做得好。"},{en:"Yanyan goes to school on her own.",ipa:"/ˈjænjæn ɡəʊz tu skuːl ɒn hɜː əʊn/",zh:"燕燕自己去上学。",point:"on her own = 独自。"},{en:"First, she goes straight on. She walks 50 steps.",ipa:"/fɜːst ʃiː ɡəʊz streɪt ɒn ʃiː wɔːks ˈfɪfti steps/",zh:"首先，她直走。她走50步。",point:"first = 首先。walk 50 steps = 走50步。"},{en:"Then she crosses the road and turns left. The school is on her right.",ipa:"/ðen ʃiː ˈkrɒsɪz ðə rəʊd ænd tɜːnz left ðə skuːl ɪz ɒn hɜː raɪt/",zh:"然后她过马路并左转。学校在她的右边。",point:"then = 然后。cross the road = 过马路。"},{en:"How do you go to school from your home?",ipa:"/haʊ duː juː ɡəʊ tu skuːl frɒm jɔː həʊm/",zh:"你从家怎么去学校？",point:"How do you go to school? 询问出行方式。"},{en:"This is London, with so many things to see.",ipa:"/ðɪs ɪz ˈlʌndən wɪð səʊ ˈmeni θɪŋz tu siː/",zh:"这是伦敦，有那么多东西可看。",point:"with = 有。"},{en:"But how do we get around the city?",ipa:"/bʌt haʊ duː wiː ɡet əˈraʊnd ðə ˈsɪti/",zh:"但我们怎么在城市里到处走呢？",point:"get around = 到处走。"},{en:"Don't worry. It's easy!",ipa:"/dəʊnt ˈwʌri ɪts ˈiːzi/",zh:"别担心。很容易！",point:"Don't worry = 别担心。"},{en:"Walk to places near to here, and buses run from here to there.",ipa:"/wɔːk tu ˈpleɪsɪz nɪə tu hɪə ænd ˈbʌsɪz rʌn frɒm hɪə tu ðeə/",zh:"步行去附近的地方，公共汽车从这里到那里。",point:"near to here = 离这里近。"},{en:"There is a train. It goes underground.",ipa:"/ðeər ɪz ə treɪn ɪt ɡəʊz ˈʌndəɡraʊnd/",zh:"有一列火车。它在地下行驶。",point:"go underground = 在地下行驶。"},{en:"One, two, three. Let's go around.",ipa:"/wʌn tuː θriː lets ɡəʊ əˈraʊnd/",zh:"一、二、三。我们到处走走吧。",point:"Let's go around = 我们到处走走。"},{en:"How can Aunt Jane go to the places?",ipa:"/haʊ kæn ɑːnt dʒeɪn ɡəʊ tu ðə ˈpleɪsɪz/",zh:"简阿姨怎么去这些地方？",point:"How can...go to...? 询问怎么去。"},{en:"From Gary's home, she can walk to the...",ipa:"/frɒm ˈɡæriz həʊm ʃiː kæn wɔːk tu ðə/",zh:"从加里家，她可以步行去……",point:"walk to = 步行去。"},{en:"From my home, go straight on and turn left. Then you can find a sports centre...",ipa:"/frɒm maɪ həʊm ɡəʊ streɪt ɒn ænd tɜːn left ðen juː kæn faɪnd ə spɔːts ˈsentə/",zh:"从我家，直走然后左转。然后你能找到一个体育中心……",point:"描述路线。"},{en:"I want a big park. I can play in the park.",ipa:"/aɪ wɒnt ə bɪɡ pɑːk aɪ kæn pleɪ ɪn ðə pɑːk/",zh:"我想要一个大公园。我可以在公园里玩。",point:"I want + 名词，表示我想要……。"},{en:"I want to have a toy shop in my dream town.",ipa:"/aɪ wɒnt tu hæv ə tɔɪ ʃɒp ɪn maɪ driːm taʊn/",zh:"我想在我的梦想城镇里有一个玩具店。",point:"want to have = 想要有。"},{en:"Children can get interesting toys there.",ipa:"/ˈtʃɪldrən kæn ɡet ˈɪntrəstɪŋ tɔɪz ðeə/",zh:"孩子们可以在那里买到有趣的玩具。",point:"get = 买到。"},{en:"This is my dream town. It has got many interesting places.",ipa:"/ðɪs ɪz maɪ driːm taʊn ɪt hæz ɡɒt ˈmeni ˈɪntrəstɪŋ ˈpleɪsɪz/",zh:"这是我的梦想城镇。它有很多有趣的地方。",point:"has got = 有。"},{en:"Start from the park. Go straight on, and we can see a museum...",ipa:"/stɑːt frɒm ðə pɑːk ɡəʊ streɪt ɒn ænd wiː kæn siː ə mjuˈziːəm/",zh:"从公园开始。直走，我们可以看到博物馆……",point:"start from = 从……开始。"},{en:"This is a book. It's the library.",ipa:"/ðɪs ɪz ə bʊk ɪts ðə ˈlaɪbrəri/",zh:"这是一本书。它是图书馆。",point:"This is... 介绍事物。"},{en:"Guess! You can buy food here, but you can't eat here.",ipa:"/ɡes juː kæn baɪ fuːd hɪə bʌt juː kɑːnt iːt hɪə/",zh:"猜！你可以在这里买食物，但不能在这里吃。",point:"can't = 不能。"},{en:"Say it.",ipa:"/seɪ ɪt/",zh:"说出来。",point:"祈使句。"},{en:"Now I can name places.",ipa:"/naʊ aɪ kæn neɪm ˈpleɪsɪz/",zh:"现在我能说出地方名称。",point:"name places = 说出地方名称。"},{en:"Use 'Go straight on.' and 'Turn left / right.' to show the way to places.",ipa:"/juːz ɡəʊ streɪt ɒn ænd tɜːn left raɪt tu ʃəʊ ðə weɪ tu ˈpleɪsɪz/",zh:"用“直走”和“左转/右转”来指路。",point:"show the way = 指路。"},{en:"Talk about how to get to places.",ipa:"/tɔːk əˈbaʊt haʊ tu ɡet tu ˈpleɪsɪz/",zh:"谈论怎么去某个地方。",point:"how to get to = 怎么去。"},{en:"Symbols on a map help you to find important places.",ipa:"/ˈsɪmblz ɒn ə mæp help juː tu faɪnd ɪmˈpɔːtənt ˈpleɪsɪz/",zh:"地图上的符号帮助你找到重要的地方。",point:"help sb. to do sth. = 帮助某人做某事。"},{en:"Look at these symbols. Can you guess the places?",ipa:"/lʊk æt ðiːz ˈsɪmblz kæn juː ɡes ðə ˈpleɪsɪz/",zh:"看这些符号。你能猜出这些地方吗？",point:"look at = 看。"},{en:"Draw other map symbols and talk about them.",ipa:"/drɔː ˈʌðə mæp ˈsɪmblz ænd tɔːk əˈbaʊt ðəm/",zh:"画其他地图符号并谈论它们。",point:"draw = 画。"}]}
]},
/* ===== 四年级下册 ===== */
{name:"四年级下册",units:[
{name:"Unit 1 People at work",words:[{en:"doctor",ipa:"/ˈdɒktə/",zh:"医生"},{en:"fireman",ipa:"/ˈfaɪəmən/",zh:"消防员"},{en:"farmer",ipa:"/ˈfɑːmə/",zh:"农民"},{en:"cook",ipa:"/kʊk/",zh:"厨师"},{en:"police",ipa:"/pəˈliːs/",zh:"警察"},{en:"police officer",ipa:"/pəˈliːs ˈɒfɪsə/",zh:"警官"},{en:"station",ipa:"/ˈsteɪʃn/",zh:"局"},{en:"police station",ipa:"/pəˈliːs ˈsteɪʃn/",zh:"警察局"},{en:"often",ipa:"/ˈɒfn/",zh:"经常"},{en:"field",ipa:"/fiːld/",zh:"田地"},{en:"painter",ipa:"/ˈpeɪntə/",zh:"画家"},{en:"use",ipa:"/juːz/",zh:"使用"},{en:"brush",ipa:"/brʌʃ/",zh:"刷子"},{en:"scientist",ipa:"/ˈsaɪəntɪst/",zh:"科学家"},{en:"writer",ipa:"/ˈraɪtə/",zh:"作家"},{en:"worker",ipa:"/ˈwɜːkə/",zh:"工人"},{en:"aunt",ipa:"/ɑːnt/",zh:"姑母"},{en:"night",ipa:"/naɪt/",zh:"夜晚"},{en:"owl",ipa:"/aʊl/",zh:"猫头鹰"},{en:"night owl",ipa:"/naɪt aʊl/",zh:"夜猫子"},{en:"driver",ipa:"/ˈdraɪvə/",zh:"司机"},{en:"taxi",ipa:"/ˈtæksi/",zh:"出租车"},{en:"safe",ipa:"/seɪf/",zh:"安全的"},{en:"nurse",ipa:"/nɜːs/",zh:"护士"},{en:"light",ipa:"/laɪt/",zh:"照亮"},{en:"uncle",ipa:"/ˈʌŋkl/",zh:"叔叔"},{en:"bake",ipa:"/beɪk/",zh:"烘烤"},{en:"bee",ipa:"/biː/",zh:"蜜蜂"},{en:"same",ipa:"/seɪm/",zh:"相同的"},{en:"sound",ipa:"/saʊnd/",zh:"声音"},{en:"postman",ipa:"/ˈpəʊstmən/",zh:"邮递员"},{en:"life",ipa:"/laɪf/",zh:"生活"},{en:"mountain",ipa:"/ˈmaʊntən/",zh:"高山"}],phrases:[{en:"police officer",ipa:"/pəˈliːs ˈɒfɪsə/",zh:"警官"},{en:"police station",ipa:"/pəˈliːs ˈsteɪʃn/",zh:"警察局"},{en:"night owl",ipa:"/naɪt aʊl/",zh:"夜猫子"},{en:"work at night",ipa:"/wɜːk æt naɪt/",zh:"在夜晚工作"},{en:"bus driver",ipa:"/bʌs ˈdraɪvə/",zh:"公共汽车司机"},{en:"taxi driver",ipa:"/ˈtæksi ˈdraɪvə/",zh:"出租车司机"},{en:"keep the city safe",ipa:"/kiːp ðə ˈsɪti seɪf/",zh:"保护城市安全"},{en:"work in the fields",ipa:"/wɜːk ɪn ðə fiːldz/",zh:"在田地里工作"},{en:"use a brush",ipa:"/juːz ə brʌʃ/",zh:"使用刷子"}],sentences:[{en:"I'm a teacher.",ipa:"/aɪm ə ˈtiːtʃə/",zh:"我是一名老师。",point:"介绍职业：I'm a + 职业。"},{en:"I'm a doctor.",ipa:"/aɪm ə ˈdɒktə/",zh:"我是一名医生。",point:"a 用在辅音音素前。"},{en:"I'm a fireman.",ipa:"/aɪm ə ˈfaɪəmən/",zh:"我是一名消防员。",point:"fireman 是复合词。"},{en:"We all love our jobs!",ipa:"/wiː ɔːl lʌv ˈaʊə dʒɒbz/",zh:"我们都热爱我们的工作！",point:"jobs 是 job 的复数。"},{en:"I'm a farmer.",ipa:"/aɪm ə ˈfɑːmə/",zh:"我是一名农民。",point:"农民 = farmer。"},{en:"I'm a cook.",ipa:"/aɪm ə kʊk/",zh:"我是一名厨师。",point:"cook 既是动词也是名词。"},{en:"I'm a police officer.",ipa:"/aɪm ə pəˈliːs ˈɒfɪsə/",zh:"我是一名警官。",point:"police officer = 警官。"},{en:"What does Lingling's father do?",ipa:"/wɒt dʌz ˌlɪŋˈlɪŋz ˈfɑːðə duː/",zh:"玲玲的爸爸是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"Is he a farmer?",ipa:"/ɪz hiː ə ˈfɑːmə/",zh:"他是农民吗？",point:"Is he a...? 询问职业。"},{en:"No, he isn't. But he often works in the fields.",ipa:"/nəʊ hiː ˈɪznt bʌt hiː ˈɒfn wɜːks ɪn ðə fiːldz/",zh:"不，他不是。但他经常在田地里工作。",point:"often = 经常。in the fields = 在田地里。"},{en:"Is he a painter?",ipa:"/ɪz hiː ə ˈpeɪntə/",zh:"他是画家吗？",point:"painter = 画家。"},{en:"No, he isn't. But he uses his brush a lot.",ipa:"/nəʊ hiː ˈɪznt bʌt hiː ˈjuːzɪz hɪz brʌʃ ə lɒt/",zh:"不，他不是。但他经常使用他的刷子。",point:"uses 是 use 的第三人称单数形式。"},{en:"Look at this!",ipa:"/lʊk æt ðɪs/",zh:"看这个！",point:"祈使句。"},{en:"I know! He's a scientist!",ipa:"/aɪ nəʊ hiːz ə ˈsaɪəntɪst/",zh:"我知道！他是一名科学家！",point:"scientist = 科学家。"},{en:"That's right!",ipa:"/ðæts raɪt/",zh:"没错！",point:"That's right = 没错。"},{en:"This is my father. He often works in the fields.",ipa:"/ðɪs ɪz maɪ ˈfɑːðə hiː ˈɒfn wɜːks ɪn ðə fiːldz/",zh:"这是我的爸爸。他经常在田地里工作。",point:"This is... 介绍人物。"},{en:"He uses his brush a lot.",ipa:"/hiː ˈjuːzɪz hɪz brʌʃ ə lɒt/",zh:"他经常使用他的刷子。",point:"a lot = 经常。"},{en:"But he is not a farmer or a painter.",ipa:"/bʌt hiː ɪz nɒt ə ˈfɑːmə ɔː ə ˈpeɪntə/",zh:"但他不是农民也不是画家。",point:"or = 或者。"},{en:"He's a scientist.",ipa:"/hiːz ə ˈsaɪəntɪst/",zh:"他是一名科学家。",point:"scientist = 科学家。"},{en:"What does your aunt do?",ipa:"/wɒt dʌz jɔː ɑːnt duː/",zh:"你的阿姨是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"She's a cook.",ipa:"/ʃiːz ə kʊk/",zh:"她是一名厨师。",point:"She's = She is。"},{en:"Oh, a night owl!",ipa:"/əʊ ə naɪt aʊl/",zh:"哦，一只猫头鹰！",point:"night owl = 猫头鹰。"},{en:"Yes, I come out at night. But many people are 'night owls', too.",ipa:"/jes aɪ kʌm aʊt æt naɪt bʌt ˈmeni ˈpiːpl ɑː naɪt aʊlz tuː/",zh:"是的，我晚上出来。但很多人也是“夜猫子”。",point:"come out = 出来。night owls 指夜猫子。"},{en:"Bus drivers and taxi drivers work at night. They take people home.",ipa:"/bʌs ˈdraɪvəz ænd ˈtæksi ˈdraɪvəz wɜːk æt naɪt ðeɪ teɪk ˈpiːpl həʊm/",zh:"公共汽车司机和出租车司机晚上工作。他们送人们回家。",point:"work at night = 晚上工作。take people home = 送人们回家。"},{en:"Police officers and firemen work at night, too. They keep the city safe.",ipa:"/pəˈliːs ˈɒfɪsəz ænd ˈfaɪəmən wɜːk æt naɪt tuː ðeɪ kiːp ðə ˈsɪti seɪf/",zh:"警察和消防员晚上也工作。他们保护城市安全。",point:"keep the city safe = 保护城市安全。"},{en:"Doctors and nurses are busy at night. They help people.",ipa:"/ˈdɒktəz ænd ˈnɜːsɪz ɑː ˈbɪzi æt naɪt ðeɪ help ˈpiːpl/",zh:"医生和护士晚上很忙。他们帮助人们。",point:"be busy = 忙碌。"},{en:"So many people work at night. They light up the night for others.",ipa:"/səʊ ˈmeni ˈpiːpl wɜːk æt naɪt ðeɪ laɪt ʌp ðə naɪt fɔː ˈʌðəz/",zh:"很多人在晚上工作。他们为他人照亮夜晚。",point:"light up = 照亮。"},{en:"I work at night, too. Time to go!",ipa:"/aɪ wɜːk æt naɪt tuː taɪm tu ɡəʊ/",zh:"我也在晚上工作。该走了！",point:"Time to go! = 该走了！"},{en:"What does Jake do?",ipa:"/wɒt dʌz dʒeɪk duː/",zh:"杰克是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"Uncle Jake likes to bake.",ipa:"/ˈʌŋkl dʒeɪk laɪks tu beɪk/",zh:"杰克叔叔喜欢烘焙。",point:"like to do sth. = 喜欢做某事。"},{en:"He can make the best cake.",ipa:"/hiː kæn meɪk ðə best keɪk/",zh:"他能做出最好的蛋糕。",point:"the best = 最好的。"},{en:"He works hard, day after day.",ipa:"/hiː wɜːks hɑːd deɪ ˈɑːftə deɪ/",zh:"他日复一日地努力工作。",point:"day after day = 日复一日。"},{en:"He is like a bee, very busy.",ipa:"/hiː ɪz laɪk ə biː ˈveri ˈbɪzi/",zh:"他像蜜蜂一样，非常忙碌。",point:"like a bee = 像蜜蜂一样。"},{en:"Aren't you tired, Uncle Jake?",ipa:"/ɑːnt juː ˈtaɪəd ˈʌŋkl dʒeɪk/",zh:"你不累吗，杰克叔叔？",point:"Aren't you...? 否定疑问句。"},{en:"No, I'm not, dear little May.",ipa:"/nəʊ aɪm nɒt dɪə ˈlɪtl meɪ/",zh:"不，我不累，亲爱的小梅。",point:"No, I'm not = 不，我不累。"},{en:"I love my job. It feels great.",ipa:"/aɪ lʌv maɪ dʒɒb ɪt fiːlz ɡreɪt/",zh:"我热爱我的工作。感觉很好。",point:"feel great = 感觉很好。"},{en:"I can make the world a sweet place.",ipa:"/aɪ kæn meɪk ðə wɜːld ə swiːt pleɪs/",zh:"我可以让世界变得更甜蜜。",point:"make + 名词 + 形容词 = 使……变得……。"},{en:"Zhang Guimei works at a high school.",ipa:"/dʒɑːŋ ɡweɪ meɪ wɜːks æt ə haɪ skuːl/",zh:"张桂梅在一所高中工作。",point:"work at = 在……工作。"},{en:"The school is for girls from poor families.",ipa:"/ðə skuːl ɪz fɔː ɡɜːlz frɒm pʊə ˈfæməliz/",zh:"这所学校是为贫困家庭的女孩办的。",point:"from poor families = 来自贫困家庭。"},{en:"She works very hard and changes their lives.",ipa:"/ʃiː wɜːks ˈveri hɑːd ænd ˈtʃeɪndʒɪz ðeə lɪvz/",zh:"她工作非常努力，改变了她们的生活。",point:"change one's life = 改变某人的生活。"},{en:"Ge Jun brings letters to people on mountains.",ipa:"/ɡɜː dʒuːn brɪŋz ˈletəz tu ˈpiːpl ɒn ˈmaʊntənz/",zh:"葛军把信带给山上的人们。",point:"bring sth. to sb. = 把某物带给某人。"},{en:"It's very cold. But he never stops.",ipa:"/ɪts ˈveri kəʊld bʌt hiː ˈnevə stɒps/",zh:"天气很冷。但他从不停止。",point:"never = 从不。"},{en:"Yang Qiming drives the last bus at night.",ipa:"/jɑːŋ tʃiː mɪŋ draɪvz ðə lɑːst bʌs æt naɪt/",zh:"杨启明晚上开末班车。",point:"drive = 驾驶。"},{en:"Many people take his bus. He takes them home every night.",ipa:"/ˈmeni ˈpiːpl teɪk hɪz bʌs hiː teɪks ðəm həʊm ˈevri naɪt/",zh:"很多人乘坐他的车。他每晚送他们回家。",point:"take them home = 送他们回家。"},{en:"I want to be a teacher and work at a school.",ipa:"/aɪ wɒnt tu biː ə ˈtiːtʃə ænd wɜːk æt ə skuːl/",zh:"我想成为一名老师并在学校工作。",point:"want to be = 想成为。"},{en:"I want to teach students Chinese.",ipa:"/aɪ wɒnt tu tiːtʃ ˈstjuːdnts ˌtʃaɪˈniːz/",zh:"我想教学生中文。",point:"teach sb. sth. = 教某人某物。"},{en:"I want to be a fireman and work in a fire station.",ipa:"/aɪ wɒnt tu biː ə ˈfaɪəmən ænd wɜːk ɪn ə ˈfaɪə ˈsteɪʃn/",zh:"我想成为一名消防员并在消防站工作。",point:"fire station = 消防站。"},{en:"It's cool and I want to help people.",ipa:"/ɪts kuːl ænd aɪ wɒnt tu help ˈpiːpl/",zh:"那很酷，我想帮助人们。",point:"help people = 帮助人们。"},{en:"What is your dream job?",ipa:"/wɒt ɪz jɔː driːm dʒɒb/",zh:"你的梦想职业是什么？",point:"dream job = 梦想职业。"},{en:"Where do you work?",ipa:"/weə duː juː wɜːk/",zh:"你在哪里工作？",point:"Where do you work? 询问工作地点。"},{en:"Who do you work with?",ipa:"/huː duː juː wɜːk wɪð/",zh:"你和谁一起工作？",point:"Who do you work with? 询问工作伙伴。"},{en:"What do you do at work?",ipa:"/wɒt duː juː duː æt wɜːk/",zh:"你在工作中做什么？",point:"What do you do at work? 询问工作内容。"},{en:"I want to be...",ipa:"/aɪ wɒnt tu biː/",zh:"我想成为……",point:"I want to be... 表达梦想。"},{en:"What does your mother do?",ipa:"/wɒt dʌz jɔː ˈmʌðə duː/",zh:"你的妈妈是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"Who works here?",ipa:"/huː wɜːks hɪə/",zh:"谁在这里工作？",point:"Who works here? 询问谁在这里工作。"},{en:"What does your grandpa do?",ipa:"/wɒt dʌz jɔː ˈɡrænpɑː duː/",zh:"你的爷爷是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"What does she do?",ipa:"/wɒt dʌz ʃiː duː/",zh:"她是做什么的？",point:"What does + 主语 + do? 询问职业。"},{en:"Write the word. P_ _i_ _ officer.",ipa:"/raɪt ðə wɜːd/",zh:"写单词。P_ _i_ _ officer。",point:"根据提示写单词。"},{en:"What does Lingling's father do?",ipa:"/wɒt dʌz ˌlɪŋˈlɪŋz ˈfɑːðə duː/",zh:"玲玲的爸爸是做什么的？",point:"询问职业。"},{en:"Name a night job.",ipa:"/neɪm ə naɪt dʒɒb/",zh:"说出一个夜班工作。",point:"night job = 夜班工作。"},{en:"What do you want to be?",ipa:"/wɒt duː juː wɒnt tu biː/",zh:"你想成为什么？",point:"询问梦想职业。"},{en:"What does your father do?",ipa:"/wɒt dʌz jɔː ˈfɑːðə duː/",zh:"你的爸爸是做什么的？",point:"询问职业。"},{en:"Who works here?",ipa:"/huː wɜːks hɪə/",zh:"谁在这里工作？",point:"询问谁在这里工作。"},{en:"Farmer, worker, baker, driver, seller.",ipa:"/ˈfɑːmə ˈwɜːkə ˈbeɪkə ˈdraɪvə ˈselə/",zh:"农民、工人、面包师、司机、售货员。",point:"各种职业名称。"},{en:"How does bread go from the farm to the table?",ipa:"/haʊ dʌz bred ɡəʊ frɒm ðə fɑːm tu ðə ˈteɪbl/",zh:"面包是怎么从农场到餐桌的？",point:"from...to... = 从……到……。"},{en:"What jobs help to make it?",ipa:"/wɒt dʒɒbz help tu meɪk ɪt/",zh:"什么工作帮助制作它？",point:"help to do sth. = 帮助做某事。"}]},
{name:"Unit 2 How do you feel today?",words:[{en:"laugh",ipa:"/lɑːf/",zh:"笑"},{en:"sad",ipa:"/sæd/",zh:"伤心的"},{en:"scared",ipa:"/skeəd/",zh:"害怕的"},{en:"angry",ipa:"/ˈæŋɡri/",zh:"生气的"},{en:"excited",ipa:"/ɪkˈsaɪtɪd/",zh:"兴奋的"},{en:"opera",ipa:"/ˈɒprə/",zh:"歌剧"},{en:"next",ipa:"/nekst/",zh:"紧接着的"},{en:"cough",ipa:"/kɒf/",zh:"咳嗽"},{en:"better",ipa:"/ˈbetə/",zh:"好转的"},{en:"gift",ipa:"/ɡɪft/",zh:"礼物"},{en:"model",ipa:"/ˈmɒdl/",zh:"模型"},{en:"shout",ipa:"/ʃaʊt/",zh:"喊叫"},{en:"should",ipa:"/ʃʊd/",zh:"应该"},{en:"feeling",ipa:"/ˈfiːlɪŋ/",zh:"感觉"},{en:"huge",ipa:"/hjuːdʒ/",zh:"巨大的"},{en:"worried",ipa:"/ˈwʌrid/",zh:"担心的"},{en:"street",ipa:"/striːt/",zh:"街道"},{en:"hit",ipa:"/hɪt/",zh:"撞击"}],phrases:[{en:"feel happy",ipa:"/fiːl ˈhæpi/",zh:"感到开心"},{en:"feel sad",ipa:"/fiːl sæd/",zh:"感到伤心"},{en:"feel scared",ipa:"/fiːl skeəd/",zh:"感到害怕"},{en:"feel angry",ipa:"/fiːl ˈæŋɡri/",zh:"感到生气"},{en:"feel excited",ipa:"/fiːl ɪkˈsaɪtɪd/",zh:"感到兴奋"},{en:"Beijing opera",ipa:"/ˌbeɪˈdʒɪŋ ˈɒprə/",zh:"京剧"},{en:"get well soon",ipa:"/ɡet wel suːn/",zh:"早日康复"},{en:"be sorry about",ipa:"/biː ˈsɒri əˈbaʊt/",zh:"对……感到抱歉"},{en:"shout at",ipa:"/ʃaʊt æt/",zh:"对……喊叫"},{en:"count to three",ipa:"/kaʊnt tu θriː/",zh:"数到三"}],sentences:[{en:"I feel happy. I laugh and dance around.",ipa:"/aɪ fiːl ˈhæpi aɪ lɑːf ænd dɑːns əˈraʊnd/",zh:"我感到开心。我笑着到处跳舞。",point:"feel + 形容词，表示感觉。"},{en:"I feel sad. I cry and talk to a friend.",ipa:"/aɪ fiːl sæd aɪ kraɪ ænd tɔːk tu ə frend/",zh:"我感到伤心。我哭着和朋友交谈。",point:"talk to a friend = 和朋友交谈。"},{en:"I feel scared. I share it with my family.",ipa:"/aɪ fiːl skeəd aɪ ʃeə ɪt wɪð maɪ ˈfæməli/",zh:"我感到害怕。我和家人分享。",point:"share...with... = 和……分享……。"},{en:"I feel angry. I stop and count to three.",ipa:"/aɪ fiːl ˈæŋɡri aɪ stɒp ænd kaʊnt tu θriː/",zh:"我感到生气。我停下来数到三。",point:"count to three = 数到三。"},{en:"I feel excited. I jump and say, 'Hooray!'",ipa:"/aɪ fiːl ɪkˈsaɪtɪd aɪ dʒʌmp ænd seɪ huˈreɪ/",zh:"我感到兴奋。我跳起来说“好耶！”",point:"jump and say = 跳起来说。"},{en:"It's my first Beijing opera show with Lingling.",ipa:"/ɪts maɪ fɜːst ˌbeɪˈdʒɪŋ ˈɒprə ʃəʊ wɪð ˌlɪŋˈlɪŋ/",zh:"这是我和玲玲的第一场京剧演出。",point:"first = 第一。"},{en:"I'm so excited.",ipa:"/aɪm səʊ ɪkˈsaɪtɪd/",zh:"我很兴奋。",point:"so + 形容词 = 如此……。"},{en:"Amy is ill today.",ipa:"/ˈeɪmi ɪz ɪl təˈdeɪ/",zh:"埃米今天生病了。",point:"ill = 生病的。"},{en:"Is she coughing?",ipa:"/ɪz ʃiː ˈkɒfɪŋ/",zh:"她在咳嗽吗？",point:"现在进行时：be + 动词-ing。"},{en:"Yes, she is.",ipa:"/jes ʃiː ɪz/",zh:"是的，她在咳嗽。",point:"肯定回答。"},{en:"She can't talk.",ipa:"/ʃiː kɑːnt tɔːk/",zh:"她不能说话。",point:"can't = 不能。"},{en:"She can't take part in the show today. She's sad.",ipa:"/ʃiː kɑːnt teɪk pɑːt ɪn ðə ʃəʊ təˈdeɪ ʃiːz sæd/",zh:"她今天不能参加演出了。她很伤心。",point:"take part in = 参加。"},{en:"I'm sorry to hear that.",ipa:"/aɪm ˈsɒri tu hɪə ðæt/",zh:"听到这个我很难过。",point:"I'm sorry to hear that = 听到这个我很难过。"},{en:"Dear Amy, Get well soon. Don't be sad. We can do it next time.",ipa:"/dɪə ˈeɪmi ɡet wel suːn dəʊnt biː sæd wiː kæn duː ɪt nekst taɪm/",zh:"亲爱的埃米，早日康复。别难过。我们下次再做。",point:"Get well soon = 早日康复。"},{en:"Dear Lingling, Thank you. I'm feeling better now.",ipa:"/dɪə ˌlɪŋˈlɪŋ θæŋk juː aɪm ˈfiːlɪŋ ˈbetə naʊ/",zh:"亲爱的玲玲，谢谢你。我现在感觉好多了。",point:"feeling better = 感觉好多了。"},{en:"Time for the show. I'm happy!",ipa:"/taɪm fɔː ðə ʃəʊ aɪm ˈhæpi/",zh:"该演出了。我很开心！",point:"Time for... = 该……了。"},{en:"Hi, Amy. Are you still coughing?",ipa:"/haɪ ˈeɪmi ɑː juː stɪl ˈkɒfɪŋ/",zh:"嗨，埃米。你还在咳嗽吗？",point:"Are you still...? 询问还在……吗？"},{en:"No, I'm not. I feel great now.",ipa:"/nəʊ aɪm nɒt aɪ fiːl ɡreɪt naʊ/",zh:"不，我没有。我现在感觉很好。",point:"No, I'm not = 不，我没有。"},{en:"Look! They are doing very well.",ipa:"/lʊk ðeɪ ɑː ˈduːɪŋ ˈveri wel/",zh:"看！他们做得非常好。",point:"现在进行时。"},{en:"Yes! I'm happy for them.",ipa:"/jes aɪm ˈhæpi fɔː ðəm/",zh:"是的！我为他们感到高兴。",point:"be happy for sb. = 为某人感到高兴。"},{en:"Is he jumping?",ipa:"/ɪz hiː ˈdʒʌmpɪŋ/",zh:"他在跳吗？",point:"现在进行时的一般疑问句。"},{en:"Yes, he is. He's excited.",ipa:"/jes hiː ɪz hiːz ɪkˈsaɪtɪd/",zh:"是的。他很兴奋。",point:"He's = He is。"},{en:"Happy birthday, Jay!",ipa:"/ˈhæpi ˈbɜːθdeɪ dʒeɪ/",zh:"生日快乐，杰伊！",point:"生日祝福语。"},{en:"This is for you.",ipa:"/ðɪs ɪz fɔː juː/",zh:"这是给你的。",point:"This is for you = 这是给你的。"},{en:"Thank you! It's the new model ship!",ipa:"/θæŋk juː ɪts ðə njuː ˈmɒdl ʃɪp/",zh:"谢谢你！这是新的模型船！",point:"model ship = 模型船。"},{en:"Jay is very happy.",ipa:"/dʒeɪ ɪz ˈveri ˈhæpi/",zh:"杰伊非常开心。",point:"very + 形容词。"},{en:"Time for bed, Jay.",ipa:"/taɪm fɔː bed dʒeɪ/",zh:"该睡觉了，杰伊。",point:"Time for bed = 该睡觉了。"},{en:"I'm making the ship.",ipa:"/aɪm ˈmeɪkɪŋ ðə ʃɪp/",zh:"我正在做船。",point:"现在进行时。"},{en:"You can make it tomorrow.",ipa:"/juː kæn meɪk ɪt təˈmɒrəʊ/",zh:"你可以明天再做。",point:"tomorrow = 明天。"},{en:"Bang!",ipa:"/bæŋ/",zh:"砰！",point:"拟声词。"},{en:"Ray! My ship!",ipa:"/reɪ maɪ ʃɪp/",zh:"雷！我的船！",point:"呼唤名字。"},{en:"Jay is angry. He is shouting at Ray.",ipa:"/dʒeɪ ɪz ˈæŋɡri hiː ɪz ˈʃaʊtɪŋ æt reɪ/",zh:"杰伊生气了。他对着雷喊叫。",point:"shout at = 对……喊叫。"},{en:"Jay runs back to his room. He is sad.",ipa:"/dʒeɪ rʌnz bæk tu hɪz ruːm hiː ɪz sæd/",zh:"杰伊跑回他的房间。他很伤心。",point:"run back = 跑回。"},{en:"Jay, I'm so sorry about your ship.",ipa:"/dʒeɪ aɪm səʊ ˈsɒri əˈbaʊt jɔː ʃɪp/",zh:"杰伊，我对你的船感到很抱歉。",point:"be sorry about = 对……感到抱歉。"},{en:"Ray, I'm sorry. I shouldn't shout at you.",ipa:"/reɪ aɪm ˈsɒri aɪ ˈʃʊdnt ʃaʊt æt juː/",zh:"雷，对不起。我不应该对你喊叫。",point:"shouldn't = 不应该。"},{en:"Let's make it again together!",ipa:"/lets meɪk ɪt əˈɡen təˈɡeðə/",zh:"我们一起再做一次吧！",point:"again = 再次。together = 一起。"},{en:"Jay and Ray are happy now.",ipa:"/dʒeɪ ænd reɪ ɑː ˈhæpi naʊ/",zh:"杰伊和雷现在很开心。",point:"now = 现在。"},{en:"These cute little faces have feelings to show.",ipa:"/ðiːz kjuːt ˈlɪtl ˈfeɪsɪz hæv ˈfiːlɪŋz tu ʃəʊ/",zh:"这些可爱的小脸有情感要表达。",point:"have feelings to show = 有情感要表达。"},{en:"They use colours, not words.",ipa:"/ðeɪ juːz ˈkʌləz nɒt wɜːdz/",zh:"它们用颜色，而不是文字。",point:"use...not... = 用……而不是……。"},{en:"You feel angry, like the colour of a huge fire.",ipa:"/juː fiːl ˈæŋɡri laɪk ðə ˈkʌlə əv ə hjuːdʒ ˈfaɪə/",zh:"你感到生气，像熊熊大火的颜色。",point:"like = 像。"},{en:"You feel happy, like the colour of the sun.",ipa:"/juː fiːl ˈhæpi laɪk ðə ˈkʌlə əv ðə sʌn/",zh:"你感到开心，像太阳的颜色。",point:"like = 像。"},{en:"You feel sad, like the colour of a cloudy sky.",ipa:"/juː fiːl sæd laɪk ðə ˈkʌlə əv ə ˈklaʊdi skaɪ/",zh:"你感到伤心，像多云天空的颜色。",point:"like = 像。"},{en:"You feel worried, like the colour of night.",ipa:"/juː fiːl ˈwʌrid laɪk ðə ˈkʌlə əv naɪt/",zh:"你感到担心，像夜晚的颜色。",point:"like = 像。"},{en:"Sichuan opera is very famous in China.",ipa:"/ˈsɪtʃwɑːn ˈɒprə ɪz ˈveri ˈfeɪməs ɪn ˈtʃaɪnə/",zh:"川剧在中国非常有名。",point:"be famous = 有名。"},{en:"He can change his masks to show different feelings.",ipa:"/hiː kæn tʃeɪndʒ hɪz mɑːsks tu ʃəʊ ˈdɪfrənt ˈfiːlɪŋz/",zh:"他可以改变他的面具来展示不同的情感。",point:"change = 改变。"},{en:"My mask is black and white. It's smiling. I'm happy.",ipa:"/maɪ mɑːsk ɪz blæk ænd waɪt ɪts ˈsmaɪlɪŋ aɪm ˈhæpi/",zh:"我的面具是黑白的。它在微笑。我很开心。",point:"smiling = 微笑的。"},{en:"My mask is blue. It's crying. I'm sad.",ipa:"/maɪ mɑːsk ɪz bluː ɪts ˈkraɪɪŋ aɪm sæd/",zh:"我的面具是蓝色的。它在哭。我很伤心。",point:"crying = 哭的。"},{en:"My mask is red and yellow. Look! I'm angry.",ipa:"/maɪ mɑːsk ɪz red ænd ˈjeləʊ lʊk aɪm ˈæŋɡri/",zh:"我的面具是红色和黄色的。看！我很生气。",point:"angry = 生气的。"},{en:"My mask is orange and has a big open mouth. I'm very excited.",ipa:"/maɪ mɑːsk ɪz ˈɒrɪndʒ ænd hæz ə bɪɡ ˈəʊpən maʊθ aɪm ˈveri ɪkˈsaɪtɪd/",zh:"我的面具是橙色的，有一个张开的大嘴。我很兴奋。",point:"excited = 兴奋的。"},{en:"I'm ___ today. My mask is ___.",ipa:"/aɪm təˈdeɪ maɪ mɑːsk ɪz/",zh:"我今天……。我的面具是……。",point:"描述自己的心情和面具。"},{en:"Are you feeling happy today?",ipa:"/ɑː juː ˈfiːlɪŋ ˈhæpi təˈdeɪ/",zh:"你今天感到开心吗？",point:"Are you feeling...? 询问感受。"},{en:"Yes, I am.",ipa:"/jes aɪ æm/",zh:"是的，我是。",point:"肯定回答。"},{en:"How do you feel today?",ipa:"/haʊ duː juː fiːl təˈdeɪ/",zh:"你今天感觉怎么样？",point:"询问感受。"},{en:"Why?",ipa:"/waɪ/",zh:"为什么？",point:"询问原因。"},{en:"What makes you sad?",ipa:"/wɒt meɪks juː sæd/",zh:"什么让你伤心？",point:"What makes you...? 询问什么让你……。"},{en:"What makes you angry?",ipa:"/wɒt meɪks juː ˈæŋɡri/",zh:"什么让你生气？",point:"What makes you...? 询问什么让你……。"},{en:"What makes you happy?",ipa:"/wɒt meɪks juː ˈhæpi/",zh:"什么让你开心？",point:"What makes you...? 询问什么让你……。"},{en:"Is he laughing?",ipa:"/ɪz hiː ˈlɑːfɪŋ/",zh:"他在笑吗？",point:"现在进行时的一般疑问句。"},{en:"How does she feel?",ipa:"/haʊ dʌz ʃiː fiːl/",zh:"她感觉怎么样？",point:"How does she feel? 询问她的感受。"},{en:"I feel...",ipa:"/aɪ fiːl/",zh:"我感到……",point:"表达感受。"},{en:"Is he...?",ipa:"/ɪz hiː/",zh:"他……吗？",point:"一般疑问句。"}]},
{name:"Unit 3 Everyone's got talent!",words:[{en:"talent",ipa:"/ˈtælənt/",zh:"天赋"},{en:"act",ipa:"/ækt/",zh:"表演"},{en:"magic",ipa:"/ˈmædʒɪk/",zh:"魔术"},{en:"shine",ipa:"/ʃaɪn/",zh:"出众"},{en:"puzzle",ipa:"/ˈpʌzl/",zh:"拼图"},{en:"dancer",ipa:"/ˈdɑːnsə/",zh:"舞蹈演员"},{en:"win",ipa:"/wɪn/",zh:"获胜"},{en:"just",ipa:"/dʒʌst/",zh:"只是"},{en:"boy",ipa:"/bɔɪ/",zh:"男孩"},{en:"slowly",ipa:"/ˈsləʊli/",zh:"缓慢地"}],phrases:[{en:"play the piano",ipa:"/pleɪ ðə piˈænəʊ/",zh:"弹钢琴"},{en:"do magic",ipa:"/duː ˈmædʒɪk/",zh:"变魔术"},{en:"take photos",ipa:"/teɪk ˈfəʊtəʊz/",zh:"拍照"},{en:"do puzzles",ipa:"/duː ˈpʌzlz/",zh:"拼拼图"},{en:"be good at",ipa:"/biː ɡʊd æt/",zh:"擅长"},{en:"work hard",ipa:"/wɜːk hɑːd/",zh:"努力工作"},{en:"come true",ipa:"/kʌm truː/",zh:"实现"},{en:"day and night",ipa:"/deɪ ænd naɪt/",zh:"日日夜夜"}],sentences:[{en:"You can play the piano. I can act.",ipa:"/juː kæn pleɪ ðə piˈænəʊ aɪ kæn ækt/",zh:"你会弹钢琴。我会表演。",point:"play the piano = 弹钢琴。"},{en:"He can do magic with a hat.",ipa:"/hiː kæn duː ˈmædʒɪk wɪð ə hæt/",zh:"他可以用帽子变魔术。",point:"do magic = 变魔术。"},{en:"Yes, we can! Talents make us shine!",ipa:"/jes wiː kæn ˈtælənts meɪk ʌs ʃaɪn/",zh:"是的，我们可以！才艺让我们闪耀！",point:"make us shine = 让我们闪耀。"},{en:"You can take photos. I can cook.",ipa:"/juː kæn teɪk ˈfəʊtəʊz aɪ kæn kʊk/",zh:"你会拍照。我会做饭。",point:"take photos = 拍照。"},{en:"She can do puzzles with one look.",ipa:"/ʃiː kæn duː ˈpʌzlz wɪð wʌn lʊk/",zh:"她看一眼就能拼出拼图。",point:"do puzzles = 拼拼图。"},{en:"I can ___.",ipa:"/aɪ kæn/",zh:"我会……。",point:"表达能力。"},{en:"What are you looking at?",ipa:"/wɒt ɑː juː ˈlʊkɪŋ æt/",zh:"你在看什么？",point:"What are you looking at? 询问正在看什么。"},{en:"I'm looking at their clothes.",ipa:"/aɪm ˈlʊkɪŋ æt ðeə kləʊðz/",zh:"我在看他们的衣服。",point:"现在进行时。"},{en:"Are you worried?",ipa:"/ɑː juː ˈwʌrid/",zh:"你担心吗？",point:"Are you worried? 询问是否担心。"},{en:"Everyone's wearing beautiful clothes. But not I can't win.",ipa:"/ˈevriwʌnz ˈweərɪŋ ˈbjuːtəfl kləʊðz bʌt nɒt aɪ kɑːnt wɪn/",zh:"每个人都穿着漂亮的衣服。但我赢不了。",point:"Everyone's = Everyone is。"},{en:"Don't worry about ng Amy.",ipa:"/ˌlɪŋˈlɪŋ ɪz ˈkɔːlɪŋ ˈeɪmi/",zh:"玲玲在给埃米打电话。",point:"call = 打电话。"},{en:"What is Little Chicken good at?",ipa:"/wɒt ɪz ˈlɪtl ˈtʃɪkɪn ɡʊd æt/",zh:"小鸡擅长什么？",point:"be good at = 擅长。"},{en:"She's flying so well! Oh, Bird, please teach me to fly.",ipa:"/ʃiːz ˈflaɪɪŋ səʊ wel əʊ bɜːd pliːz tiːtʃ miː tu flaɪ/",zh:"她飞得真好！哦，小鸟，请教我飞。",point:"teach sb. to do sth. = 教某人做某事。"},{en:"Oh, no. I'm not good at flying.",ipa:"/əʊ nəʊ aɪm nɒt ɡʊd æt ˈflaɪɪŋ/",zh:"哦，不。我不擅长飞。",point:"be not good at = 不擅长。"},{en:"He's running so well! Oh, Dog, please teach me to run.",ipa:"/hiːz ˈrʌnɪŋ səʊ wel əʊ dɒɡ pliːz tiːtʃ miː tu rʌn/",zh:"他跑得真好！哦，狗，请教我跑。",point:"teach me to run = 教我跑。"},{en:"Oh, no. I'm not good at running.",ipa:"/əʊ nəʊ aɪm nɒt ɡʊd æt ˈrʌnɪŋ/",zh:"哦，不。我不擅长跑。",point:"be not good at = 不擅长。"},{en:"He's swimming so well! Oh, Duck, please teach me to swim.",ipa:"/hiːz ˈswɪmɪŋ səʊ wel əʊ dʌk pliːz tiːtʃ miː tu swɪm/",zh:"他游得真好！哦，鸭子，请教我游泳。",point:"teach me to swim = 教我游泳。"},{en:"Oh, no. I'm not good at swimming.",ipa:"/əʊ nəʊ aɪm nɒt ɡʊd æt ˈswɪmɪŋ/",zh:"哦，不。我不擅长游泳。",point:"be not good at = 不擅长。"},{en:"Why are you crying, my boy?",ipa:"/waɪ ɑː juː ˈkraɪɪŋ maɪ bɔɪ/",zh:"你为什么哭，我的孩子？",point:"Why are you crying? 询问为什么哭。"},{en:"I've got no talent.",ipa:"/aɪv ɡɒt nəʊ ˈtælənt/",zh:"我没有天赋。",point:"I've got = I have got。"},{en:"Don't worry. Let me teach you to sing.",ipa:"/dəʊnt ˈwʌri let miː tiːtʃ juː tu sɪŋ/",zh:"别担心。让我教你唱歌。",point:"Let me teach you = 让我教你。"},{en:"Cock-a-doodle-doo.",ipa:"/ˌkɒk ə ˈduːdl duː/",zh:"喔喔喔。",point:"公鸡的叫声。"},{en:"Listen! Little Chicken is singing. He sings so well!",ipa:"/ˈlɪsn ˈlɪtl ˈtʃɪkɪn ɪz ˈsɪŋɪŋ hiː sɪŋz səʊ wel/",zh:"听！小鸡在唱歌。他唱得真好！",point:"sing so well = 唱得真好。"},{en:"See? That's your talent!",ipa:"/siː ðæts jɔː ˈtælənt/",zh:"看？那就是你的天赋！",point:"That's your talent! = 那就是你的天赋！"},{en:"I write all the time. I am good at writing.",ipa:"/aɪ raɪt ɔːl ðə taɪm aɪ æm ɡʊd æt ˈraɪtɪŋ/",zh:"我一直在写。我擅长写作。",point:"be good at = 擅长。"},{en:"But talent is only the start." ŋ ə smɔːl ˈɡɑːdn fɔː ðə klɑːs/",zh:"我们在为班级建一个小花园！",point:"make a garden = 建花园。"},{en:"I've got tomato seeds.",ipa:"/aɪv ɡɒt təˈmɑːtəʊ siːdz/",zh:"我有西红柿种子。",point:"I've got = I have got。"},{en:"I've got bean seeds.",ipa:"/aɪv ɡɒt biːn siːdz/",zh:"我有豆子种子。",point:"bean seeds = 豆子种子。"},{en:"I've got cucumber seeds.",ipa:"/aɪv ɡɒt ˈkjuːkʌmbə siːdz/",zh:"我有黄瓜种子。",point:"cucumber = 黄瓜。"},{en:"I've got sunflower seeds.",ipa:"/aɪv ɡɒt ˈsʌnflaʊə siːdz/",zh:"我有向日葵种子。",point:"sunflower = 向日葵。"},{en:"Two weeks later.",ipa:"/tuː wiːks ˈleɪtə/",zh:"两周后。",point:"later = 之后。"},{en:"Are your seeds growing?",ipa:"/ɑː jɔː siːdz ˈɡrəʊɪŋ/",zh:"你的种子在生长吗？",point:"现在进行时的一般疑问句。"},{en:"Yes, they are. Look!",ipa:"/jes ðeɪ ɑː lʊk/",zh:"是的，它们在生长。看！",point:"肯定回答。"},{en:"Why aren't my seeds growing?",ipa:"/waɪ ɑːnt maɪ siːdz ˈɡrəʊɪŋ/",zh:"为什么我的种子不生长？",point:"否定疑问句。"},{en:"Oh, Sam. These seeds can't grow!",ipa:"/əʊ sæm ðiːz siːdz kɑːnt ɡrəʊ/",zh:"哦，萨姆。这些种子不能生长！",point:"can't = 不能。"},{en:"Let me plant a new one.",ipa:"/let miː plɑːnt ə njuː wʌn/",zh:"让我种一颗新的。",point:"Let me = 让我。"},{en:"Are your seeds growing?",ipa:"/ɑː jɔː siːdz ˈɡrəʊɪŋ/",zh:"你的种子在生长吗？",point:"现在进行时的一般疑问句。"},{en:"Yes, they are.",ipa:"/jes ðeɪ ɑː/",zh:"是的，它们在生长。",point:"肯定回答。"},{en:"They are planting tomato seeds.",ipa:"/ðeɪ ɑː ˈplɑːntɪŋ təˈmɑːtəʊ siːdz/",zh:"他们在种西红柿种子。",point:"现在进行时。"},{en:"Is he watering the plants?",ipa:"/ɪz hiː ˈwɔːtərɪŋ ðə plɑːnts/",zh:"他在给植物浇水吗？",point:"现在进行时的一般疑问句。"},{en:"Yes, he is.",ipa:"/jes hiː ɪz/",zh:"是的，他在。",point:"肯定回答。"},{en:"What are they doing?",ipa:"/wɒt ɑː ðeɪ ˈduːɪŋ/",zh:"他们在做什么？",point:"询问正在做什么。"},{en:"They're picking grapes.",ipa:"/ðeə ˈpɪkɪŋ ɡreɪps/",zh:"他们在摘葡萄。",point:"现在进行时。"},{en:"What are they doing in Picture 1?",ipa:"/wɒt ɑː ðeɪ ˈduːɪŋ ɪn ˈpɪktʃə wʌn/",zh:"他们在图片1中做什么？",point:"看图片回答问题。"},{en:"They're planting seeds.",ipa:"/ðeə ˈplɑːntɪŋ siːdz/",zh:"他们在播种。",point:"plant seeds = 播种。"},{en:"What are Grandpa's dreams?",ipa:"/wɒt ɑː ˈɡrænpɑːz driːmz/",zh:"爷爷的梦想是什么？",point:"dreams = 梦想。"},{en:"I'm Huahua. This is my grandpa. He's a scientist.",ipa:"/aɪm ˌhwɑːˈhwɑː ðɪs ɪz maɪ ˈɡrænpɑː hiːz ə ˈsaɪəntɪst/",zh:"我是花花。这是我的爷爷。他是一名科学家。",point:"He's = He is。"},{en:"I like staying with Grandpa. He's reading and I'm sleeping.",ipa:"/aɪ laɪk ˈsteɪɪŋ wɪð ˈɡrænpɑː hiːz ˈriːdɪŋ ænd aɪm ˈsliːpɪŋ/",zh:"我喜欢和爷爷待在一起。他在读书，我在睡觉。",point:"现在进行时。"},{en:"Grandpa often works in the fields. I like playing with the rice plants there.",ipa:"/ˈɡrænpɑː ˈɒfn wɜːks ɪn ðə fiːldz aɪ laɪk ˈpleɪɪŋ wɪð ðə raɪs plɑːnts ðeə/",zh:"爷爷经常在田地里工作。我喜欢在那里和稻子玩。",point:"in the fields = 在田地里。"},{en:"Grandpa works hard. Sometimes I work, too!",ipa:"/ˈɡrænpɑː wɜːks hɑːd ˈsʌmtaɪmz aɪ wɜːk tuː/",zh:"爷爷工作努力。有时我也工作！",point:"sometimes = 有时。"},{en:"Grandpa has two dreams.",ipa:"/ˈɡrænpɑː hæz tuː driːmz/",zh:"爷爷有两个梦想。",point:"has = 有。"},{en:"He wants to grow tall rice plants. He can sit under them.",ipa:"/hiː wɒnts tu ɡrəʊ tɔːl raɪs plɑːnts hiː kæn sɪt ˈʌndə ðəm/",zh:"他想种出高高的稻子。他可以坐在它们下面。",point:"want to do sth. = 想做某事。"},{en:"He also wants to feed the world with his rice.",ipa:"/hiː ˈɔːlsəʊ wɒnts tu fiːd ðə wɜːld wɪð hɪz raɪs/",zh:"他还想用他的稻子养活世界。",point:"feed the world = 养活世界。"},{en:"I miss Grandpa. I think his dreams will come true!",ipa:"/aɪ mɪs ˈɡrænpɑː aɪ θɪŋk hɪz driːmz wɪl kʌm truː/",zh:"我想念爷爷。我认为他的梦想会实现！",point:"come true = 实现。"},{en:"Huahua's grandpa doesn't work in the fields.",ipa:"/ˌhwɑːˈhwɑːz ˈɡrænpɑː ˈdʌznt wɜːk ɪn ðə fiːldz/",zh:"花花的爷爷不在田地里工作。",point:"doesn't work = 不在工作。"},{en:"Huahua sometimes works with Grandpa.",ipa:"/ˌhwɑːˈhwɑː ˈsʌmtaɪmz wɜːks wɪð ˈɡrænpɑː/",zh:"花花有时和爷爷一起工作。",point:"sometimes = 有时。"},{en:"Huahua's grandpa works hard for his dreams.",ipa:"/ˌhwɑːˈhwɑːz ˈɡrænpɑː wɜːks hɑːd fɔː hɪz driːmz/",zh:"花花的爷爷为他的梦想努力工作。",point:"work hard for = 为……努力工作。"},{en:"Yummy, yummy food, comes from plants.",ipa:"/ˈjʌmi ˈjʌmi fuːd kʌmz frɒm plɑːnts/",zh:"美味的食物来自植物。",point:"come from = 来自。"},{en:"What do you want?",ipa:"/wɒt duː juː wɒnt/",zh:"你想要什么？",point:"询问想要什么。"},{en:"He wants carrots. She wants corn.",ipa:"/hiː wɒnts ˈkærəts ʃiː wɒnts kɔːn/",zh:"他想要胡萝卜。她想要玉米。",point:"wants 是第三人称单数形式。"},{en:"I want tomatoes, and green, green beans.",ipa:"/aɪ wɒnt təˈmɑːtəʊz ænd ɡriːn ɡriːn biːnz/",zh:"我想要西红柿和绿绿的豆子。",point:"and 连接并列成分。"},{en:"Plants, plants, we love you so.",ipa:"/plɑːnts plɑːnts wiː lʌv juː səʊ/",zh:"植物，植物，我们如此爱你。",point:"so = 如此。"},{en:"Thank you for helping us grow!",ipa:"/θæŋk juː fɔː ˈhelpɪŋ ʌs ɡrəʊ/",zh:"谢谢你帮助我们成长！",point:"Thank you for doing sth. = 谢谢你做某事。"},{en:"We use plants to make paper.",ipa:"/wiː juːz plɑːnts tu meɪk ˈpeɪpə/",zh:"我们用植物来造纸。",point:"use...to do... = 用……做……。"},{en:"We also use plants to make chairs.",ipa:"/wiː ˈɔːlsəʊ juːz plɑːnts tu meɪk tʃeəz/",zh:"我们也用植物来做椅子。",point:"also = 也。"},{en:"What's he doing?",ipa:"/wɒts hiː ˈduːɪŋ/",zh:"他在做什么？",point:"询问正在做什么。"},{en:"Is it from plants?",ipa:"/ɪz ɪt frɒm plɑːnts/",zh:"它来自植物吗？",point:"from plants = 来自植物。"},{en:"Which part of the plant is it?",ipa:"/wɪtʃ pɑːt əv ðə plɑːnt ɪz ɪt/",zh:"它是植物的哪个部分？",point:"which part = 哪个部分。"},{en:"What are his dreams?",ipa:"/wɒt ɑː hɪz driːmz/",zh:"他的梦想是什么？",point:"dreams = 梦想。"},{en:"Is she planting seeds?",ipa:"/ɪz ʃiː ˈplɑːntɪŋ siːdz/",zh:"她在播种吗？",point:"现在进行时的一般疑问句。"},{en:"What plants does Sam grow?",ipa:"/wɒt plɑːnts dʌz sæm ɡrəʊ/",zh:"萨姆种什么植物？",point:"grow = 种植。"},{en:"Who is it?",ipa:"/huː ɪz ɪt/",zh:"它是谁？",point:"询问是谁。"},{en:"Is she picking fruit?",ipa:"/ɪz ʃiː ˈpɪkɪŋ fruːt/",zh:"她在摘水果吗？",point:"现在进行时的一般疑问句。"},{en:"Name parts of a plant.",ipa:"/neɪm pɑːts əv ə plɑːnt/",zh:"说出植物的各个部分。",point:"name = 说出。"},{en:"Use 'What are you planting? - We're planting...' to talk about growing plants.",ipa:"/juːz wɒt ɑː juː ˈplɑːntɪŋ wɪə ˈplɑːntɪŋ tu tɔːk əˈbaʊt ˈɡrəʊɪŋ plɑːnts/",zh:"用“What are you planting? - We're planting...”来谈论种植植物。",point:"谈论种植植物。"},{en:"Talk about the uses of plants.",ipa:"/tɔːk əˈbaʊt ðə ˈjuːsɪz əv plɑːnts/",zh:"谈论植物的用途。",point:"uses of plants = 植物的用途。"},{en:"In the USA, the rose stands for love.",ipa:"/ɪn ðə juː es eɪ ðə rəʊz stændz fɔː lʌv/",z vity?",ipa:"/weə ɪz ði ækˈtɪvəti/",zh:"活动在哪里？",point:"where = 在哪里。"},{en:"Who goes to it?",ipa:"/huː ɡəʊz tu ɪt/",zh:"谁去参加？",point:"who = 谁。"},{en:"What do you do?",ipa:"/wɒt duː juː duː/",zh:"你做什么？",point:"询问做什么。"},{en:"Is there any food?",ipa:"/ɪz ðeər ˈeni fuːd/",zh:"有食物吗？",point:"Is there any...? 询问有……吗？"},{en:"Are there any games?",ipa:"/ɑː ðeər ˈeni ɡeɪmz/",zh:"有游戏吗？",point:"Are there any...? 询问有……吗？"},{en:"My favourite school activity is the school fair. There is... There are...",ipa:"/maɪ ˈfeɪvərɪt skuːl ækˈtɪvəti ɪz ðə skuːl feə ðeər ɪz ðeər ɑː/",zh:"我最喜欢的学校活动是学校义卖会。有……有……",point:"描述学校活动。"},{en:"What's the activity?",ipa:"/wɒts ði ækˈtɪvəti/",zh:"活动是什么？",point:"询问活动。"},{en:"There ___ two footballs.",ipa:"/ðeə tuː ˈfʊtbɔːlz/",zh:"有……两个足球。",point:"There are + 复数名词。"},{en:"Are there any apples?",ipa:"/ɑː ðeər ˈeni ˈæplz/",zh:"有苹果吗？",point:"Are there any...? 询问有……吗？"},{en:"There ___ a toy.",ipa:"/ðeər ə tɔɪ/",zh:"有……一个玩具。",point:"There is + 单数名词。"},{en:"Say it. I hope to go to Rome.",ipa:"/seɪ ɪt aɪ həʊp tu ɡəʊ tu rəʊm/",zh:"说出来。我希望去罗马。",point:"hope to do sth. = 希望做某事。"},{en:"It's close to home.",ipa:"/ɪts kləʊs tu həʊm/",zh:"它离家很近。",point:"close to = 离……近。"},{en:"There ___ a mask.",ipa:"/ðeər ə mɑːsk/",zh:"有……一个面具。",point:"There is + 单数名词。"},{en:"Who is this man?",ipa:"/huː ɪz ðɪs mæn/",zh:"这个人是谁？",point:"who = 谁。"},{en:"Is there a school picnic?",ipa:"/ɪz ðeər ə skuːl ˈpɪknɪk/",zh:"有学校野餐吗？",point:"Is there a...? 询问有……吗？"},{en:"There ___ three baby birds.",ipa:"/ðeə θriː ˈbeɪbi bɜːdz/",zh:"有……三只小鸟。",point:"There are + 复数名词。"},{en:"Name school activities.",ipa:"/neɪm skuːl ækˈtɪvətiz/",zh:"说出学校活动。",point:"name = 说出。"},{en:"Use 'There is / are...' and 'Is / Are there...?' to talk about school activities.",ipa:"/juːz ðeər ɪz ɑː ænd ɪz ɑː ðə tu tɔːk əˈbaʊt skuːl ækˈtɪvətiz/",zh:"用“There is / are...”和“Is / Are there...?”来谈论学校活动。",point:"谈论学校活动。"},{en:"Say what I can learn from school activities.",ipa:"/seɪ wɒt aɪ kæn lɜːn frɒm skuːl ækˈtɪvətiz/",zh:"说出我能从学校活动中学到什么。 ,point:"现在进行时的一般疑问句。"},{en:"Write the word. c___",ipa:"/raɪt ðə wɜːd/",zh:"写单词。c___",point:"根据提示写单词。"},{en:"Is he wearing a scarf?",ipa:"/ɪz hiː ˈweərɪŋ ə skɑːf/",zh:"他戴着围巾吗？",point:"现在进行时的一般疑问句。"},{en:"What's the colour of her skirt?",ipa:"/wɒts ðə ˈkʌlə əv hɜː skɜːt/",zh:"她的裙子是什么颜色？",point:"询问颜色。"},{en:"Who's the gift for?",ipa:"/huːz ðə ɡɪft fɔː/",zh:"礼物是给谁的？",point:"who = 谁。"},{en:"Are you wearing shorts?",ipa:"/ɑː juː ˈweərɪŋ ʃɔːts/",zh:"你穿着短裤吗？",point:"现在进行时的一般疑问句。"},{en:"Write the word. w___",ipa:"/raɪt ðə wɜːd/",zh:"写单词。w___",point:"根据提示写单词。"},{en:"What's she wearing?",ipa:"/wɒts ʃiː ˈweərɪŋ/",zh:"她穿着什么？",point:"现在进行时。"},{en:"Is she wearing a hat?",ipa:"/ɪz ʃiː ˈweərɪŋ ə hæt/",zh:"她戴着帽子吗？",point:"现在进行时的一般疑问句。"},{en:"Are you wearing socks?",ipa:"/ɑː juː ˈweərɪŋ sɒks/",zh:"你穿着袜子吗？",point:"现在进行时的一般疑问句。"},{en:"Ask a question. Are you wearing...?",ipa:"/ɑːsk ə ˈkwestʃən ɑː juː ˈweərɪŋ/",zh:"问一个问题。你穿着……吗？",point:"提问。"},{en:"Who is he?",ipa:"/huː ɪz hiː/",zh:"他是谁？",point:"who = 谁。"},{en:"Write the word. s___",ipa:"/raɪt ðə wɜːd/",zh:"写单词。s___",point:"根据提示写单词。"},{en:"Silk comes from silkworms. People make scarves, dresses and shirts with it.",ipa:"/sɪlk kʌmz frɒm ˈsɪlkwɜːmz ˈpiːpl meɪk skɑːvz ˈdresɪz ænd ʃɜːts wɪð ɪt/",zh:"丝绸来自蚕。人们用它做围巾、连衣裙和衬衫。",point:"come from = 来自。make...with... = 用……制作……。"},{en:"What's the material? Where does it come from?",ipa:"/wɒts ðə məˈtɪəriəl weə dʌz ɪt kʌm frɒm/",zh:"这是什么材料？它来自哪里？",point:"material = 材料。"},{en:"Silk, cotton, wool.",ipa:"/sɪlk ˈkɒtn wʊl/",zh:"丝绸、棉花、羊毛。",point:"各种材料。"},{en:"Where do the materials come from?",ipa:"/weə duː ðə məˈtɪəriəlz kʌm frɒm/",zh:"这些材料来自哪里？",point:"come from = 来自。"},{en:"Name clothes.",ipa:"/neɪm kləʊðz/",zh:"说出服装名称。",point:"name = 说出。"},{en:"Use 'What are you wearing? - I'm wearing...' to talk about clothes.",ipa:"/juːz wɒt ɑː juː ˈweərɪŋ aɪm ˈweərɪŋ tu tɔːk əˈbaʊt kləʊðz/",zh:"用“What are you wearing? - I'm wearing...”来谈论服装。",point:"谈论服装。"},{en:"Talk about different clothes around the world.",ipa:"/tɔːk əˈbaʊt ˈdɪfrənt kləʊðz əˈraʊnd ðə wɜːld/",zh:"谈论世界各地不同的服装。",point:"around the world = 世界各地。"}]}
]}
];

var cgIdx=0,cuIdx=0,ct="word",cl=[],ci=0;
var voicesReady=false,englishVoice=null;
function $(id){return document.getElementById(id)}
function loadVoices(){if(!window.speechSynthesis)return;var v=window.speechSynthesis.getVoices();if(v.length>0){voicesReady=true;englishVoice=v.find(function(x){return x.lang==="en-US"})||v.find(function(x){return x.lang==="en-GB"})||v.find(function(x){return x.lang.startsWith("en")})}}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,500);setTimeout(loadVoices,1500)}
function updGrades(){$("gs").innerHTML=GRADES.map(function(g,i){return'<option value="'+i+'">'+g.name+'</option>'}).join("")}
function updUnits(){$("us").innerHTML=GRADES[cgIdx].units.map(function(u,i){return'<option value="'+i+'">'+u.name+'</option>'}).join("")}
function ref(){var u=GRADES[cgIdx].units[cuIdx];cl=u[FIELD_MAP[ct]]||[];ci=0;ui()}
function ui(){
  $("card").classList.remove("masked");
  if(!cl.length){$("bw").textContent="—";$("ipa").textContent="";$("mn").textContent="本类暂无内容";$("pg").textContent="0 / 0";$("pv").disabled=true;$("nx").disabled=true;$("pbox").classList.remove("show");return}
  var it=cl[ci];$("bw").textContent=it.en;$("bw").className="big"+(ct==="sentence"?" sm":"");$("ipa").textContent=it.ipa||"";$("mn").textContent=it.zh;$("pg").textContent=(ci+1)+" / "+cl.length;
  if(ct==="sentence"&&it.point){$("pcontent").textContent=it.point;$("pbox").classList.add("show")}else{$("pbox").classList.remove("show")}
  $("inp").value="";$("fb").textContent="试着拼写听到的内容吧~";$("fb").className="fb";$("pv").disabled=ci===0;$("nx").disabled=ci===cl.length-1;drawDots()
}
function drawDots(){var d=$("dots");d.innerHTML="";cl.forEach(function(_,i){var dot=document.createElement("div");dot.className="dot"+(i===ci?" on":"");dot.onclick=function(){if(i!==ci){ci=i;ui()}};d.appendChild(dot)})}
function speak(auto){
  if(!cl.length)return;
  
  if(!window.speechSynthesis){
    if(!auto) alert("当前环境不支持语音朗读。\n请点击右上角，选择“用其他应用打开”。");
    return;
  }
  
  // 尝试加载语音，但不强制拦截
  if(!voicesReady) loadVoices();
  
  window.speechSynthesis.cancel();
  window.speechSynthesis.resume();
  
  var u=new SpeechSynthesisUtterance(cl[ci].en);
  u.lang="en-US";
  u.rate=ct==="sentence"?0.75:0.85;
  u.pitch=1;
  u.volume=1;
  if(englishVoice) u.voice=englishVoice;
  
  // 如果朗读出错，在底部温和提示，不再弹窗
  u.onerror = function(e){
    $("fb").textContent = "⚠️ 语音未加载，请多试几次，或使用 Edge 的“大声朗读”功能";
    $("fb").className = "fb no";
  };
  
  window.speechSynthesis.speak(u);
}
function check(){
  if(!cl.length)return;
  $("card").classList.remove("masked");
  var a=$("inp").value.trim().toLowerCase().replace(/\s+/g," ");
  var b=cl[ci].en.toLowerCase().replace(/\s+/g," ");
  if(!a){$("fb").textContent="✏️ 先输入内容吧～";$("fb").className="fb no";return}
  if(a===b){$("fb").textContent="🎉 完全正确！好棒！";$("fb").className="fb ok"}
  else{$("fb").textContent='❌ 再试试？正确拼写是 "'+cl[ci].en+'"';$("fb").className="fb no"}
}
function clr(){$("inp").value="";$("fb").textContent="试着拼写听到的内容吧~";$("fb").className="fb";$("inp").focus()}
function goPrev(){if(ci>0){ci--;ui();setTimeout(function(){speak(true)},300)}}
function goNext(){if(ci<cl.length-1){ci++;ui();setTimeout(function(){speak(true)},300)}}
var overlay=$("overlay"),popup=$("popup"),plist=$("plist"),ptitle=$("ptitle");
function openPopup(type){var u=GRADES[cgIdx].units[cuIdx];var items=u[FIELD_MAP[type]]||[];var tn=type==="word"?"单词":type==="phrase"?"词组":"句子";ptitle.textContent="选择"+tn+"（"+items.length+"个）";plist.innerHTML="";items.forEach(function(item,i){var div=document.createElement("div");div.className="popup-item"+(i===ci&&ct===type?" cur":"");var right=item.zh;if(type==="sentence"&&item.point)right="💡 "+item.zh;div.innerHTML='<span class="pi-en">'+item.en+'</span><span class="pi-zh">'+right+'</span>';div.onclick=function(){ct=type;document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.getAttribute("data-type")===type)});var u2=GRADES[cgIdx].units[cuIdx];cl=u2[FIELD_MAP[type]]||[];ci=i;ui();closePopup();setTimeout(function(){speak(true)},200)};plist.appendChild(div)});overlay.classList.add("show");popup.classList.add("show")}
function closePopup(){overlay.classList.remove("show");popup.classList.remove("show")}
overlay.onclick=closePopup;$("pclose").onclick=closePopup;
$("gs").onchange=function(){cgIdx=parseInt(this.value);cuIdx=0;updUnits();ref()};
$("us").onchange=function(){cuIdx=parseInt(this.value);ref()};
document.querySelectorAll(".tab").forEach(function(tab){tab.onclick=function(){var type=tab.getAttribute("data-type");ct=type;document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});tab.classList.add("active");var u=GRADES[cgIdx].units[cuIdx];cl=u[FIELD_MAP[type]]||[];ci=0;ui();openPopup(type)}});
$("lb").onclick=function(){speak(false)};$("spk").onclick=function(){speak(false)};$("card").onclick=function(){speak(false)};$("cb").onclick=clr;$("ckb").onclick=check;
$("inp").onkeypress=function(e){if(e.key==="Enter"){e.preventDefault();check()}};
document.onkeydown=function(e){
  var inInput = document.activeElement === $("inp");
  if(inInput && (e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key==="ArrowUp"||e.key==="ArrowDown")) return;
  if(e.key==="ArrowLeft"){
    e.preventDefault();
    if(ci>0){ci--;ui();setTimeout(function(){speak(true)},300);}
  } else if(e.key==="ArrowRight"){
    e.preventDefault();
    if(ci<cl.length-1){ci++;ui();setTimeout(function(){speak(true)},300);}
  } else if(e.key==="ArrowUp"||e.key==="ArrowDown"){
    e.preventDefault();
    var tabs = document.querySelectorAll(".tab");
    var currentIndex = Array.from(tabs).findIndex(function(t){return t.classList.contains("active")});
    var nextIndex;
    if(e.key==="ArrowUp"){
      nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
    } else {
      nextIndex = (currentIndex + 1) % tabs.length;
    }
    var nextTab = tabs[nextIndex];
    var nextType = nextTab.getAttribute("data-type");
    ct = nextType;
    tabs.forEach(function(t){t.classList.remove("active")});
    nextTab.classList.add("active");
    var u = GRADES[cgIdx].units[cuIdx];
    cl = u[FIELD_MAP[nextType]] || [];
    ci = 0;
    ui();
    setTimeout(function(){speak(true)},300);
  }
};
$("inp").addEventListener("focus",function(){$("card").classList.add("masked")});
$("inp").addEventListener("input",function(){$("card").classList.add("masked")});
$("pv").onclick=goPrev;$("nx").onclick=goNext;
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()}}
updGrades();updUnits();ref();
</script>
</body>
